<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<meta name="theme-color" content="#0f2a4a">
<title>AI App Factory</title>
<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
<style>
:root{
  --navy:#0f2a4a; --navy-2:#16406e; --navy-3:#1f4f85;
  --red:#d92d20; --red-dark:#b42318;
  --bg:#f4f6fa; --card:#ffffff; --line:#e2e8f0;
  --ink:#101828; --muted:#667085; --ok:#12805c; --warn:#b54708; --blocked:#b42318;
  --shadow:0 1px 2px rgba(16,24,40,.06),0 1px 3px rgba(16,24,40,.10);
}
*{box-sizing:border-box}
html,body{margin:0;padding:0;max-width:100%;overflow-x:hidden}
@supports (overflow:clip){html,body{overflow-x:clip}}
body{font-family:-apple-system,BlinkMacSystemFont,"Segoe UI",Roboto,Helvetica,Arial,sans-serif;background:var(--bg);color:var(--ink);line-height:1.5;-webkit-font-smoothing:antialiased}
a{color:var(--navy-3);text-decoration:none}
button{font-family:inherit;cursor:pointer}
input,textarea,select{font-family:inherit;font-size:16px} /* 16px+ stops iOS Safari from auto-zooming the page when a field is tapped */
.wrap{max-width:1080px;margin:0 auto;padding:0 16px}

/* Top bar */
.topbar{background:var(--navy);color:#fff}
.topbar .wrap{display:flex;align-items:center;justify-content:space-between;height:56px}
.brand{display:flex;align-items:center;gap:10px;font-weight:700;font-size:17px;color:#fff}
.brand .dot{width:10px;height:10px;border-radius:50%;background:var(--red)}
.brand small{font-weight:500;opacity:.7;font-size:12px}
.navbtn{background:transparent;border:0;color:#cdd7e6;padding:8px 12px;border-radius:8px;font-size:14px}
.navbtn:hover{background:rgba(255,255,255,.08);color:#fff}
.navbtn.active{background:var(--navy-2);color:#fff}
.nav-desktop{display:flex;gap:4px}
.menu-toggle{display:none;background:transparent;border:0;color:#fff;font-size:22px;padding:4px 8px}
.nav-mobile{display:none;flex-direction:column;background:var(--navy-2);padding:6px 0}
.nav-mobile .navbtn{border-radius:0;text-align:left;padding:12px 20px}

/* Layout */
.page{padding:22px 0 60px}
.h1{font-size:22px;font-weight:700;margin:0 0 2px}
.sub{color:var(--muted);font-size:14px;margin:0 0 18px}
.row{display:flex;gap:14px;flex-wrap:wrap}
.grid{display:grid;gap:14px}
.grid-4{grid-template-columns:repeat(4,minmax(0,1fr))}
.grid-2{grid-template-columns:repeat(2,minmax(0,1fr))}
.grid>*{min-width:0}
.page{overflow-x:hidden;max-width:100vw}
@supports (overflow:clip){.page{overflow-x:clip}}
.fh,.fn{min-width:0;overflow-wrap:anywhere}
.card{min-width:0;max-width:100%;overflow-wrap:anywhere}
pre{max-width:100%;overflow-x:auto}
.card{background:var(--card);border:1px solid var(--line);border-radius:12px;box-shadow:var(--shadow)}
.card.p{padding:16px}
.stat{padding:16px}
.stat .k{font-size:12px;color:var(--muted);text-transform:uppercase;letter-spacing:.4px}
.stat .v{font-size:28px;font-weight:700;margin-top:6px}
.stat .v.red{color:var(--red)}
.stat .v.navy{color:var(--navy)}

/* Buttons */
.btn{background:var(--navy);color:#fff;border:0;padding:10px 16px;border-radius:9px;font-size:14px;font-weight:600}
.btn:hover{background:var(--navy-2)}
.btn.red{background:var(--red)} .btn.red:hover{background:var(--red-dark)}
.btn.ghost{background:#fff;color:var(--navy);border:1px solid var(--line)}
.btn.ghost:hover{background:#f2f5fa}
.btn.sm{padding:6px 11px;font-size:13px}
.btn:disabled{opacity:.5;cursor:not-allowed}

/* Forms */
label{display:block;font-size:13px;font-weight:600;margin:0 0 5px;color:#344054}
.field{margin-bottom:14px}
input[type=text],input[type=password],textarea,select{width:100%;padding:10px 12px;border:1px solid var(--line);border-radius:9px;background:#fff;color:var(--ink)}
input:focus,textarea:focus,select:focus{outline:2px solid rgba(31,79,133,.25);border-color:var(--navy-3)}
textarea{min-height:110px;resize:vertical}
.help{font-size:12px;color:var(--muted);margin-top:5px}

/* Badges */
.badge{display:inline-block;font-size:12px;font-weight:600;padding:3px 9px;border-radius:20px;border:1px solid transparent}
.b-active{background:#e7f4ee;color:var(--ok);border-color:#bfe3d2}
.b-idle{background:#eef1f6;color:var(--muted);border-color:var(--line)}
.b-done{background:#e8effb;color:var(--navy-2);border-color:#c7d9f4}
.b-blocked{background:#fdeceb;color:var(--blocked);border-color:#f6c9c6}
.b-phase{background:#fff4e8;color:var(--warn);border-color:#fbdcb8}

/* Lists */
.plist .item{display:flex;justify-content:space-between;align-items:center;padding:14px 16px;border-bottom:1px solid var(--line)}
.plist .item:last-child{border-bottom:0}
.plist .item:hover{background:#fafbfe}
.plist .nm{font-weight:600}
.plist .ds{color:var(--muted);font-size:13px;margin-top:2px;max-width:640px;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.muted{color:var(--muted)}
.small{font-size:13px}

/* Tabs */
.tabs{display:flex;gap:4px;border-bottom:1px solid var(--line);margin:6px 0 16px;flex-wrap:wrap}
.tab{background:transparent;border:0;padding:10px 14px;font-size:14px;font-weight:600;color:var(--muted);border-bottom:2px solid transparent}
.tab.active{color:var(--navy);border-bottom-color:var(--red)}

/* Agent cards */
.agent{padding:16px;display:flex;gap:14px;align-items:flex-start}
.agent .ic{font-size:26px;width:44px;height:44px;display:flex;align-items:center;justify-content:center;background:#eef2f8;border-radius:10px;flex-shrink:0}
.agent .nm{font-weight:700}
.agent .rl{font-size:13px;color:var(--muted);margin-top:3px}

/* Callouts */
.callout{border-radius:10px;padding:12px 14px;font-size:13.5px;margin:0 0 14px;border:1px solid}
.callout.warn{background:#fff8ef;border-color:#fbdcb8;color:#7a4a12}
.callout.info{background:#eef4fd;border-color:#c7d9f4;color:#1c3d63}
.callout.ok{background:#eefaf4;border-color:#bfe3d2;color:#0d5f45}

/* Code */
.file{border:1px solid var(--line);border-radius:10px;margin-bottom:12px;overflow:hidden}
.file .fh{display:flex;justify-content:space-between;align-items:center;background:#f7f9fc;padding:9px 12px;border-bottom:1px solid var(--line)}
.file .fh .fn{font-family:ui-monospace,Menlo,Consolas,monospace;font-size:13px;font-weight:600}
.file pre{margin:0;padding:12px;overflow:auto;max-height:340px;background:#0f2a4a;color:#e6edf6}
.file pre code{font-family:ui-monospace,Menlo,Consolas,monospace;font-size:12.5px;white-space:pre}

.activity{max-height:280px;overflow:auto}
.activity .a{display:flex;gap:10px;padding:8px 0;border-bottom:1px solid var(--line);font-size:13px}
.activity .a:last-child{border-bottom:0}
.activity .at{color:var(--muted);white-space:nowrap;font-variant-numeric:tabular-nums}
.spin{display:inline-block;width:14px;height:14px;border:2px solid rgba(255,255,255,.4);border-top-color:#fff;border-radius:50%;animation:sp .7s linear infinite;vertical-align:-2px;margin-right:6px}
.btn.ghost .spin{border:2px solid rgba(15,42,74,.3);border-top-color:var(--navy)}
@keyframes sp{to{transform:rotate(360deg)}}
.divider{height:1px;background:var(--line);margin:18px 0}
.kv{display:grid;grid-template-columns:150px 1fr;gap:6px 12px;font-size:14px}
.kv .kk{color:var(--muted)}
.right{text-align:right}
.flex-between{display:flex;justify-content:space-between;align-items:center;gap:12px;flex-wrap:wrap}

@media(max-width:820px){
  .grid-4{grid-template-columns:repeat(2,1fr)}
  .grid-2{grid-template-columns:minmax(0,1fr)}
  .nav-desktop{display:none}
  .menu-toggle{display:block}
  .kv{grid-template-columns:1fr}
}
</style>
</head>
<body>
<div id="app"></div>
<script>
"use strict";

/* ============================================================
   AI App Factory — Beta (agents, auto-fix loop, cloud sync)
   Active agents: Project Manager, Design, Builder, Supervisor/QA, Cybersecurity.
   Real execution: via an external sandbox runner (E2B) the user deploys;
   until its URL is set, QA/Security do static review only (never fake results).
   Persistence: localStorage (swap to Supabase for production).
   Architecture: single-file HTML PWA. Persistence: localStorage
   (swap to Supabase for production). API calls go direct from the
   browser — for a multi-user product put a Cloudflare Worker /
   Supabase Edge Function proxy in front and point Base URL at it.
   ============================================================ */

var LS_PROJECTS = "aiaf_projects_v1";
var LS_SETTINGS = "aiaf_settings_v1";

var state = { view: "dashboard", projectId: null, projectTab: "plan", menu: false, busy: {}, previewDevice: "mobile" };
var MAX_ITER = 3;

/* ---------- storage ---------- */
function loadProjects(){
  try{ var r = localStorage.getItem(LS_PROJECTS); return r ? JSON.parse(r) : []; }
  catch(e){ return []; }
}
var _saveWarnAt=0;
function saveProjects(list){
  try{ localStorage.setItem(LS_PROJECTS, JSON.stringify(list)); return true; }
  catch(e){
    /* Storage full: keep only the 3 newest checkpoints per project, retry once. */
    var trimmed=false;
    for(var i=0;i<list.length;i++){
      var hist=list[i] && list[i].buildHistory;
      if(hist && hist.length>3){ hist.length=3; trimmed=true; }
    }
    if(trimmed){
      try{
        localStorage.setItem(LS_PROJECTS, JSON.stringify(list));
        alert("Storage was full, so older code checkpoints were trimmed (3 newest kept per project). Your change was saved.");
        return true;
      }catch(e2){}
    }
    var now=Date.now();
    if(now-_saveWarnAt>10000){
      _saveWarnAt=now;
      alert("Storage is full — your last change was NOT saved. Export a backup (Projects > Export projects), then delete old projects.");
    }
    return false;
  }
}
function getSettings(){
  var def = { provider:"openai_compatible", baseUrl:"", apiKey:"", defaultModel:"",
              agentModels:{ pm:"", design:"", builder:"", qa:"", sec:"", engineer:"" }, pricePerMillion:0, totalTokens:0,
              sandboxUrl:"", sandboxSecret:"", stackMode:"single", tavilyKey:"", researchSearchModel:"openai/gpt-oss-20b", geminiKey:"", geminiModels:{ qa:"", sec:"", pi:"", research:"" } };
  try{
    var r = localStorage.getItem(LS_SETTINGS);
    if(!r) return def;
    var s = JSON.parse(r);
    if(!s.agentModels) s.agentModels = { pm:"", design:"", builder:"", qa:"", sec:"" };
    if(s.agentModels.qa===undefined) s.agentModels.qa="";
    if(s.agentModels.sec===undefined) s.agentModels.sec="";
    if(s.agentModels.engineer===undefined) s.agentModels.engineer="";
    if(s.sandboxUrl===undefined) s.sandboxUrl="";
    if(s.sandboxSecret===undefined) s.sandboxSecret="";
    if(s.stackMode===undefined) s.stackMode="single";
    /* Patch 21: optional separate Google Gemini provider for QA / Security (own quota). */
    if(s.geminiKey===undefined) s.geminiKey="";
    if(s.tavilyKey===undefined) s.tavilyKey="";
    if(!s.researchSearchModel || /^groq\/compound/i.test(s.researchSearchModel)) s.researchSearchModel="openai/gpt-oss-20b";  /* compound models were retired by Groq on 21 Sep 2026 */
    if(!s.geminiModels || typeof s.geminiModels!=="object") s.geminiModels={ qa:"", sec:"" };
    if(s.geminiModels.pi===undefined) s.geminiModels.pi="";
    if(s.geminiModels.research===undefined) s.geminiModels.research="";
    /* Patch 9.1: model to use when the main model hits its daily limit (Groq: separate quota). */
    if(s.fallbackModel===undefined) s.fallbackModel = /groq/i.test(s.baseUrl||"") ? "openai/gpt-oss-20b" : "";
    return s;
  }catch(e){ return def; }
}
function saveSettings(s){
  try{ localStorage.setItem(LS_SETTINGS, JSON.stringify(s)); }catch(e){}
}
function getProject(id){
  var list = loadProjects();
  for(var i=0;i<list.length;i++){ if(list[i].id===id) return list[i]; }
  return null;
}
function upsertProject(p){
  p.updatedAt = new Date().toISOString();
  cloudMarkDirty(p.id, p);
  var list = loadProjects(); var found=false;
  for(var i=0;i<list.length;i++){ if(list[i].id===p.id){ list[i]=p; found=true; break; } }
  if(!found) list.unshift(p);
  saveProjects(list);
}

/* ---------- utils ---------- */
function uid(){ return "p"+Date.now().toString(36)+Math.floor(Math.random()*1000).toString(36); }
function nowStr(){
  var d=new Date();
  function z(n){ return (n<10?"0":"")+n; }
  return z(d.getHours())+":"+z(d.getMinutes());
}
function esc(s){
  s = (s===undefined||s===null) ? "" : String(s);
  return s.replace(/&/g,"&amp;").replace(/</g,"&lt;").replace(/>/g,"&gt;")
          .replace(/"/g,"&quot;").replace(/'/g,"&#39;");
}
function safeColor(hex){
  hex = (hex===undefined||hex===null) ? "" : String(hex).trim();
  if(/^#?[0-9a-fA-F]{3}$|^#?[0-9a-fA-F]{6}$|^#?[0-9a-fA-F]{8}$/.test(hex)){ return hex.charAt(0)==="#"?hex:("#"+hex); }
  return "#888888";
}
function designSummary(p){
  if(!p.design) return "";
  var d=p.design, out="DESIGN SPEC (implement this exactly):\n";
  var dt=d.design_tokens||d.design_system;
  if(dt){
    if(dt.colors){ var cols=[]; for(var i=0;i<dt.colors.length;i++){ var c=dt.colors[i];
        cols.push(typeof c==="string"?c:((c.name||"")+" "+(c.hex||"")+(c.role?(" ("+c.role+")"):""))); }
      out+="Colors: "+cols.join(", ")+"\n"; }
    if(dt.typography){ out+="Typography: "+(typeof dt.typography==="string"?dt.typography:JSON.stringify(dt.typography))+"\n"; }
    if(dt.spacing){ out+="Spacing: "+(Array.isArray(dt.spacing)?dt.spacing.join(", "):dt.spacing)+"\n"; }
    if(dt.radius){ out+="Radius: "+dt.radius+"\n"; }
  }
  if(d.components&&d.components.length){ var cn=[]; for(var k=0;k<d.components.length;k++){ var cc=d.components[k];
      cn.push(typeof cc==="string"?cc:((cc.name||"")+(cc.spec?(": "+cc.spec):""))); } out+="Components: "+cn.join("; ")+"\n"; }
  if(d.responsive_notes) out+="Responsive: "+d.responsive_notes+"\n";
  return out;
}
function logActivity(p, agent, msg){
  if(!p.activity) p.activity=[];
  p.activity.unshift({ t:nowStr(), agent:agent, msg:msg });
  if(p.activity.length>60) p.activity.length=60;
}
function extractJson(text){
  if(!text) return null;
  var t = String(text).trim();
  var fence = String.fromCharCode(96,96,96);
  t = t.replace(new RegExp("^"+fence+"(?:json)?","i"),"").replace(new RegExp(fence+"$"),"").trim();
  var a = t.indexOf("{"); var b = t.lastIndexOf("}");
  var a2 = t.indexOf("["); var b2 = t.lastIndexOf("]");
  var cand = null;
  if(a!==-1 && b!==-1){ cand = t.substring(a,b+1); }
  if(a2!==-1 && b2!==-1 && (a===-1 || a2<a)){ cand = t.substring(a2,b2+1); }
  if(!cand) cand = t;
  try{ return JSON.parse(cand); }catch(e){ return null; }
}

/* ---------- model layer ---------- */
function modelFor(agentKey){
  var s = getSettings();
  var m = s.agentModels && s.agentModels[agentKey];
  return (m && m.length) ? m : s.defaultModel;
}
function addTokens(n){
  var s = getSettings(); s.totalTokens = (s.totalTokens||0) + (n||0); saveSettings(s);
}
/* ---------- Patch 9: token saver + quota meter ----------
   Every model reply's token count is logged per model with a timestamp (this device),
   so we can show roughly how much of a provider's rolling 24-hour budget is used.
   A daily-limit (TPD) 429 calibrates the numbers with the provider's own figures. */
var TOK_WINDOW_MS = 24*3600*1000, LS_TOKLOG = "aiaf_toklog_v1", LS_TOKLIM = "aiaf_toklim_v1";
function tokLedger(){
  try{ var l=JSON.parse(localStorage.getItem(LS_TOKLOG)||"[]"), c=Date.now()-TOK_WINDOW_MS;
       return (Array.isArray(l)?l:[]).filter(function(e){ return e && e.t>c && e.n>0; }); }catch(e){ return []; }
}
function tokRecord(model, n){
  if(!model || !(n>0)) return;
  try{ var l=tokLedger(); l.push({ t:Date.now(), m:String(model), n:n }); if(l.length>3000) l=l.slice(-3000);
       localStorage.setItem(LS_TOKLOG, JSON.stringify(l)); }catch(e){}
}
function tokSince(model, since){
  var l=tokLedger(), s=0;
  for(var i=0;i<l.length;i++){ if((!model || l[i].m===model) && l[i].t>since) s+=l[i].n; }
  return s;
}
function tokLimits(){ try{ var o=JSON.parse(localStorage.getItem(LS_TOKLIM)||"{}"); return (o&&typeof o==="object")?o:{}; }catch(e){ return {}; } }
function noteTpd(model, raw){
  var m=String(raw||"").match(/tokens per day[^:]*:\s*Limit\s+(\d+)[^0-9]+Used\s+(\d+)[^0-9]+Requested\s+(\d+)/i);
  if(!m || !model) return null;
  var info={ limit:parseInt(m[1],10), used:parseInt(m[2],10), requested:parseInt(m[3],10), at:Date.now() };
  try{ var o=tokLimits(); o[model]=info; localStorage.setItem(LS_TOKLIM, JSON.stringify(o)); }catch(e){}
  return info;
}
/* Best estimate of tokens used in the last 24 h for a model. If the provider told us its own
   figure in the last hour, start from that and add what this device used since. */
function quotaInfo(model){
  var lim=tokLimits()[model], local=tokSince(model, Date.now()-TOK_WINDOW_MS);
  var used=local, fromServer=false;
  if(lim && lim.at && Date.now()-lim.at < 3600000){ used=Math.max(local, lim.used + tokSince(model, lim.at)); fromServer=true; }
  var limit=lim && lim.limit ? lim.limit : 0;
  return { model:model, used:used, limit:limit, left:(limit?Math.max(0,limit-used):null), fromServer:fromServer };
}
function fmtK(n){ n=Number(n)||0; return n>=1000 ? (Math.round(n/100)/10)+"k" : String(n); }
function fmtDur(ms){
  var m=Math.ceil((Number(ms)||0)/60000); if(m<1) return "under a minute";
  var h=Math.floor(m/60); m=m%60; return (h?(h+"h "):"")+(m?(m+"m"):"").trim();
}
function clockIn(ms){ var d=new Date(Date.now()+(Number(ms)||0)); function z(n){ return (n<10?"0":"")+n; } return z(d.getHours())+":"+z(d.getMinutes()); }
function quotaLine(){
  var model=modelFor("builder"); if(!model) return "";
  var q=quotaInfo(model);
  var t="Quota \u00b7 "+model+": \u2248"+fmtK(q.used)+" tokens used in the last 24 h";
  if(q.limit) t+=" of "+fmtK(q.limit)+" \u00b7 \u2248"+fmtK(q.left)+" left";
  t+=q.fromServer ? " (provider figure)" : " (this device)";
  var fb=String(getSettings().fallbackModel||"").trim();
  if(fb && fb!==model){
    var f=quotaInfo(fb);
    t+=" \u00b7 Fallback "+fb+": \u2248"+fmtK(f.used)+" used"+(f.limit?(" of "+fmtK(f.limit)):"");
  }
  return t;
}
/* Average tokens of recent auto-fix rounds (default 15k until we have data). */
function roundCostEstimate(p){
  var r=(p&&p.autofix&&p.autofix.rounds)||[], s=0, n=0;
  for(var i=r.length-1;i>=0 && n<3;i--){ if(r[i].tokens>0){ s+=r[i].tokens; n++; } }
  return n ? Math.round(s/n) : 15000;
}
/* QA only needs structure and behaviour: drop CSS and indentation to save input tokens.
   (The Builder still gets the exact code, because its edits must match it verbatim.) */
function qaCodeCtx(files, keepCss){
  var out="";
  for(var k=0;k<files.length;k++){
    var c=String(files[k].content||"");
    if(!keepCss && (/\.html?$/i.test(files[k].path||"") || /<style/i.test(c))){
      c=c.replace(/(<style[^>]*>)[\s\S]*?(<\/style>)/gi, "$1/* CSS omitted for QA to save tokens */$2");
    } else if(!keepCss && /\.css$/i.test(files[k].path||"")){ c="/* CSS omitted for QA to save tokens */"; }
    c=c.split("\n").map(function(l){ return l.replace(/^\s+/,"").replace(/\s+$/,""); }).filter(function(l){ return l.length; }).join("\n");
    out+="=== "+files[k].path+" ===\n"+c+"\n";
  }
  return out;
}
/* ---------- Patch 9.2: smaller Builder requests (free tier: 8k tokens per minute) ----------
   The Builder gets the code without indentation and blank lines, and without CSS when no
   open issue is about layout/styling. Its search/replace edits are matched line-by-line
   ignoring indentation, so they still apply to the real file. */
var STYLE_WORDS=/layout|style|css|align|bold|colou?r|font|spacing|margin|padding|width|height|wrap|overflow|screen|responsive|design|look|ugly|button size|position|center|centre/i;
function needsCss(text){ return STYLE_WORDS.test(String(text||"")); }
function builderCodeCtx(files, keepCss){
  var out="";
  for(var k=0;k<files.length;k++){
    var c=String(files[k].content||"");
    if(!keepCss){
      if(/\.css$/i.test(files[k].path||"")) c="/* CSS omitted: not needed for this change */";
      else c=c.replace(/(<style[^>]*>)[\s\S]*?(<\/style>)/gi, "$1/* CSS omitted: not needed for this change. Do not edit CSS. */$2");
    }
    c=c.replace(/\r\n/g,"\n").split("\n").map(function(l){ return l.replace(/^\s+/,"").replace(/\s+$/,""); }).filter(function(l){ return l.length; }).join("\n");
    out+="=== "+files[k].path+" ===\n"+c+"\n";
  }
  return out;
}
/* Find 'find' in 'body' ignoring indentation / blank lines. Returns {start,end} in body or null (or "ambiguous"). */
function looseLocate(body, find){
  var fl=String(find).split("\n").map(function(l){ return l.trim(); }).filter(function(l){ return l.length; });

    if(c!==1){ var t=find.trim(); if(t && countOcc(body,t)===1){ find=t; rep=rep.trim(); c=1; } }
    if(c!==1){
      var loc=looseLocate(body, find);
      if(!loc){ loc=wsLocate(body, find); if(loc && loc!=="ambiguous") rep=rep.trim(); }
      if(loc && loc!=="ambiguous"){ f.content=body.slice(0,loc.start)+rep+body.slice(loc.end); applied++; continue; }
      failed.push(((c||loc==="ambiguous")?"ambiguous":"not found")+": "+find.slice(0,60)); continue;
    }
    var at=body.indexOf(find);
    f.content=body.slice(0,at)+rep+body.slice(at+find.length); applied++;
  }
  return { files:out, applied:applied, failed:failed };
}
function runEditFix(p, usr, label){
  var sys="You are the BUILDER applying "+label+". Do NOT rewrite whole files. Return ONLY small search/replace edits. "
    +"CURRENT CODE is shown without indentation (and possibly without CSS) to save tokens; copy find snippets exactly as shown there, they are matched ignoring indentation. "
    +"Each edit: path (file path from CURRENT CODE), find (an exact snippet copied VERBATIM from CURRENT CODE, unique in that file, "
    +"usually 2-12 lines with enough context), replace (the new text for that snippet). Keep edits minimal; preserve everything else. "
    +(stackRule() ? "Keep the existing single-file architecture. " : "")
    +"Tips: if a form's error messages never appear in a test, native HTML validation (min, max, required on inputs) is probably blocking the submit event — add novalidate to the <form> and validate in JS. "
    +"If the page is wider than the phone screen, add *,*::before,*::after{box-sizing:border-box} and remove any overflow:hidden that overrides overflow-x:auto. "
    +"A 'UI test failed' bug can come from a WRONG TEST: if the current code already behaves as the REQUIREMENTS say, do NOT change working code for it — list that bug title in wrong_tests instead. "
    +"Return PLAIN TEXT in this exact format (NOT JSON, no markdown fences, nothing else):\n"
    +"@@SUMMARY one short line\n@@EDIT index.html\n@@FIND\n(exact lines copied from CURRENT CODE)\n@@REPLACE\n(the new lines)\n@@END\n"
    +"Repeat @@EDIT ... @@END for each edit. Write code inside FIND and REPLACE exactly as code, with no escaping. "
    +"If you judge a UI test wrong, add a line: @@WRONG_TEST its title. For something you could not do, add a line: @@NOT_DONE what.";
  return callModel("builder", sys, usr).then(function(r){
    var j=parseEditBlocks(r.text)||extractJson(r.text);
    if(j && Array.isArray(j.edits) && !j.edits.length && Array.isArray(j.wrong_tests) && j.wrong_tests.length){
      var same=JSON.parse(JSON.stringify(p.build||{}));
      same.summary="No code change: Builder judged "+j.wrong_tests.length+" UI test(s) wrong ("+j.wrong_tests.join("; ").slice(0,200)+"). Check them in Preview.";
      logActivity(p,"Builder",same.summary);
      return same;
    }
    if(!j || !Array.isArray(j.edits) || !j.edits.length) throw new Error("no usable edits");
    var res=applyEdits((p.build&&p.build.files)||[], j.edits);
    if(res.failed.length || !res.applied) throw new Error("edits did not apply ("+res.failed.slice(0,2).join("; ")+")");
    var nb=JSON.parse(JSON.stringify(p.build||{}));
    nb.files=res.files; nb.summary=String(j.summary||label)+" ["+res.applied+" edit(s)]"; nb._edits=j.edits;
    nb.not_implemented=j.not_implemented||nb.not_implemented||[];
    return nb;
  });
}
function withEditFallback(p, usr, label, fullCall, usrEdit){
  return runEditFix(p, usrEdit||usr, label).then(function(nb){ if(nb) delete nb._edits; return nb; }).catch(function(e){
    if(e && (e.status===429 || e.status===413 || e.tooLarge)) throw e;
    logActivity(p,"Builder","Edit-mode fix failed ("+String(e&&e.message||e).slice(0,120)+") \u2014 falling back to full rewrite.");
    return fullCall();
  });
}
function runBuilderFix(p){
  var bugs=(p.qa&&p.qa.bugs)||[]; var bugText="";
  for(var i=0;i<bugs.length;i++){ if(bugs[i].fromUser) continue; /* sent once below via openUserBugsText */
    bugText+="- ["+bugs[i].severity+"] "+bugs[i].title+": "+bugs[i].detail+" (suggested fix: "+bugs[i].fix+")\n"; }
  if(!bugText) bugText="(none besides the user-reported issues below)\n";
  var execText="";
  if(p.exec && p.exec.configured && p.exec.success===false){
    var rs=p.exec.results||[];
    for(var r=0;r<rs.length;r++){
      if(Number(rs[r].exitCode)!==0){
        execText+="$ "+rs[r].cmd+" (exit "+rs[r].exitCode+")\n"+String(rs[r].stderr||rs[r].stdout||"").slice(-1500)+"\n";
      }
    }
  }
  var files=(p.build&&p.build.files)||[]; var filesCtx="";
  for(var k=0;k<files.length;k++){ filesCtx+="=== "+files[k].path+" ===\n"+files[k].content+"\n"; }
  var sys="You are the BUILDER agent applying QA fixes. Return the FULL updated file set (not a diff). "
    +"Preserve working functionality; change only what the bugs and sandbox failures require. "
    +"If real sandbox failures are included, your fix must make those commands succeed. "
    +(stackRule() ? "Keep the existing single-file architecture; do not introduce frameworks or build tooling. Keep following this:"+DATA_RULE+" " : "")
    +FILE_FORMAT;
  var issues9="QA BUGS TO FIX:\n"+bugText
    +(execText?("\nSANDBOX FAILURES (real, from the current build):\n"+execText):"")
    +openUserBugsText(p, true);
  var usr="REQUIREMENTS:\n"+p.description+"\n\n"+designSummary(p)+"\n"+issues9+"\nCURRENT CODE:\n"+filesCtx;
  if(isLargeApp(p)) return runLargeFix(p, issues9, "QA fixes");
  var usrEdit="REQUIREMENTS:\n"+p.description+"\n\n"+issues9+"\nCURRENT CODE:\n"+builderCodeCtx(files, needsCss(issues9));
  return withEditFallback(p, usr, "QA fixes", function(){ return callModel("builder", sys, usr).then(function(r){
    return parseFullFix(p, r.text, "Builder fix");
  }); }, usrEdit);
}

function rollbackBuild(id, ix){

  var snap=p.buildHistory[ix];
  if(snap.filesOmitted || !(snap.files&&snap.files.length)){ alert("This checkpoint's code is stored on the device that made it (large app), so it cannot be restored here."); return; }
  var restored={ files:JSON.parse(JSON.stringify(snap.files||[])), summary:(snap.summary||""),
    run_commands:(snap.run_commands||[]).slice(), how_to_run:(snap.how_to_run||""),
    not_implemented:(snap.not_implemented||[]).slice() };
  /* replaceBuild checkpoints the CURRENT build first, so restoring never loses it,

  replaceBuild(p, restored, "restore of v"+snap.v);
  p.qa=null; p.security=null; p.autofix=null; p.iteration=0; p.secIteration=0;
  p.phase="Restored v"+snap.v;

/* ---------- Auto-fix loop: QA -> Builder -> Execute -> QA ---------- */
var AUTOFIX = { cancel:false };
var AUTOFIX_LABEL = { pass:"QA passed", not_needed:"Not needed", blocked:"Blocked by QA", stopped:"Stopped",
  cancelled:"Cancelled", limit:"Iteration limit", no_progress:"No progress", regressed:"Regressed", error:"Error" };
function bugSig(qa){
  return ((qa&&qa.bugs)||[]).map(function(b){ return String((b&&b.title)||"").toLowerCase().replace(/\s+/g," ").trim(); }).sort().join("|");
}
function autofixStatus(p){
  var o=p.autofix&&p.autofix.outcome;
  if(o==="pass") return "done";
  if(o==="not_needed") return "skipped";
  return "stopped";
}
/* Runs fix rounds until QA passes or a stop condition hits. Never loops past
   MAX_ITER, stops on repeated or growing bug lists, and checkpoints every
   build it replaces (via replaceBuild). Resolves with the outcome key. */
function runAutoFixLoop(p, onProgress){
  onProgress = onProgress || function(){};
  AUTOFIX.cancel=false;
  p.autofix={ rounds:[], outcome:null, startedAt:nowStr() };
  var lastSig=bugSig(p.qa);
  function finish(outcome, msg){
    p.autofix.outcome=outcome; logActivity(p,"Auto-fix",msg); upsertProject(p); return outcome;
  }
  function round(){
    if(!p.qa){
      onProgress("QA review");
      return runQA(p).then(function(q){ p.qa=q; upsertProject(p); lastSig=bugSig(q); return round(); });
    }
    var n=p.autofix.rounds.length;
    var v=p.qa.verdict;
    var bugs=p.qa.bugs||[];
    if(v==="pass") return Promise.resolve(finish(n?"pass":"not_needed", n?("QA passed after "+n+" round(s)."):"QA already passed — nothing to fix."));
    if(v==="blocked") return Promise.resolve(finish("blocked","Stopped: QA verdict BLOCKED — needs your review."));
    if(!bugs.length) return Promise.resolve(finish(n?"stopped":"not_needed","Stopped: QA requested changes but listed no bugs."));
    if(AUTOFIX.cancel) return Promise.resolve(finish("cancelled","Cancelled by you after "+n+" round(s)."));
    if((p.iteration||0)>=MAX_ITER) return Promise.resolve(finish("limit","Stopped at iteration limit ("+MAX_ITER+") with "+bugs.length+" bug(s) left."));
    p.iteration=(p.iteration||0)+1;
    var it=p.iteration, before=bugs.length, tokStart=Date.now();
    onProgress("round "+it+"/"+MAX_ITER+" — Builder fixing "+before+" bug(s)");
    return runBuilderFix(p).then(function(j){
      replaceBuild(p, j, "Auto-fix round "+it);   /* checkpoints the previous build */
      p.qa=null; p.security=null;                  /* both were about the old build */
      logActivity(p,"Builder","Auto-fix round "+it+": applied fixes for "+before+" bug(s).");
      upsertProject(p);
      onProgress("round "+it+"/"+MAX_ITER+" — executing");
      return wfExecute(p);
    }).then(function(){
      onProgress("round "+it+"/"+MAX_ITER+" — QA re-review");
      return runQA(p);
    }).then(function(q){
      p.qa=q;
      var after=(q.bugs||[]).length, sig=bugSig(q);
      p.autofix.rounds.push({ n:it, before:before, after:after, verdict:q.verdict||"?", runtime:runtimeLabel(p), tokens:tokSince(null, tokStart-1) });
      logActivity(p,"Supervisor/QA","Auto-fix round "+it+": "+before+" → "+after+" bug(s), verdict "+(q.verdict||"?")+".");
      upsertProject(p);
      if(q.verdict==="changes_requested" && after>0){
        if(sig===lastSig) return finish("no_progress","Stopped: the same bugs came back — no progress. Review manually or restore a checkpoint.");
        if(after>before) return finish("regressed","Stopped: bug count went up ("+before+" → "+after+"). The previous build is saved as a checkpoint.");
      }
      lastSig=sig;
      return round();
    });
  }
  return round();
}
function stepAutoFix(id){
  var p=getProject(id); if(!p||!p.build) return;
  if(!p.qa){ alert("Run QA first."); return; }
  if((p.iteration||0)>=MAX_ITER){
    if(!confirm("Iteration limit reached ("+MAX_ITER+"). Reset the counter and allow "+MAX_ITER+" more rounds?")) return;
    p.iteration=0; logActivity(p,"You","Reset the fix-iteration counter.");
  }
  var q9=quotaInfo(modelFor("builder")), need9=roundCostEstimate(p);
  var fb9=String(getSettings().fallbackModel||"").trim(), fq9=fb9?quotaInfo(fb9):null;
  var fbOk9=!!(fb9 && fb9!==q9.model && !(fq9.limit && fq9.left!==null && fq9.left < need9));
  if(q9.limit && q9.left!==null && q9.left < need9 && !fbOk9){
    if(!confirm("Only about "+fmtK(q9.left)+" tokens are left today for "+q9.model+", and one fix round uses about "+fmtK(need9)+".\n\nIt will probably stop with a daily-limit error. Start anyway?")) return;
  }
  setBusy("autofix",true); state.projectTab="qa"; render();
  runAutoFixLoop(p, function(msg){ p.phase="Auto-fix: "+msg; upsertProject(p); render(); })
    .then(function(o){ p.phase="Auto-fix: "+(AUTOFIX_LABEL[o]||o); upsertProject(p); setBusy("autofix",false); render(); })
    .catch(function(e){
      if(!p.autofix) p.autofix={ rounds:[] };
      p.autofix.outcome="error"; p.phase="Auto-fix error";
      logActivity(p,"Auto-fix","Error: "+e.message);
      upsertProject(p); setBusy("autofix",false); render();
      alert(e.message+"\n\n"+classifyError(e));
    });
}
function cancelAutoFix(){ AUTOFIX.cancel=true; render(); }

/* Status follows the latest QA + Security results (never un-completes a project). */
function refreshStatus(p){
  if(p.status==="completed") return;
  var qaBlocked = !!(p.qa && p.qa.verdict==="blocked");
  var rr = p.security && p.security.risk_rating;
  var secBlocked = (rr==="critical" || rr==="high");
  p.status = (qaBlocked || secBlocked) ? "blocked" : "active";
}

/* ---------- Patch 5: user bug reports ----------
   Bugs the owner finds while testing the preview. They stay OPEN until the
   owner marks them resolved, and are fed to QA and the Builder every round. */
function openUserBugs(p){
  var out=[], l=p.userBugs||[];
  for(var i=0;i<l.length;i++){ if(l[i] && l[i].status!=="resolved") out.push(l[i]); }
  return out;
}
function openUserBugsText(p, brief){
  var l=openUserBugs(p); if(!l.length) return "";
  var t="\nUSER-REPORTED ISSUES (the owner tested the running app; treat these as real):\n";
  /* Patch 9: the title is just the start of the detail, so the Builder gets the detail once. */
  for(var i=0;i<l.length;i++){ t+="- ["+l[i].severity+"] "+(brief?"":(l[i].title+": "))+l[i].detail+"\n"; }
  return t;
}
function reportBug(id){
  var p=getProject(id); if(!p||!p.build) return;
  var ta=document.getElementById("ub_text"), sv=document.getElementById("ub_sev"), af=document.getElementById("ub_autofix");
  var text=ta ? String(ta.value||"").trim() : "";
  if(text.length<5){ alert("Describe what is wrong (at least a few words)."); return; }
  var sev=(sv && /^(high|medium|low)$/.test(sv.value)) ? sv.value : "medium";
  var title="[You] "+(text.length>80 ? (text.substring(0,77)+"...") : text).replace(/\s+/g," ");
  var bug={ id:"ub"+Date.now().toString(36), severity:sev, title:title, detail:text, status:"open", ts:nowStr(), buildSeq:(Number(p.buildSeq)||0) };
  if(!p.userBugs) p.userBugs=[];
  p.userBugs.push(bug);
  if(!p.qa) p.qa={ summary:"Issue reported by you after testing.", verified:[], failed:[], untested:[], bugs:[], verdict:"changes_requested" };
  if(!p.qa.bugs) p.qa.bugs=[];
  p.qa.bugs.push({ severity:sev, title:title, detail:text, fix:"Make the app behave as the owner describes.", fromUser:true });
  if(p.qa.verdict!=="blocked") p.qa.verdict="changes_requested";
  if(p.status==="completed"){ p.status="active"; logActivity(p,"You","Re-opened the project with a bug report."); }
  logActivity(p,"You","Reported bug ["+sev+"]: "+title);
  p.phase="Bug reported";
  upsertProject(p);
  if(af && af.checked){ stepAutoFix(id); } else { render(); }
}
function bugUnchanged(p, b){ return !!(b && b.buildSeq!=null && (Number(p.buildSeq)||0)===Number(b.buildSeq)); }
function resolveUserBug(id, bid){
  var p=getProject(id); if(!p||!p.userBugs) return;
  for(var j=0;j<p.userBugs.length;j++){
    if(p.userBugs[j].id===bid && bugUnchanged(p, p.userBugs[j])){
      if(!confirm("The code has NOT changed since you reported this bug (no new checkpoint), so it is probably not fixed yet.\n\nMark it fixed anyway?")) return;
    }
  }
  for(var i=0;i<p.userBugs.length;i++){
    if(p.userBugs[i].id===bid){ p.userBugs[i].status="resolved"; p.userBugs[i].resolvedAt=nowStr(); logActivity(p,"You","Confirmed fixed: "+p.userBugs[i].title); }
  }
  upsertProject(p); render();
}
function reopenUserBug(id, bid){
  var p=getProject(id); if(!p||!p.userBugs) return;
  for(var i=0;i<p.userBugs.length;i++){
    if(p.userBugs[i].id===bid){ p.userBugs[i].status="open"; delete p.userBugs[i].resolvedAt; p.userBugs[i].buildSeq=(Number(p.buildSeq)||0); logActivity(p,"You","Still broken: "+p.userBugs[i].title); }
  }
  if(p.status==="completed"){ p.status="active"; p.phase="Bug re-opened"; logActivity(p,"You","Re-opened the project (bug still broken)."); }
  upsertProject(p); render();
}

/* ---------- Phase 4: Cybersecurity agent ---------- */
function callSandbox(p, commands){
  var s=getSettings();
  if(!s.sandboxUrl) return Promise.resolve({ configured:false });
  var files=(p.build&&p.build.files)||[];
  var body={ secret:s.sandboxSecret||"", commands:commands,
             files:files.map(function(f){ return { path:f.path, content:f.content }; }) };
  return runnerFetch(s.sandboxUrl, body)
    .then(function(res){ return res.text().then(function(raw){
      if(!res.ok) throw new Error("Sandbox error ("+res.status+"): "+String(raw).slice(0,200));
      var d; try{ d=JSON.parse(raw); }catch(e){ throw new Error("Bad sandbox response."); }

    if(iss.soft.length){ h+='<br><span class="small">Noted: '+esc(iss.soft.join("; "))+'.</span>'; }

  }
  h+='</div>';

}

/* ---------- Patch 11: import an existing app ----------
   Bring an existing single-file HTML app into the factory so Preview, Report bug,
   QA, Security and Deploy work on it. The file is stored as the project's build. */
var IMPORT_MAX_BYTES = 2*1024*1024;
function approxTokens(text){ return Math.round(String(text||"").length/3.6); }
function aiSizeInfo(p){
  var files=(p.build&&p.build.files)||[];
  var builder=approxTokens(builderCodeCtx(files, false)), qa=approxTokens(qaCodeCtx(files));
  var big=Math.max(builder, qa);
  return { builder:builder, qa:qa, tooBig: big>6500, large: builder>LARGE_APP_TOKENS };
}
function looksLikeHtml(t){ return /<!doctype html|<html[\s>]|<body[\s>]|<script[\s>]/i.test(String(t||"").slice(0,20000)); }
function htmlTitle(t){ var m=String(t||"").match(/<title[^>]*>([^<]{1,80})<\/title>/i); return m ? m[1].replace(/\s+/g," ").trim() : ""; }
function readHtmlFile(ev, cb){
  var f=ev && ev.target && ev.target.files && ev.target.files[0];
  if(ev && ev.target) try{ ev.target.value=""; }catch(e){}
  if(!f) return;
  if(f.size>IMPORT_MAX_BYTES){ alert("That file is "+Math.round(f.size/1024)+" KB. The limit is "+Math.round(IMPORT_MAX_BYTES/1024)+" KB (phone storage)."); return; }
  var rd=new FileReader();
  rd.onload=function(){
    var t=String(rd.result||"");
    if(!looksLikeHtml(t)){ alert("This does not look like an HTML app file. Pick the app's .html file."); return; }
    cb(t, f.name||"index.html");
  };
  rd.onerror=function(){ alert("Could not read the file."); };
  rd.readAsText(f);
}
function importAppClick(){ var el=document.getElementById("importAppFile"); if(el) el.click(); }
function importApp(ev){
  readHtmlFile(ev, function(text, fname){
    if(text.length>600000 && !confirm("This app is "+Math.round(text.length/1024)+" KB. It uses a lot of phone storage (the app plus 1 checkpoint). AI changes use section editing. Continue?")) return;
    var nm=prompt("Project name:", htmlTitle(text) || String(fname).replace(/\.html?$/i,""));
    if(nm===null) return; nm=String(nm).trim()||"Imported app";
    var ds=prompt("What does this app do? One or two sentences \u2014 QA uses this as the requirements.", "");
    if(ds===null) return; ds=String(ds).trim()||("Existing app \""+nm+"\" imported from "+fname+". Keep all current features working.");
    var p={ id:uid(), name:nm, description:ds, status:"active", phase:"Imported", imported:true,
            createdAt:new Date().toISOString(),
            plan:{ overview:ds, recommended_stack:["Existing single-file HTML app (imported)"], tasks:[], risks:[], clarifications:[] },
            design:null, approvals:{ plan:true }, activity:[], buildHistory:[],
            build:{ files:[{ path:"index.html", language:"html", content:text }], summary:"Imported from "+fname+" ("+Math.round(text.length/1024)+" KB).",
                    run_commands:[], how_to_run:"Open index.html in a browser.", not_implemented:[] } };
    logActivity(p,"You","Imported existing app from "+fname+" ("+Math.round(text.length/1024)+" KB).");
    var sz=aiSizeInfo(p);
    if(sz.tooBig) logActivity(p,"Orchestrator","Large app: AI steps need about "+fmtK(Math.max(sz.builder,sz.qa))+" tokens per call, above the free Groq limit (8k/min). Preview, Deploy and manual testing work; AI fixes need a higher-limit model.");
    upsertProject(p);
    state.view="project"; state.projectId=p.id; state.projectTab="build"; render();
  });
}
function replaceCodeClick(){ var el=document.getElementById("replaceCodeFile"); if(el) el.click(); }
function replaceCodeFromFile(id, ev){
  readHtmlFile(ev, function(text, fname){
    var p=getProject(id); if(!p) return;
    if(!confirm("Replace this project's code with "+fname+" ("+Math.round(text.length/1024)+" KB)?\n\nThe current code is saved as a checkpoint first.")) return;
    var nb={ files:[{ path:"index.html", language:"html", content:text }], summary:"Code replaced from file "+fname+".",
             run_commands:[], how_to_run:"Open index.html in a browser.", not_implemented:[] };
    replaceBuild(p, nb, "import from "+fname);

    upsertProject(p); render();
  });
}

function baseName(path){ return String(path||"").split("/").pop(); }

/* Combine the project's HTML with its CSS/JS so preview renders correctly
   (generated index.html links style.css / app.js as separate files that do
   not resolve inside a blob or iframe). */
function buildPreviewHtml(p){
  var files=(p&&p.build&&p.build.files)||[]; var main=null, i;
  for(i=0;i<files.length;i++){ if(/index\.html?$/i.test(files[i].path)){ main=files[i]; break; } }
  if(!main){ for(i=0;i<files.length;i++){ if(/\.html?$/i.test(files[i].path)){ main=files[i]; break; } } }
  if(!main) return null;
  var html=String(main.content||"");
  var closeScript = "<"+"/script>";
  for(i=0;i<files.length;i++){
    if(/\.css$/i.test(files[i].path)){
      var bn=baseName(files[i].path).replace(/[.*+?^${}()|[\]\\]/g,"\\$&");
      var re=new RegExp("<link\\b[^>]*href=[\"']?[^\"'> ]*"+bn+"[\"']?[^>]*>","gi");
      html=html.replace(re, "<style>\n"+String(files[i].content||"")+"\n</style>");
    }
  }
  var js="";
  for(i=0;i<files.length;i++){
    if(/\.js$/i.test(files[i].path)){ js += "\n/* "+baseName(files[i].path)+" */\n"+String(files[i].content||"")+"\n"; }
  }
  if(js){
    var inject="<script>\n"+js+"\n"+closeScript;
    if(/<\/body>/i.test(html)) html=html.replace(/<\/body>/i, inject+"\n</body>");
    else html=html+inject;
  }
  /* Sandboxed iframes have an opaque origin, so localStorage/sessionStorage
     throw — which blanks apps that persist state. Shim them in-memory, and
     surface any runtime error visibly inside the preview instead of a dialog. */
  var shim = "<script>(function(){"
    + "function M(){var s={};return{getItem:function(k){return Object.prototype.hasOwnProperty.call(s,k)?s[k]:null;},"
    + "setItem:function(k,v){s[k]=String(v);},removeItem:function(k){delete s[k];},clear:function(){s={};},"
    + "key:function(i){return Object.keys(s)[i]||null;},get length(){return Object.keys(s).length;}};}"
    + "try{window.localStorage.getItem('__p');}catch(e){try{Object.defineProperty(window,'localStorage',{value:M(),configurable:true});}catch(_){}}"
    + "try{window.sessionStorage.getItem('__p');}catch(e){try{Object.defineProperty(window,'sessionStorage',{value:M(),configurable:true});}catch(_){}}"
    + "window.addEventListener('error',function(ev){if(ev&&ev.message){try{var b=document.body||document.documentElement,d=document.createElement('div');"
    + "d.style.cssText='position:fixed;left:0;right:0;bottom:0;background:#b42318;color:#fff;font:12px -apple-system,sans-serif;padding:6px 10px;z-index:99999';"
    + "d.textContent='Preview error: '+ev.message;b.appendChild(d);}catch(_){}}});"
    + "})();" + closeScript;
  if(/<head[^>]*>/i.test(html)){ html=html.replace(/<head[^>]*>/i, function(mm){ return mm + "\n" + shim; }); }
  else { html = shim + html; }
  return html;
}

function crc32(bytes){
  var c, crc=0xFFFFFFFF, i, k;
  for(i=0;i<bytes.length;i++){
    c=(crc ^ bytes[i]) & 0xFF;
    for(k=0;k<8;k++){ c=(c&1)?(0xEDB88320^(c>>>1)):(c>>>1); }
    crc=(crc>>>8) ^ c;
  }
  return (crc ^ 0xFFFFFFFF) >>> 0;
}
function zipFiles(files){
  var enc=new TextEncoder(); var parts=[], central=[], offset=0, i;
  function u16(n){ return [n&0xFF,(n>>>8)&0xFF]; }
  function u32(n){ return [n&0xFF,(n>>>8)&0xFF,(n>>>16)&0xFF,(n>>>24)&0xFF]; }
  for(i=0;i<files.length;i++){
    var nameBytes=enc.encode(files[i].path);
    var data=enc.encode(String(files[i].content||""));
    var crc=crc32(data);
    var lh=new Uint8Array([].concat(u32(0x04034b50),u16(20),u16(0x0800),u16(0),u16(0),u16(0),
      u32(crc),u32(data.length),u32(data.length),u16(nameBytes.length),u16(0)));
    parts.push(lh, nameBytes, data);
    central.push(new Uint8Array([].concat(u32(0x02014b50),u16(20),u16(20),u16(0x0800),u16(0),u16(0),u16(0),
      u32(crc),u32(data.length),u32(data.length),u16(nameBytes.length),u16(0),u16(0),u16(0),u16(0),u32(0),u32(offset))), nameBytes);
    offset += lh.length + nameBytes.length + data.length;
  }
  var cdSize=0, c; for(c=0;c<central.length;c++){ cdSize += central[c].length; }
  var eocd=new Uint8Array([].concat(u32(0x06054b50),u16(0),u16(0),
    u16(files.length),u16(files.length),u32(cdSize),u32(offset),u16(0)));
  var all=parts.concat(central); all.push(eocd);
  var total=0, m; for(m=0;m<all.length;m++){ total+=all[m].length; }
  var out=new Uint8Array(total), pos=0;
  for(m=0;m<all.length;m++){ out.set(all[m],pos); pos+=all[m].length; }
  return new Blob([out], { type:"application/zip" });
}
function anchorSave(blob, filename){
  try{
    var url=URL.createObjectURL(blob); var a=document.createElement("a");
    a.href=url; a.download=filename; a.rel="noopener";
    document.body.appendChild(a); a.click(); document.body.removeChild(a);
    setTimeout(function(){ URL.revokeObjectURL(url); }, 2000);
    return true;
  }catch(e){ return false; }
}
function openBlobTab(blob){
  try{ var w=window.open(URL.createObjectURL(blob),"_blank"); return !!w; }catch(e){ return false; }
}
/* iOS Safari ignores <a download>, so prefer the Web Share sheet (Save to
   Files); fall back to an anchor, then to opening the file. Never silent. */
function saveBlob(blob, filename){
  try{
    if(navigator.canShare && typeof File!=="undefined"){
      var file=new File([blob], filename, { type: blob.type || "application/octet-stream" });
      if(navigator.canShare({ files:[file] })){
        navigator.share({ files:[file], title:filename }).catch(function(err){
          if(err && err.name==="AbortError") return;
          if(!anchorSave(blob, filename) && !openBlobTab(blob))
            alert("Couldn't save on this device. Use Copy, or the Export button, to keep the code.");
        });
        return;
      }
    }
  }catch(e){}
  if(isIOS()){
    if(openBlobTab(blob)) alert("Opened the file in a new tab — use Share then Save to Files to keep it.");
    else alert("iOS couldn't download automatically. Use Copy to keep the code.");
    return;
  }
  if(!anchorSave(blob, filename)){
    if(!openBlobTab(blob)) alert("Couldn't download on this browser. Use Copy, or the Export button.");
  }
}
function downloadOne(id, idx){
  var p=getProject(id);
  if(!p||!p.build||!p.build.files||!p.build.files[idx]){ alert("Nothing to download."); return; }
  var f=p.build.files[idx];
  var mime = /\.html?$/i.test(f.path) ? "text/html" : (/\.css$/i.test(f.path)?"text/css":(/\.js$/i.test(f.path)?"text/javascript":"text/plain"));
  saveBlob(new Blob([String(f.content||"")], { type:mime }), baseName(f.path) || "file.txt");

function trSo(t){
  if(Object.prototype.hasOwnProperty.call(SO_TXT,t)) return SO_TXT[t];
  for(var i=0;i<SO_RX.length;i++){ if(SO_RX[i][0].test(t)) return t.replace(SO_RX[i][0], SO_RX[i][1]); }
  return null;
}
function trChrome(el){
  for(var k=0;el && k<2;k++, el=el.parentNode){
    if(!el.tagName) return false;
    if(/^(BUTTON|LABEL|H1|H2|H3|A)$/.test(el.tagName)) return true;
    var c=" "+(el.className||"")+" ";
    if(/ (help|sub|kk|k|badge|tab|navbtn|trs|brand) /.test(c)) return true;
    if(el.tagName==="B" && el.parentNode && /^(DIV|SPAN)$/.test(el.parentNode.tagName) && / (card|flex-between|trs) /.test(" "+(el.parentNode.className||"")+" ")) return true;
  }
  return false;
}
function applyLang(){
  if(getLang()!=="so") return;
  var root=document.getElementById("app"); if(!root) return;
  (function walk(n){
    if(n.nodeType===3){
      var raw=n.nodeValue, t=raw.replace(/\s+/g," ").trim(); if(!t) return;
      /* Short texts are only swapped inside interface elements, so a user's own words
         (e.g. a bug report that just says "Save") are never changed. */
      if(t.length<=25 && !trChrome(n.parentNode)) return;
      var so=trSo(t); if(so!==null){ var lead=raw.match(/^\s*/)[0], tail=raw.match(/\s*$/)[0]; n.nodeValue=lead+so+tail; }
      return;
    }
    if(n.nodeType!==1) return;
    if(n.placeholder && Object.prototype.hasOwnProperty.call(SO_PH,n.placeholder)) n.placeholder=SO_PH[n.placeholder];
    if(/^(SCRIPT|STYLE|IFRAME|PRE|CODE|TEXTAREA|OPTION)$/.test(n.tagName) || n.hasAttribute("data-notr")) return;
    for(var c=n.firstChild;c;c=c.nextSibling) walk(c);
  })(root);
  var sels=root.querySelectorAll("select option");
  for(var i=0;i<sels.length;i++){ var so2=trSo(sels[i].textContent.trim()); if(so2!==null && /^(High|Medium|Low)$/.test(sels[i].textContent.trim())) sels[i].textContent=so2; }
}

  if(target.repo!==(c.owner+"/"+c.repo)){ alert("That deploy went to "+target.repo+", but Settings now point to "+c.owner+"/"+c.repo+"."); return; }
  if(!confirm("Put "+(target.version||"this version")+" ("+target.at+") back live at\n"+target.url+" ?")) return;
  setBusy("deploy",true); render();
  var cm="AI App Factory rollback: "+p.name+" to "+(target.version||target.at), done=[], chain=Promise.resolve();

        if(!r.ok || !r.data || !r.data.content) throw ghErr(r, "Reading old "+fc.path);

function wizCapture(){

  function v(id){ var el=document.getElementById(id); return el?el.value:null; }
  function c(id){ var el=document.getElementById(id); return el?el.checked:null; }
  if(v("wz_name")!==null) w.d.name=String(v("wz_name")).trim().slice(0,40);
  if(v("wz_ins")!==null) w.d.instructions=String(v("wz_ins")).trim().slice(0,3000);
  if(c("wz_req")!==null){ w.d.inputs={ req:!!c("wz_req"), code:!!c("wz_code"), qa:!!c("wz_qa"), msg:!!c("wz_msg") }; }
  var o=document.querySelector('input[name="wz_out"]:checked'); if(o) w.d.output=o.value==="change"?"change":"text";
  if(v("wz_model")!==null) w.d.model=String(v("wz_model")).trim();
}
function wizGo(step){
  wizCapture(); var w=state.wiz; if(!w) return;
  if(step>2 && w.step===2){
    if(!w.d.name){ alert("Give the agent a name."); return; }
    if(w.d.instructions.length<15){ alert("Describe the agent's job in at least one sentence."); return; }
  }
  if(step>3 && w.step===3){ var i=w.d.inputs; if(!i.req && !i.code && !i.qa && !i.msg){ alert("Choose at least one thing the agent reads."); return; } }
  w.step=step; window.scrollTo(0,0); render();
}
function wizSave(){
  wizCapture(); var w=state.wiz; if(!w) return;
  var l=loadCAgents(), a=w.d;
  a.id=w.editId||("ag"+Date.now().toString(36)); a.updatedAt=new Date().toISOString();
  var found=false; for(var i=0;i<l.length;i++){ if(l[i].id===a.id){ l[i]=a; found=true; } }
  if(!found) l.push(a);
  saveCAgents(l); state.wiz=null; state.view="agents"; render();
}
function wizCancel(){ state.wiz=null; state.view="agents"; render(); }
function deleteCAgent(id){ var a=getCAgent(id); if(!a||!confirm("Delete the agent \""+a.name+"\"?")) return; saveCAgents(loadCAgents().filter(function(x){ return x.id!==id; })); render(); }
function inputsLabel(i){
  var l=[]; if(i.req) l.push("requirements"); if(i.code) l.push("code"); if(i.qa) l.push("QA result"); if(i.msg) l.push("your message");
  return l.join(", ");
}

function customAgentPrompt(p, a, msg){
  var sys=String(a.instructions||"")+"\n\nYou are \""+a.name+"\", a custom agent in AI App Factory working on the app \""+p.name+"\". "
    +"Answer in plain text (no JSON, no code blocks). Be concise and practical."
    +(a.output==="change" ? " Write your answer as a CHANGE REQUEST for the Builder agent: a numbered list of specific, testable changes (what to change and exactly how it should look or behave). Do not write code. Max 10 items." : "");
  var usr="";
  if(a.inputs.req) usr+="REQUIREMENTS:\n"+p.description+"\n\n";
  if(a.inputs.qa && p.qa){
    usr+="LATEST QA RESULT: verdict "+(p.qa.verdict||"?")+". "+(p.qa.summary||"")+"\n";
    (p.qa.bugs||[]).forEach(function(b){ usr+="- ["+b.severity+"] "+b.title+"\n"; }); usr+="\n";
  }
  if(a.inputs.msg && msg) usr+="MESSAGE FROM THE OWNER:\n"+msg+"\n\n";
  if(a.inputs.code && p.build) usr+= isLargeApp(p) ? ("CODE:\n"+keywordCtx(p, a.instructions+" "+(msg||""), 12000)) : ("CODE (CSS and indentation removed):\n"+qaCodeCtx(p.build.files||[]));
  if(!usr) usr="(no input selected)";
  return { sys:sys, usr:usr };
}
function runCustomAgent(pid, aid){
  var p=getProject(pid), a=getCAgent(aid); if(!p||!a) return;
  if(a.inputs.code && !p.build){ alert("This agent reads the code, but the project has no code yet."); return; }
  var msg="";
  if(a.inputs.msg){ msg=prompt("Message for "+a.name+":", ""); if(msg===null) return; msg=String(msg).trim().slice(0,2000); }
  var pr=customAgentPrompt(p, a, msg), key="cag_"+aid;
  setBusy(key,true); render();
  callModel("custom", pr.sys, pr.usr, a.model||undefined).then(function(r){
    var q=getProject(pid)||p;
    if(!q.customRuns) q.customRuns=[];
    q.customRuns.unshift({ id:"cr"+Date.now().toString(36), agentId:a.id, agent:a.name, icon:a.icon||"", output:a.output, at:nowStr(), text:String(r.text||"").slice(0,12000), tokens:r.tokens||0 });
    if(q.customRuns.length>10) q.customRuns.length=10;
    logActivity(q, a.name, "Custom agent finished"+(r.tokens?(" (\u2248"+fmtK(r.tokens)+" tokens)"):"")+".");
    upsertProject(q); setBusy(key,false); render();
  }).catch(function(e){ setBusy(key,false); render(); alert(e.message+"\n\n"+classifyError(e)); });
}
function sendRunToBuilder(pid, rid){
  var p=getProject(pid); if(!p||!p.build) { alert("Generate or import code first."); return; }
  var run=null; (p.customRuns||[]).forEach(function(r){ if(r.id===rid) run=r; });
  if(!run) return;
  if(!confirm("Send this change request to the Builder as a bug report and start Auto-fix?\n\nA checkpoint is saved before any code changes.")) return;
  var text="CHANGE REQUEST from the \""+run.agent+"\" agent:\n"+run.text.slice(0,2500);
  var title="[Agent] "+run.agent+": "+run.text.replace(/\s+/g," ").slice(0,60);
  var bug={ id:"ub"+Date.now().toString(36), severity:"medium", title:title, detail:text, status:"open", ts:nowStr() };
  if(!p.userBugs) p.userBugs=[]; p.userBugs.push(bug);
  if(!p.qa) p.qa={ summary:"Change request from a custom agent.", verified:[], failed:[], untested:[], bugs:[], verdict:"changes_requested" };
  if(!p.qa.bugs) p.qa.bugs=[];
  p.qa.bugs.push({ severity:"medium", title:title, detail:text, fix:"Apply the requested changes.", fromUser:true });
  if(p.qa.verdict!=="blocked") p.qa.verdict="changes_requested";
  logActivity(p,"You","Sent the "+run.agent+" change request to the Builder.");
  upsertProject(p); state.projectTab="qa"; stepAutoFix(pid);
}

/* ---------- Patch 19: AI ENGINEER / REPAIR AGENT ----------
   A chat on each project: Diagnose -> Propose -> (you approve) -> Edit -> Check -> Run -> QA -> Repair.
   It reuses the existing machinery: callModel (provider, retry, quota, fallback), the plain-text
   search/replace edit engine (parseEditBlocks + applyEdits), section planning for large apps,
   replaceBuild/snapshotBuild checkpoints, rollbackBuild, runExecution, runQA and stepSecScan.
   Nothing is changed without your tap on "Apply fix". It never reports a test as passed unless it ran. */
var ENG_MAX_MSGS=40, ENG_MAX_TEXT=6000;
/* Patch 19.2: detect a Somali message so the language order can be put at the END of the request (models follow that best). */
var ENG_SO_RX=/\b(waa|iyo|maxay|maxaa|maxuu|sidee|sida|ayuu|ayay|ayaa|waxa|waxaa|waxaan|laanta|badhanka|kharashka?|wadarta|keliya|hadda|isbeddel\w*|khaldan|ma\s+\w+aa?|oo|aan|ku|ka|ugu|kadib|marka|haddii|fadlan|sax|saxo|ku\s+dar|lama|weli|laga|loo|karo|kari|waxba|qabto|qabanayo|dooran|doorto|shaqeyn\w*|shaqayn\w*|aha|sababta|muuqd\w*|beddel|dhib\w*|xisaab\w*|kani|tani|wuu|waxay|dar|qayb\w*|samee|tirtir|ii|ila|noo|sii|wuxuu|lagu|kuma|kama|miyaa?|halkee|goorma|xagee)\b/gi;
function engIsSomali(t){ var m=String(t||"").match(ENG_SO_RX)||[], en=String(t||"").match(/\b(the|is|are|and|on|in|to|of|it|this|that|please|why|what|how|can|you|make|does|not|with)\b/gi)||[]; return m.length>=2 && m.length>en.length; }
function engLastUserText(p){ var ms=engState(p).msgs; for(var i=ms.length-1;i>=0;i--){ if(ms[i].role==="user" && !/^(Repair|Dayactir) \(/.test(ms[i].text||"")) return ms[i].text||""; } return ""; }
function engLangTail(p, task){
  var so=engIsSomali(task)||engIsSomali(engLastUserText(p))||(getLang()==="so" && !/^[\x00-\x7F]*\b(the|is|why|how|what|button|please|add|fix)\b/i.test(task));
  return so ? "\n\nIMPORTANT \u2014 LANGUAGE: The owner writes in SOMALI. Write everything under @@DIAGNOSIS, @@PLAN and @@EXPECT in Somali (Af-Soomaali), in simple words; if no code change is needed, write that in Somali too (for example: Isbeddel code looma baahna). Keep function names, element ids and code exactly as they are. Keep the @@ markers in English." : "";
}
function engFmt(t){ return esc(t).replace(/\*\*([^*\n]+)\*\*/g,"<b>$1</b>").replace(/`([^`\n]+)`/g,'<code style="font-size:0.92em;background:rgba(0,0,0,0.05);padding:0 3px;border-radius:4px">$1</code>'); }
function engL(en, so){ return getLang()==="so" ? so : en; }
function engState(p){
  if(!p.engineer || typeof p.engineer!=="object") p.engineer={ msgs:[], pending:null, round:0, lastApply:null };
  if(!Array.isArray(p.engineer.msgs)) p.engineer.msgs=[];
  return p.engineer;
}
function engPush(p, m){
  var E=engState(p);
  m.ts=nowStr();
  if(m.text && m.text.length>ENG_MAX_TEXT) m.text=m.text.slice(0,ENG_MAX_TEXT)+"\u2026";
  E.msgs.push(m);
  if(E.msgs.length>ENG_MAX_MSGS) E.msgs=E.msgs.slice(-ENG_MAX_MSGS);
  return m;
}
function engSig(p){

}
/* Can the Engineer's model take a screenshot? false = known text-only, true = known to accept images, null = unknown (try). */
function engImageSupport(model){
  var s=getSettings();
  if(/gpt-oss|llama-3\.[13]|mixtral|qwen-?2\.5-coder|deepseek-r1/i.test(String(model||""))) return false;
  if(s.provider==="anthropic") return true;

  return null;
}
function engImageRejected(e){
  return !!(e && e.status===400 && /image|vision|multimodal|content.*(string|type)|must be a string|unsupported|image_url/i.test(String(e.message||"")));
}
/* Browser syntax check of the app's own JavaScript. It compiles the code WITHOUT running it. */
function engSyntaxCheck(files){
  var errs=[], n=0;
  (files||[]).forEach(function(f){
    var path=String(f.path||""), c=String(f.content||"");
    var chunks=[];
    if(/\.m?js$/i.test(path)){ if(!/^\s*(import|export)\s/m.test(c)) chunks.push(c); }
    else if(/\.html?$/i.test(path)){
      var re=/<script([^>]*)>([\s\S]*?)<\/script>/gi, m;
      while((m=re.exec(c))){
        var attrs=m[1]||"";
        if(/\bsrc\s*=/i.test(attrs)) continue;
        var tm=attrs.match(/\btype\s*=\s*["']?([^"'\s>]+)/i);
        if(tm && !/^(text\/javascript|application\/javascript)$/i.test(tm[1])) continue;
        chunks.push(m[2]);
      }
    }
    chunks.forEach(function(code){
      n++;
      try{ new Function(code); }catch(e){ errs.push(path+": "+(e&&e.message?e.message:String(e))); }
    });
  });
  return { checked:n, errors:errs };
}
function parseEngineer(text){
  var t=String(text||"").replace(/\r\n/g,"\n"), out={ diagnosis:"", plan:"", expect:"", summary:"", edits:[], wrong:[], notDone:[], lessons:[] };
  var lines=t.split("\n"), cur=null, buf=[];
  function flush(){ if(cur) out[cur]=buf.join("\n").trim(); buf=[]; }
  for(var i=0;i<lines.length;i++){
    var T=lines[i].trim(), m;
    if(/^@@DIAGNOSIS\b/.test(T)){ flush(); cur="diagnosis"; continue; }
    if(/^@@PLAN\b/.test(T)){ flush(); cur="plan"; continue; }
    if(/^@@EXPECT\b/.test(T)){ flush(); cur="expect"; continue; }
    if((m=T.match(/^@@SUMMARY\b\s*(.*)$/))){ flush(); cur=null; out.summary=m[1]; continue; }
    if((m=T.match(/^@@LESSON\b\s*(.*)$/))){ flush(); cur=null; if(m[1] && out.lessons.length<2) out.lessons.push(m[1].slice(0,240)); continue; }
    if(/^@@(EDIT|FIND|REPLACE|END|WRONG_TEST|NOT_DONE)\b/.test(T)){ flush(); cur=null; continue; }
    if(cur) buf.push(lines[i]);
  }
  flush();
  var eb=parseEditBlocks(t);
  if(eb){ out.edits=eb.edits||[]; out.wrong=eb.wrong_tests||[]; out.notDone=eb.not_implemented||[]; if(!out.summary) out.summary=eb.summary||""; }
  if(!out.diagnosis && !out.plan && !out.edits.length) out.diagnosis=t.replace(/^@@\w+.*$/gm,"").trim();
  out.edits.forEach(function(e){ e.replace=String(e.replace||"").replace(/\n@@LESSON[^\n]*/g,""); });
  return out;
}
function engContextText(p){
  var parts=[];
  var bugs=(p.qa&&p.qa.bugs)||[];
  if(bugs.length){ parts.push("QA FINDINGS (latest review, verdict "+(p.qa.verdict||"?")+"):\n"+bugs.slice(0,8).map(function(b){ return "- ["+b.severity+"] "+b.title+": "+String(b.detail||"").slice(0,300); }).join("\n")); }
  if(p.exec && p.exec.configured && p.exec.success===false){
    var rs=p.exec.results||[], ex="";
    rs.forEach(function(r){ if(Number(r.exitCode)!==0) ex+="$ "+r.cmd+" (exit "+r.exitCode+")\n"+String(r.stderr||r.stdout||"").slice(-1200)+"\n"; });
    if(ex) parts.push("RECENT SANDBOX FAILURES (real):\n"+ex);
  }
  var ub=openUserBugs(p);
  if(ub.length) parts.push("OPEN BUGS THE OWNER REPORTED:\n"+ub.slice(0,6).map(function(b){ return "- "+String(b.detail||b.title).slice(0,300); }).join("\n"));
  var sf=(p.security&&p.security.findings)||[];
  var cf=sf.filter(function(f){ return f && f.kind!=="architecture" && (f.severity==="critical"||f.severity==="high"); });
  if(cf.length) parts.push("OPEN SECURITY CODE-FIX FINDINGS:\n"+cf.slice(0,4).map(function(f){ return "- ["+f.severity+"] "+f.category+" @ "+f.location+": "+String(f.detail||"").slice(0,200); }).join("\n"));
  return parts.join("\n\n");
}
function engHistoryText(p){
  var ms=engState(p).msgs.slice(-8), out="", n=ms.length;
  ms.forEach(function(m, i){
    var room=(i>=n-3)?1800:400;
    if(m.role==="user") out+="OWNER: "+String(m.text||"").slice(0,600)+"\n";
    else if(m.kind==="proposal") out+="ENGINEER: "+String(m.diagnosis||"").slice(0,room)+(m.plan?(" | PLAN: "+String(m.plan).slice(0,room)):"")+(m.summary?(" | proposed: "+m.summary):"")+(m.status?(" ["+m.status+"]"):"")+"\n";

      t+=m.edits.length+" edit(s): "+(m.summary||"")+(m.error?("\n"+m.error):"")+"\n";

  } else if(m.kind==="result"){ t+=(m.lines||[]).join("\n")+"\n"; }
  else t+=(m.text||"")+"\n";
  return t.trim();
}
function engCopyText(txt){
  function done(){ rlBanner(engL("Copied. Paste it where you need it.","Waa la koobiyeeyay. Ku dheji meesha aad rabto.")); setTimeout(function(){ rlBanner(""); }, 1800); }
  function fallback(){
    var ta=document.createElement("textarea"); ta.value=txt; ta.setAttribute("readonly",""); ta.style.position="fixed"; ta.style.top="-1000px";
    document.body.appendChild(ta); ta.select(); ta.setSelectionRange(0, txt.length);
    var ok=false; try{ ok=document.execCommand("copy"); }catch(e){}
    document.body.removeChild(ta);
    if(ok) done(); else alert(engL("Copy is blocked here. Long-press the text to copy it.","Koobiyeyntu halkan way xiran tahay. Qoraalka si dheer u riix si aad u koobiyeyso."));
  }
  try{ if(navigator.clipboard && navigator.clipboard.writeText){ navigator.clipboard.writeText(txt).then(done, fallback); return; } }catch(e){}
  fallback();
}

/* ---------- Patch 20: Engineer Playbook (lessons learned) ----------
   The model cannot be trained, so the factory keeps a playbook of lessons from earlier apps.
   Every AI Engineer request gets the playbook and the factory's automatic checks; the Engineer can
   propose new lessons (@@LESSON) and the owner decides which to keep. */
var LS_LESSONS="aiaf_eng_lessons_v1";
var ENG_LESSONS_DEFAULT=[
  "Branch picker: when the page redraws, keep the branch the person chose; never jump back to the first one.",
  "Staff: REMOVE the <option>s of branches they may not use. iPhone Safari ignores option.hidden.",
  "Empty branch list: show a placeholder like \"Main\" on screen only; never save it, or every new phone adds it to the shared list.",
  "Never keep a list inside a record (customer.payments[]); use a separate top-level list with customerId and branch, or two phones lose entries.",
  "Escape EVERY typed or saved value put into innerHTML with one escapeHtml() helper; fix the whole file, not just the reported line.",
  "The storage key must be named after the app (deynbook_v1), never myapp_v1/app_v1/data: all published apps share the same phone storage.",
  "Amounts: reject empty, zero, negative and non-numbers (Number.isFinite(x) && x > 0); round to 2 decimals.",
  "Dates: if the date field is empty use today; never save NaN or Invalid Date.",
  "Required text (names): trim and refuse to save when empty.",
  "Load saved data inside try/catch and fill only the missing parts; never wipe everything because one part is missing.",
  "Do not change working code because a QA test failed: first check whether the test itself is wrong (bad selector, checks only the first element)."
];
function getLessons(){
  try{ var a=JSON.parse(localStorage.getItem(LS_LESSONS)||"null"); if(Array.isArray(a)) return a.filter(function(x){ return typeof x==="string" && x.trim(); }); }catch(e){}
  return ENG_LESSONS_DEFAULT.slice();
}
function setLessons(a){ try{ localStorage.setItem(LS_LESSONS, JSON.stringify(a.slice(0,60))); }catch(e){} specTouch("__aiaf_playbook__"); }
function engPlaybookText(){
  var L=getLessons(); if(!L.length) return "";
  return "\n\nENGINEERING PLAYBOOK (lessons learned on the owner's earlier apps; check the code against each lesson that applies and mention any you find broken):\n"+L.map(function(x,i){ return (i+1)+". "+x; }).join("\n")+"\n";
}
function engAutoChecks(p){
  var c=[];
  try{ var sx=engSyntaxCheck((p.build&&p.build.files)||[]); if(sx.errors.length) c.push("JavaScript does NOT compile, so the app cannot run at all: "+sx.errors.slice(0,2).join(" | ")+". Fix this FIRST (look for two statements joined without ; or a missing bracket)."); }catch(e){}
  try{ c=c.concat(syncCheck(p)); }catch(e){}
  return c.length ? ("AUTOMATIC CHECKS by the factory (deterministic, trust them):\n- "+c.join("\n- ")+"\n\n") : "";
}
function engSaveLesson(id, mi, li){
  var p=getProject(id); if(!p) return;
  var m=engState(p).msgs[mi]; if(!m || !m.lessons || !m.lessons[li]) return;

  if(L.indexOf(t)<0){ L.push(t); setLessons(L); }
  m.lessonsSaved=m.lessonsSaved||{}; m.lessonsSaved[li]=true;
  logActivity(p,"You","Saved an Engineer lesson: "+t.slice(0,80));
  upsertProject(p); render();
}
function engDelLesson(i){

  } else {

/* ---------- Patch 23: Research Department, phase A (Scout only, read-only) ----------

var SCOUT_SYS="You are the Research Scout for an AI App Factory: a single-file HTML PWA whose agents are Product Intelligence, Project Manager, Design, Builder, QA, Security and an AI Engineer, followed by an approval gate and a sandbox. Builder and Engineer run on Groq (gpt-oss-120b); QA, Security and Product Intelligence run on Google Gemini (free tier). "

 +"Rules: use ONLY the given results and copy each url exactly from them; never invent a url. If nothing is meaningful, return []. Ignore hype, marketing and 'top 10 tools' lists. Skip anything in KNOWN_FINDINGS. Skip anything that breaks the owner constraints. "
 +"In what_it_does say only what the snippet supports; put your own opinion in why_it_matters_for_factory. "
 +"Reply with ONLY a JSON array: [{\"name\":\"\",\"url\":\"\",\"date\":\"\",\"what_it_does\":\"\",\"why_it_matters_for_factory\":\"\",\"which_agent_it_affects\":\"\",\"confidence\":\"high|medium|low\"}]";

function tavilySearch(q){

  .then(function(res){ return res.text().then(function(raw){
    if(!res.ok){ var e=new Error("Web search error ("+res.status+"): "+String(raw||"").slice(0,160)); e.status=res.status; throw e; }
    var d; try{ d=JSON.parse(raw); }catch(x){ throw new Error("Bad response from the web search."); }
    return (d.results||[]).map(function(r){ return { title:String(r.title||""), url:String(r.url||""), snippet:String(r.content||"").slice(0,500) }; });
  }); }, function(e){ throw new Error(engL("Web search could not be reached (network or browser block): ","Raadinta internetka lama gaari karo (shabakad ama browser ayaa xannibay): ")+(e&&e.message||e)); });
}
function researchLoad(){ try{ var o=JSON.parse(localStorage.getItem(LS_RESEARCH)||"null"); return (o&&typeof o==="object")?o:{ known:[] }; }catch(e){ return { known:[] }; } }
function researchSave(o){ try{ localStorage.setItem(LS_RESEARCH, JSON.stringify(o)); }catch(e){} specTouch("__aiaf_research__"); }
function researchModel(){

function parseFindings(text){
  var t=String(text||"").replace(/```json|```/g,"").trim(), a=t.indexOf("["), b=t.lastIndexOf("]");
  if(a<0||b<a) return null;
  try{ var arr=JSON.parse(t.substring(a,b+1)); return Array.isArray(arr)?arr:null; }catch(e){ return null; }
}
/* Patch 23.2: web search through Groq's built-in search (groq/compound-mini). Works wherever Groq works;
   uses the main Groq key and only a few requests per Research run. Returns the real search results. */
function groqSearch(q, _retried){
  /* Patch 23.3: Groq browser search on GPT-OSS. The model browses, then lists results as JSON;
     each url is checked against the browsing log (executed_tools) so invented links are marked. */
  var s=getSettings();
  if(!/groq\.com/i.test(String(s.baseUrl||""))||!s.apiKey) return Promise.reject(new Error(engL("Research web search needs Groq as the main provider (key set in Settings).","Raadinta Research waxay u baahan tahay Groq oo ah bixiyaha weyn (key ku jira Settings).")));
  return fetch(String(s.baseUrl).replace(/\/+$/,"")+"/chat/completions", { method:"POST",
    headers:{ "Content-Type":"application/json", "Authorization":"Bearer "+s.apiKey },
    body:JSON.stringify({ model:s.researchSearchModel||"openai/gpt-oss-20b", tool_choice:"required", tools:[{ type:"browser_search" }],
      reasoning_effort:"low", max_completion_tokens:1500, temperature:0.3,
      messages:[{ role:"system", content:"Use browser search. Then reply with ONLY a JSON array (no markdown) of up to 8 RECENT results you actually opened or saw: [{\"title\":\"\",\"url\":\"\",\"snippet\":\"one or two factual sentences\"}]. Copy each url exactly. Never invent a url." },{ role:"user", content:q }] }) })
  .then(function(res){ return res.text().then(function(raw){
    var isDaily=/per d(ay)?\b|tokens per day|TPD|RPD/i.test(String(raw||""));
    if(res.status===429 && isDaily){ var ed=new Error(engL("Groq's DAILY free limit for ","Xadka bilaashka ah ee MAALINLAHA ah ee Groq ee ")+(s.researchSearchModel||"openai/gpt-oss-20b")+engL(" is used up. Try Research again tomorrow (you can still tap Verify).",engL(""," waa dhammaaday. Research mar kale isku day berri (Verify weli waad riixi kartaa)."))); ed.status=429; ed.daily=true; throw ed; }
    if(res.status===429 && !_retried){
      var mm=String(raw||"").match(/try again in ([0-9.]+)\s*(ms|s|m)/i), wait=20000;
      if(mm){ var v=parseFloat(mm[1]); wait=mm[2].toLowerCase()==="ms"?v:(mm[2].toLowerCase()==="m"?v*60000:v*1000); }
      wait=Math.min(Math.max(wait+1500,3000),65000);
      rlBanner(engL("Groq search is busy \u2014 waiting ","Raadinta Groq way mashquulsan tahay \u2014 sugaya ")+Math.round(wait/1000)+"s\u2026");
      return new Promise(function(r){ setTimeout(r,wait); }).then(function(){ rlBanner(""); return groqSearch(q,true); });
    }
    if(!res.ok){ var e=new Error("Groq search error ("+res.status+"): "+String(raw||"").slice(0,160)+(res.status===429?engL(" \u2014 the free per-minute limit; wait a minute and try again."," \u2014 xadka bilaashka ah ee daqiiqadda; daqiiqad sug kadibna isku day."):"")); e.status=res.status; throw e; }
    var d; try{ d=JSON.parse(raw); }catch(x){ throw new Error("Bad response from Groq search."); }
    var m=d&&d.choices&&d.choices[0]&&d.choices[0].message||{};
    var log=""; try{ log=JSON.stringify(m.executed_tools||[]); }catch(x){}
    var hasLog=log.length>4;
    var arr=parseFindings(m.content)||[];
    return arr.filter(function(r){ return r&&/^https?:\/\//i.test(String(r.url||"")); }).map(function(r){
      var u=String(r.url), host=""; try{ host=new URL(u).hostname.replace(/^www\./,""); }catch(x){}
      var ok=hasLog && (log.indexOf(u)>=0 || (host && log.indexOf(host)>=0));
      return { title:String(r.title||host||u), url:u, snippet:String(r.snippet||"").slice(0,500), confirmed:ok };
    }).filter(function(r){ return !hasLog || r.confirmed; });
  }); }, function(e){ throw new Error(engL("Groq search could not be reached: ","Raadinta Groq lama gaari karo: ")+(e&&e.message||e)); });
}
/* ---------- Patch 24: Research Department phase B — Verifier ----------
   One Gemini call that challenges each Scout finding against its search snippet and the owner's real constraints.
   It never changes anything; a failed check simply leaves the findings marked UNVERIFIED. */
var VERIFIER_SYS="You are the Research Verifier for an AI App Factory. You challenge the Scout; never agree by default. "
 +"OWNER CONSTRAINTS (check every finding against them): free tiers only; the owner has NO bank card, so anything that needs billing, a paid plan or a card is not usable; the owner is in Somaliland, where some services block access; apps are single-file HTML PWAs; the factory runs on Groq (gpt-oss) and Google Gemini free tier, where Google Search grounding already failed with a quota error. "
 +"For each finding judge: (1) SOURCE: official vendor page/docs/changelog = official; blog, news or aggregator = third_party; a bare API endpoint, home page or unclear page = unclear. (2) Does the SNIPPET actually support the claim? (3) Is it current? (4) Is it usable under the owner constraints? (5) Cost, security and lock-in risk. "
 +"Status: VERIFIED only if an official source supports the claim AND it is usable under the constraints; PARTIAL if the claim is supported but the source is third_party or usability is unclear; UNVERIFIED if the snippet does not support it or the source is unclear; REJECTED if it needs payment/card, is irrelevant, outdated or wrong. Never recommend a REJECTED item. "
 +"Reply with ONLY a JSON array, same order as input: [{\"name\":\"\",\"status\":\"VERIFIED|PARTIAL|UNVERIFIED|REJECTED\",\"source_type\":\"official|third_party|unclear\",\"evidence\":\"what the snippet really supports\",\"limitation\":\"what is missing or wrong, incl. constraint conflicts\",\"risk\":\"\",\"recommendation\":\"investigate|watch|propose|no_action\"}]";
function verifyFindings(f, snippets, ov){
  if(!f.length) return Promise.resolve(f);
  var usr="FINDINGS:\n"+f.map(function(x,i){ return (i+1)+". "+x.name+"\n   url: "+x.url+"\n   scout_claim: "+(x.what_it_does||"")+"\n   scout_why: "+(x.why_it_matters_for_factory||"")+"\n   scout_confidence: "+(x.confidence||"")+"\n   SNIPPET: "+(snippets[x.url]||"(none)"); }).join("\n");
  return callGemini("research", VERIFIER_SYS, usr, { apiKey:ov.apiKey, model:ov.model }).then(function(r){
    var v=parseFindings(r.text)||[];
    return f.map(function(x,i){
      var m=v[i]&&String(v[i].name||"").toLowerCase()===String(x.name||"").toLowerCase()?v[i]:(v.filter(function(y){ return y&&String(y.name||"").toLowerCase()===String(x.name||"").toLowerCase(); })[0]||v[i]);
      var st=String(m&&m.status||"").toUpperCase(); if(!/^(VERIFIED|PARTIAL|UNVERIFIED|REJECTED)$/.test(st)) st="UNVERIFIED";
      var rec=String(m&&m.recommendation||""); if(st==="REJECTED") rec="no_action";
      x.verify={ status:st, source_type:String(m&&m.source_type||"unclear"), evidence:String(m&&m.evidence||""), limitation:String(m&&m.limitation||""), risk:String(m&&m.risk||""), recommendation:rec||"watch" };
      return x;
    });
  }, function(e){
    f.forEach(function(x){ x.verify={ status:"UNVERIFIED", source_type:"unclear", evidence:"", limitation:engL("Verifier could not run: ","Verifier-ku ma shaqayn: ")+String(e&&e.message||e), risk:"", recommendation:"watch" }; });
    return f;
  });
}
function verifySaved(){
  if(isBusy("research")) return;
  var ov=researchModel(), R=researchLoad();
  if(!ov){ alert(engL("Add a Gemini API key and model in Settings first.","Marka hore Settings-ka ku dar Gemini key iyo model.")); return; }
  if(!R.findings||!R.findings.length) return;
  setBusy("research",true); state.researchErr=""; render();

  verifyFindings(R.findings.map(function(x){ var y={}; for(var k in x) if(k!=="verify") y[k]=x[k]; return y; }), snip, ov)
    .then(function(fv){
      var order={VERIFIED:0,PARTIAL:1,UNVERIFIED:2,REJECTED:3};
      fv.sort(function(a,b){ return (order[a.verify&&a.verify.status]||2)-(order[b.verify&&b.verify.status]||2); });
      R.findings=fv; if(String(R.model||"").indexOf("Verifier")<0) R.model=(R.model||"")+" + Verifier"; researchSave(R);
