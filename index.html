}
function runResearch(){
  if(isBusy("research")) return;
  var ov=researchModel();
  if(!ov){ alert(engL("Add a Gemini API key and a Research or Product Intelligence model in Settings first.","Marka hore Settings-ka ku dar Gemini key iyo model Research ama Product Intelligence.")); return; }
  var R=researchLoad(), known=(R.known||[]).slice(-30);
  setBusy("research",true); state.researchErr=""; render();
  var results=[];
  /* Patch 23.1: search with Tavily (free, no card), then Gemini only picks from those real results. */
  var useTavily=!!String(getSettings().tavilyKey||"").trim();
  /* Patch 23.4: Groq browser search is token-heavy, so use ONE combined search per run (fits the free per-minute limit). */
  var queries=useTavily?SCOUT_QUERIES:["This month: free-tier developer API news (no credit card) for LLMs and AI coding/testing agents, open-source AI code review tools, and changes to Groq or Gemini API free limits. Prefer official docs and changelogs."];
  queries.reduce(function(pr,q){ return pr.then(function(){ return (useTavily?tavilySearch(q):groqSearch(q)).then(function(r){ results=results.concat(r); }); }); }, Promise.resolve())
    .then(function(){
      var seen={}; results=results.filter(function(r){ if(!/^https?:\/\//i.test(r.url)||seen[r.url]) return false; seen[r.url]=1; return true; });
      if(!results.length) throw new Error(engL("The web search returned nothing. Try again later.","Raadintu waxba ma soo celin. Mar dambe isku day."));
      var usr="Today is "+new Date().toISOString().slice(0,10)+".\nKNOWN_FINDINGS: "+(known.length?known.join("; "):"(none)")
        +"\nSEARCH_RESULTS:\n"+results.map(function(r,i){ return (i+1)+". "+r.title+"\n   url: "+r.url+"\n   "+r.snippet; }).join("\n");
      return callGemini("research", SCOUT_SYS, usr, { apiKey:ov.apiKey, model:ov.model });
    })
    .then(function(r){
      var arr=parseFindings(r.text);
      if(!arr) throw new Error(engL("The Scout did not return a readable list. Try again.","Scout-ku liis la akhrin karo ma soo celin. Mar kale isku day."));
      var okUrl={}; results.forEach(function(x){ okUrl[x.url]=1; });
      var f=arr.filter(function(x){ return x && x.name && okUrl[String(x.url||"")]; }).slice(0,3);   /* a link must be one the search really returned */
      var nk=(R.known||[]).concat(f.map(function(x){ return String(x.name); })).slice(-60);
      var snip={}; results.forEach(function(x){ snip[x.url]=x.snippet; });
      f.forEach(function(x){ x.snippet=snip[x.url]||""; });
      rlBanner(engL("Verifier is checking the findings\u2026","Verifier-ku wuxuu hubinayaa natiijooyinka\u2026"));
      return verifyFindings(f, snip, ov).then(function(fv){
        rlBanner("");
        var order={VERIFIED:0,PARTIAL:1,UNVERIFIED:2,REJECTED:3};
        fv.sort(function(a,b){ return (order[a.verify&&a.verify.status]||2)-(order[b.verify&&b.verify.status]||2); });
        researchSave({ at:new Date().toISOString(), model:ov.model+(useTavily?" + Tavily":" + Groq search")+" + Verifier", findings:fv, sources:results.slice(0,8).map(function(x){ return { uri:x.url, title:x.title||x.url }; }), dropped:arr.length-f.length, known:nk });
      });
    })
    .catch(function(e){ state.researchErr=String(e&&e.message||e); })
    .then(function(){ setBusy("research",false); render(); });
}

/* ---------- Cloud sync (Supabase) ----------
   Local-first: localStorage stays the working copy; changed projects are
   pushed (debounced) and pulled on start / sign-in. Newest updatedAt wins.
   Deletes are soft (deleted=true) so they sync across devices.
   API keys / settings are NEVER uploaded. */
var LS_CLOUD = "aiaf_cloud_v1";
var cloud = { client:null, user:null, status:"off", msg:"", dirty:{}, timer:null, flushing:false };
function getCloudCfg(){
  try{ var r=localStorage.getItem(LS_CLOUD); var c=r?JSON.parse(r):{};
    return { url:c.url||"", anon:c.anon||"", lastUid:c.lastUid||"" }; }
  catch(e){ return { url:"", anon:"", lastUid:"" }; }
}
function saveCloudCfg(c){ try{ localStorage.setItem(LS_CLOUD, JSON.stringify(c)); }catch(e){} }
function tsOf(x){ var t=Date.parse(x||""); return isNaN(t)?0:t; }
function cloudBadge(){
  var m={ off:["b-idle","Local only"], signed_out:["b-idle","Signed out"], syncing:["b-phase","Syncing\u2026"],
          ok:["b-active","Synced"], error:["b-blocked","Sync error"] }[cloud.status] || ["b-idle",cloud.status];
  return '<span class="badge '+m[0]+'">'+esc(m[1])+'</span>'+(cloud.msg?(' <span class="help">'+esc(cloud.msg)+'</span>'):'');
}
function cloudSetStatus(st, msg){
  cloud.status=st; cloud.msg=msg||"";
  var el=document.getElementById("cloud_status"); if(el) el.innerHTML=cloudBadge();
}
function cloudInit(){
  var c=getCloudCfg();
  cloud.client=null; cloud.user=null;
  if(!c.url || !c.anon){ cloudSetStatus("off"); return Promise.resolve(); }
  if(!window.supabase || !window.supabase.createClient){ cloudSetStatus("error","Supabase library not loaded (offline?). Working locally."); return Promise.resolve(); }
  try{
    cloud.client=window.supabase.createClient(c.url, c.anon, { auth:{ persistSession:true, autoRefreshToken:true, storageKey:"aiaf_sb_auth" } });
  }catch(e){ cloudSetStatus("error", e.message); return Promise.resolve(); }
  return cloud.client.auth.getSession().then(function(r){
    var sess=r && r.data && r.data.session;
    if(!sess){ cloudSetStatus("signed_out"); return; }
    return cloudAfterSignIn(sess.user);
  }).catch(function(e){ cloudSetStatus("error", e.message); });
}
/* Protect shared devices: projects left by ANOTHER account are not silently uploaded. */
function cloudAfterSignIn(user){
  cloud.user=user;
  var c=getCloudCfg();
  if(c.lastUid && c.lastUid!==user.id && loadProjects().length){
    if(confirm("This device has projects from a different account. Remove them from this device before loading yours?\n\nOK = remove them (recommended)\nCancel = keep them and upload them to THIS account")){
      saveProjects([]);
    }
  }
  c.lastUid=user.id; saveCloudCfg(c);
  return cloudPull();
}
function cloudMarkDirty(id, obj){
  if(!cloud.client || !cloud.user || !id) return;
  cloud.dirty[id]=obj||getProject(id)||null;
  if(cloud.timer) clearTimeout(cloud.timer);
  cloud.timer=setTimeout(cloudFlush, 1500);
}
/* Patch 15: a big app's checkpoints stay on this device; the cloud copy keeps the current code. */
function cloudSlim(p){
  var bytes=0; ((p.build&&p.build.files)||[]).forEach(function(f){ bytes+=String(f.content||"").length; });
  if(bytes<=300000 || !p.buildHistory || !p.buildHistory.length) return p;
  var c=JSON.parse(JSON.stringify(p));
  c.buildHistory=c.buildHistory.map(function(h){ var x={}; for(var k in h){ if(k!=="files") x[k]=h[k]; } x.files=[]; x.filesOmitted=true; return x; });
  return c;
}
function cloudFlush(){
  cloud.timer=null;
  if(!cloud.client || !cloud.user) return Promise.resolve();
  if(cloud.flushing){ cloud.timer=setTimeout(cloudFlush, 1500); return Promise.resolve(); }
  var ids=Object.keys(cloud.dirty); if(!ids.length) return Promise.resolve();
  var batch=cloud.dirty; cloud.dirty={};
  var rows=[];
  for(var i=0;i<ids.length;i++){
    var p=batch[ids[i]]; if(!p) continue;
    if(!p.updatedAt) p.updatedAt=new Date().toISOString();
    rows.push({ owner:cloud.user.id, id:p.id, data:cloudSlim(p), deleted:false, updated_at:p.updatedAt });
  }
  if(!rows.length) return Promise.resolve();
  cloud.flushing=true; cloudSetStatus("syncing","Uploading "+rows.length+" project(s)");
  function requeue(msg){
    for(var k in batch){ if(!cloud.dirty[k]) cloud.dirty[k]=batch[k]; }
    cloudSetStatus("error", msg+" \u2014 will retry.");
    cloud.timer=setTimeout(cloudFlush, 15000);
  }
  return cloud.client.from("aiaf_projects").upsert(rows, { onConflict:"owner,id" }).then(function(res){
    cloud.flushing=false;
    if(res.error){ requeue(res.error.message); return; }
    cloudSetStatus("ok","Synced "+nowStr());
  }).catch(function(e){ cloud.flushing=false; requeue((e&&e.message)||"network error"); });
}
function cloudDelete(id){
  if(!cloud.client || !cloud.user) return;
  delete cloud.dirty[id];
  cloud.client.from("aiaf_projects").upsert([{ owner:cloud.user.id, id:id, data:{ id:id }, deleted:true, updated_at:new Date().toISOString() }], { onConflict:"owner,id" })
    .then(function(res){ if(res.error) cloudSetStatus("error","Delete not synced: "+res.error.message); })
    .catch(function(e){ cloudSetStatus("error","Delete not synced: "+((e&&e.message)||"network error")); });
}
/* ---------- Patch 25: cloud backup of the Engineer Playbook and Research memory ----------
   Stored as two special rows in the existing aiaf_projects table (same owner, same security rules).
   Newest copy wins; they never appear in the project list. */
var SPECIAL_ROWS={
  "__aiaf_playbook__":{ tsKey:"aiaf_eng_lessons_ts", has:function(){ return localStorage.getItem(LS_LESSONS)!=null; }, get:function(){ return getLessons(); },
    put:function(v){ if(Array.isArray(v)){ try{ localStorage.setItem(LS_LESSONS, JSON.stringify(v.filter(function(x){ return typeof x==="string"&&x.trim(); }).slice(0,60))); }catch(e){} } } },
  "__aiaf_research__":{ tsKey:"aiaf_research_ts", has:function(){ return localStorage.getItem(LS_RESEARCH)!=null; }, get:function(){ return researchLoad(); },
    put:function(v){ if(v&&typeof v==="object"&&!Array.isArray(v)){ try{ localStorage.setItem(LS_RESEARCH, JSON.stringify(v)); }catch(e){} } } }
};
function specTs(id){ var n=+(localStorage.getItem(SPECIAL_ROWS[id].tsKey)||0); return isFinite(n)?n:0; }
function specTouch(id){ try{ localStorage.setItem(SPECIAL_ROWS[id].tsKey, String(Date.now())); }catch(e){} specPush(id); }
function specPush(id){
  if(typeof cloud==="undefined" || !cloud.client || !cloud.user) return Promise.resolve();
  var sp=SPECIAL_ROWS[id], ts=specTs(id)||Date.now();
  return cloud.client.from("aiaf_projects").upsert([{ owner:cloud.user.id, id:id, data:{ id:id, kind:id, value:sp.get(), ts:ts }, deleted:false, updated_at:new Date(ts).toISOString() }], { onConflict:"owner,id" })
    .then(function(res){ if(res&&res.error) cloudSetStatus("error", "Playbook/Research backup failed: "+res.error.message); })
    .catch(function(e){ cloudSetStatus("error", "Playbook/Research backup failed: "+((e&&e.message)||"network error")); });
}
function specSync(rows){
  var jobs=[];
  Object.keys(SPECIAL_ROWS).forEach(function(id){
    var sp=SPECIAL_ROWS[id], r=null;
    for(var i=0;i<rows.length;i++){ if(rows[i]&&rows[i].id===id){ r=rows[i]; break; } }
    var rts=(r&&!r.deleted&&r.data&&+r.data.ts)||0, lts=specTs(id);
    if(r && !r.deleted && rts>lts){ sp.put(r.data.value); try{ localStorage.setItem(sp.tsKey, String(rts)); }catch(e){} }
    else if(sp.has() && (lts>rts || !r)){ if(!lts){ try{ localStorage.setItem(sp.tsKey, String(Date.now())); }catch(e){} } jobs.push(specPush(id)); }
  });
  return Promise.all(jobs);
}
function cloudPull(){
  if(!cloud.client || !cloud.user) return Promise.resolve();
  cloudSetStatus("syncing","Downloading");
  return cloud.client.from("aiaf_projects").select("id,data,deleted,updated_at").then(function(res){
    if(res.error) throw res.error;
    var allRows=res.data||[], specRows=allRows.filter(function(r){ return r&&SPECIAL_ROWS[r.id]; });
    try{ specSync(specRows); }catch(e){}
    var merged=mergeCloudRows(loadProjects(), allRows.filter(function(r){ return !(r&&SPECIAL_ROWS[r.id]); }));
    if(merged.changed) saveProjects(merged.list);
    for(var i=0;i<merged.push.length;i++){ cloud.dirty[merged.push[i].id]=merged.push[i]; }
    cloudSetStatus("ok","Synced "+nowStr());
    if(merged.push.length) return cloudFlush();
  }).catch(function(e){ cloudSetStatus("error", (e&&e.message)||"pull failed"); });
}
/* Pure merge (testable): newest wins; remote soft-deletes remove older local copies. */
function mergeCloudRows(local, rows){
  var out=local.slice(), idx={}, i, changed=false, push=[], seenRemote={};
  for(i=0;i<out.length;i++) idx[out[i].id]=i;
  for(i=0;i<rows.length;i++){
    var row=rows[i]; if(!row || !safeImportId(row.id)) continue;
    seenRemote[row.id]=true;
    var li=idx[row.id], lp=(li===undefined)?null:out[li];
    var rTime=Math.max(tsOf(row.updated_at), tsOf(row.data && row.data.updatedAt));
    if(row.deleted){
      if(lp && tsOf(lp.updatedAt)<=rTime){ out[li]=null; changed=true; }
      else if(lp){ push.push(lp); }
      continue;
    }
    var rp=row.data;
    if(!rp || rp.id!==row.id || typeof rp.name!=="string") continue;
    if(!lp){ out.push(rp); changed=true; }
    else if(tsOf(rp.updatedAt)>tsOf(lp.updatedAt)){
      if(rp.buildHistory && rp.buildHistory.some(function(h){ return h && h.filesOmitted; }) && lp.buildHistory) rp.buildHistory=lp.buildHistory;
      out[li]=rp; changed=true;
    }
    else if(tsOf(lp.updatedAt)>tsOf(rp.updatedAt)){ push.push(lp); }
  }
  out=out.filter(function(x){ return !!x; });
  for(i=0;i<out.length;i++){ if(!seenRemote[out[i].id]) push.push(out[i]); }
  if(changed) out.sort(function(a,b){ return tsOf(b.createdAt)-tsOf(a.createdAt); });
  return { list:out, changed:changed, push:push };
}
/* ---- Settings UI actions ---- */
function cloudReadForm(){
  var c=getCloudCfg();
  var u=document.getElementById("cl_url"), a=document.getElementById("cl_anon");
  if(u) c.url=u.value.trim().replace(/\/+$/,"");
  if(a) c.anon=a.value.trim();
  saveCloudCfg(c); return c;
}
function cloudCreds(){
  var e=document.getElementById("cl_email"), pw=document.getElementById("cl_pass");
  return { email:e?e.value.trim():"", password:pw?pw.value:"" };
}
function cloudConnectThen(fn){
  cloudReadForm();
  return cloudInit().then(function(){
    if(!cloud.client){ alert("Enter your Supabase URL and anon key first."); render(); return; }
    return fn();
  });
}
function cloudSignIn(){
  var cr=cloudCreds(); if(!cr.email || !cr.password){ alert("Enter email and password."); return; }
  cloudConnectThen(function(){
    cloudSetStatus("syncing","Signing in");
    return cloud.client.auth.signInWithPassword(cr).then(function(res){
      if(res.error){ cloudSetStatus("error", res.error.message); return; }
      return cloudAfterSignIn(res.data.user);
    }).then(function(){ render(); });
  });
}
function cloudSignUp(){
  var cr=cloudCreds(); if(!cr.email || cr.password.length<8){ alert("Enter an email and a password of at least 8 characters."); return; }
  cloudConnectThen(function(){
    return cloud.client.auth.signUp(cr).then(function(res){
      if(res.error){ cloudSetStatus("error", res.error.message); return; }
      if(res.data && res.data.session){ return cloudAfterSignIn(res.data.user).then(function(){ render(); }); }
      cloudSetStatus("signed_out","Check your email to confirm, then Sign in.");
    });
  });
}
function cloudSignOut(clearDevice){
  if(clearDevice && !confirm("Sign out and remove all projects from THIS device? (They stay in the cloud.)")) return;
  var done=function(){
    if(clearDevice) saveProjects([]);
    cloud.user=null; cloudSetStatus("signed_out"); render();
  };
  cloudFlush().then(function(){ return cloud.client ? cloud.client.auth.signOut() : null; }).then(done, done);
}
function cloudSyncNow(){
  if(!cloud.user){ alert("Sign in first."); return; }
  cloudFlush().then(cloudPull).then(function(){ render(); });
}

/* ---------- PWA manifest (installable) ---------- */
try{
  var iconUrl="";
  try{
    var cv=document.createElement("canvas"); cv.width=512; cv.height=512;
    var cx=cv.getContext("2d");
    cx.fillStyle="#0f2a4a"; cx.fillRect(0,0,512,512);
    cx.fillStyle="#d92d20"; cx.beginPath(); cx.arc(256,256,150,0,Math.PI*2); cx.fill();
    cx.fillStyle="#ffffff"; cx.font="bold 140px -apple-system,Segoe UI,Arial,sans-serif";
    cx.textAlign="center"; cx.textBaseline="middle"; cx.fillText("AF",256,264);
    iconUrl=cv.toDataURL("image/png");
  }catch(e){}
  var here=String(location.href).split("#")[0].split("?")[0];
  var manifest = {
    name:"AI App Factory", short_name:"App Factory",
    start_url:here, scope:here.substring(0, here.lastIndexOf("/")+1), display:"standalone",
    background_color:"#0f2a4a", theme_color:"#0f2a4a",
    icons: iconUrl ? [{ src:iconUrl, sizes:"512x512", type:"image/png", purpose:"any maskable" }] : []
  };
  var mblob = new Blob([JSON.stringify(manifest)], { type:"application/manifest+json" });
  var link = document.createElement("link");
  link.rel="manifest"; link.href=URL.createObjectURL(mblob);
  document.head.appendChild(link);
  if(iconUrl){
    var ati=document.createElement("link"); ati.rel="apple-touch-icon"; ati.href=iconUrl; document.head.appendChild(ati);
  }
  var amc=document.createElement("meta"); amc.name="apple-mobile-web-app-capable"; amc.content="yes"; document.head.appendChild(amc);
}catch(e){}

window.onload = function(){ render(); cloudInit().then(function(){ render(); }); };
