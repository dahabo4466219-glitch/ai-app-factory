<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<meta name="theme-color" content="#0f2a4a">
<title>AI App Factory</title>
<style>
:root{
  --navy:#0f2a4a; --navy-2:#16406e; --navy-3:#1f4f85;
  --red:#d92d20; --red-dark:#b42318;
  --bg:#f4f6fa; --card:#ffffff; --line:#e2e8f0;
  --ink:#101828; --muted:#667085; --ok:#12805c; --warn:#b54708; --blocked:#b42318;
  --shadow:0 1px 2px rgba(16,24,40,.06),0 1px 3px rgba(16,24,40,.10);
}
*{box-sizing:border-box}
html,body{margin:0;padding:0}
body{font-family:-apple-system,BlinkMacSystemFont,"Segoe UI",Roboto,Helvetica,Arial,sans-serif;background:var(--bg);color:var(--ink);line-height:1.5;-webkit-font-smoothing:antialiased}
a{color:var(--navy-3);text-decoration:none}
button{font-family:inherit;cursor:pointer}
input,textarea,select{font-family:inherit;font-size:15px}
.wrap{max-width:1080px;margin:0 auto;padding:0 16px}

/* Top bar */
.topbar{background:var(--navy);color:#fff}
.topbar .wrap{display:flex;align-items:center;justify-content:space-between;height:56px}
.brand{display:flex;align-items:center;gap:10px;font-weight:700;font-size:17px;color:#fff}
.brand .dot{width:10px;height:10px;border-radius:50%;background:var(--red)}
.brand small{font-weight:500;opacity:.7;font-size:12px}
.navbtn{background:transparent;border:0;color:#cdd7e6;padding:8px 12px;border-radius:8px;font-size:14px}
.navbtn:hover{background:rgba(255,255,255,.08);color:#fff}
.navbtn.active{background:var(--navy-2);color:#fff}
.nav-desktop{display:flex;gap:4px}
.menu-toggle{display:none;background:transparent;border:0;color:#fff;font-size:22px;padding:4px 8px}
.nav-mobile{display:none;flex-direction:column;background:var(--navy-2);padding:6px 0}
.nav-mobile .navbtn{border-radius:0;text-align:left;padding:12px 20px}

/* Layout */
.page{padding:22px 0 60px}
.h1{font-size:22px;font-weight:700;margin:0 0 2px}
.sub{color:var(--muted);font-size:14px;margin:0 0 18px}
.row{display:flex;gap:14px;flex-wrap:wrap}
.grid{display:grid;gap:14px}
.grid-4{grid-template-columns:repeat(4,1fr)}
.grid-2{grid-template-columns:repeat(2,1fr)}
.card{background:var(--card);border:1px solid var(--line);border-radius:12px;box-shadow:var(--shadow)}
.card.p{padding:16px}
.stat{padding:16px}
.stat .k{font-size:12px;color:var(--muted);text-transform:uppercase;letter-spacing:.4px}
.stat .v{font-size:28px;font-weight:700;margin-top:6px}
.stat .v.red{color:var(--red)}
.stat .v.navy{color:var(--navy)}

/* Buttons */
.btn{background:var(--navy);color:#fff;border:0;padding:10px 16px;border-radius:9px;font-size:14px;font-weight:600}
.btn:hover{background:var(--navy-2)}
.btn.red{background:var(--red)} .btn.red:hover{background:var(--red-dark)}
.btn.ghost{background:#fff;color:var(--navy);border:1px solid var(--line)}
.btn.ghost:hover{background:#f2f5fa}
.btn.sm{padding:6px 11px;font-size:13px}
.btn:disabled{opacity:.5;cursor:not-allowed}

/* Forms */
label{display:block;font-size:13px;font-weight:600;margin:0 0 5px;color:#344054}
.field{margin-bottom:14px}
input[type=text],input[type=password],textarea,select{width:100%;padding:10px 12px;border:1px solid var(--line);border-radius:9px;background:#fff;color:var(--ink)}
input:focus,textarea:focus,select:focus{outline:2px solid rgba(31,79,133,.25);border-color:var(--navy-3)}
textarea{min-height:110px;resize:vertical}
.help{font-size:12px;color:var(--muted);margin-top:5px}

/* Badges */
.badge{display:inline-block;font-size:12px;font-weight:600;padding:3px 9px;border-radius:20px;border:1px solid transparent}
.b-active{background:#e7f4ee;color:var(--ok);border-color:#bfe3d2}
.b-idle{background:#eef1f6;color:var(--muted);border-color:var(--line)}
.b-done{background:#e8effb;color:var(--navy-2);border-color:#c7d9f4}
.b-blocked{background:#fdeceb;color:var(--blocked);border-color:#f6c9c6}
.b-phase{background:#fff4e8;color:var(--warn);border-color:#fbdcb8}

/* Lists */
.plist .item{display:flex;justify-content:space-between;align-items:center;padding:14px 16px;border-bottom:1px solid var(--line)}
.plist .item:last-child{border-bottom:0}
.plist .item:hover{background:#fafbfe}
.plist .nm{font-weight:600}
.plist .ds{color:var(--muted);font-size:13px;margin-top:2px;max-width:640px;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.muted{color:var(--muted)}
.small{font-size:13px}

/* Tabs */
.tabs{display:flex;gap:4px;border-bottom:1px solid var(--line);margin:6px 0 16px;flex-wrap:wrap}
.tab{background:transparent;border:0;padding:10px 14px;font-size:14px;font-weight:600;color:var(--muted);border-bottom:2px solid transparent}
.tab.active{color:var(--navy);border-bottom-color:var(--red)}

/* Agent cards */
.agent{padding:16px;display:flex;gap:14px;align-items:flex-start}
.agent .ic{font-size:26px;width:44px;height:44px;display:flex;align-items:center;justify-content:center;background:#eef2f8;border-radius:10px;flex-shrink:0}
.agent .nm{font-weight:700}
.agent .rl{font-size:13px;color:var(--muted);margin-top:3px}

/* Callouts */
.callout{border-radius:10px;padding:12px 14px;font-size:13.5px;margin:0 0 14px;border:1px solid}
.callout.warn{background:#fff8ef;border-color:#fbdcb8;color:#7a4a12}
.callout.info{background:#eef4fd;border-color:#c7d9f4;color:#1c3d63}
.callout.ok{background:#eefaf4;border-color:#bfe3d2;color:#0d5f45}

/* Code */
.file{border:1px solid var(--line);border-radius:10px;margin-bottom:12px;overflow:hidden}
.file .fh{display:flex;justify-content:space-between;align-items:center;background:#f7f9fc;padding:9px 12px;border-bottom:1px solid var(--line)}
.file .fh .fn{font-family:ui-monospace,Menlo,Consolas,monospace;font-size:13px;font-weight:600}
.file pre{margin:0;padding:12px;overflow:auto;max-height:340px;background:#0f2a4a;color:#e6edf6}
.file pre code{font-family:ui-monospace,Menlo,Consolas,monospace;font-size:12.5px;white-space:pre}

.activity{max-height:280px;overflow:auto}
.activity .a{display:flex;gap:10px;padding:8px 0;border-bottom:1px solid var(--line);font-size:13px}
.activity .a:last-child{border-bottom:0}
.activity .at{color:var(--muted);white-space:nowrap;font-variant-numeric:tabular-nums}
.spin{display:inline-block;width:14px;height:14px;border:2px solid rgba(255,255,255,.4);border-top-color:#fff;border-radius:50%;animation:sp .7s linear infinite;vertical-align:-2px;margin-right:6px}
.btn.ghost .spin{border:2px solid rgba(15,42,74,.3);border-top-color:var(--navy)}
@keyframes sp{to{transform:rotate(360deg)}}
.divider{height:1px;background:var(--line);margin:18px 0}
.kv{display:grid;grid-template-columns:150px 1fr;gap:6px 12px;font-size:14px}
.kv .kk{color:var(--muted)}
.right{text-align:right}
.flex-between{display:flex;justify-content:space-between;align-items:center;gap:12px;flex-wrap:wrap}

@media(max-width:820px){
  .grid-4{grid-template-columns:repeat(2,1fr)}
  .grid-2{grid-template-columns:1fr}
  .nav-desktop{display:none}
  .menu-toggle{display:block}
  .kv{grid-template-columns:1fr}
}
</style>
</head>
<body>
<div id="app"></div>
<script>
"use strict";

/* ============================================================
   AI App Factory — Phase 1 (Foundation)
   Active agents: Project Manager, Design, Builder, Supervisor/QA, Cybersecurity.
   Real execution: via an external sandbox runner (E2B) the user deploys;
   until its URL is set, QA/Security do static review only (never fake results).
   Persistence: localStorage (swap to Supabase for production).
   Architecture: single-file HTML PWA. Persistence: localStorage
   (swap to Supabase for production). API calls go direct from the
   browser — for a multi-user product put a Cloudflare Worker /
   Supabase Edge Function proxy in front and point Base URL at it.
   ============================================================ */

var LS_PROJECTS = "aiaf_projects_v1";
var LS_SETTINGS = "aiaf_settings_v1";

var state = { view: "dashboard", projectId: null, projectTab: "plan", menu: false, busy: {}, previewDevice: "mobile" };
var MAX_ITER = 3;

/* ---------- storage ---------- */
function loadProjects(){
  try{ var r = localStorage.getItem(LS_PROJECTS); return r ? JSON.parse(r) : []; }
  catch(e){ return []; }
}
function saveProjects(list){
  try{ localStorage.setItem(LS_PROJECTS, JSON.stringify(list)); }catch(e){}
}
function getSettings(){
  var def = { provider:"openai_compatible", baseUrl:"", apiKey:"", defaultModel:"",
              agentModels:{ pm:"", design:"", builder:"", qa:"", sec:"" }, pricePerMillion:0, totalTokens:0,
              sandboxUrl:"", sandboxSecret:"" };
  try{
    var r = localStorage.getItem(LS_SETTINGS);
    if(!r) return def;
    var s = JSON.parse(r);
    if(!s.agentModels) s.agentModels = { pm:"", design:"", builder:"", qa:"", sec:"" };
    if(s.agentModels.qa===undefined) s.agentModels.qa="";
    if(s.agentModels.sec===undefined) s.agentModels.sec="";
    if(s.sandboxUrl===undefined) s.sandboxUrl="";
    if(s.sandboxSecret===undefined) s.sandboxSecret="";
    return s;
  }catch(e){ return def; }
}
function saveSettings(s){
  try{ localStorage.setItem(LS_SETTINGS, JSON.stringify(s)); }catch(e){}
}
function getProject(id){
  var list = loadProjects();
  for(var i=0;i<list.length;i++){ if(list[i].id===id) return list[i]; }
  return null;
}
function upsertProject(p){
  var list = loadProjects(); var found=false;
  for(var i=0;i<list.length;i++){ if(list[i].id===p.id){ list[i]=p; found=true; break; } }
  if(!found) list.unshift(p);
  saveProjects(list);
}

/* ---------- utils ---------- */
function uid(){ return "p"+Date.now().toString(36)+Math.floor(Math.random()*1000).toString(36); }
function nowStr(){
  var d=new Date();
  function z(n){ return (n<10?"0":"")+n; }
  return z(d.getHours())+":"+z(d.getMinutes());
}
function esc(s){
  s = (s===undefined||s===null) ? "" : String(s);
  return s.replace(/&/g,"&amp;").replace(/</g,"&lt;").replace(/>/g,"&gt;")
          .replace(/"/g,"&quot;").replace(/'/g,"&#39;");
}
function safeColor(hex){
  hex = (hex===undefined||hex===null) ? "" : String(hex).trim();
  if(/^#?[0-9a-fA-F]{3}$|^#?[0-9a-fA-F]{6}$|^#?[0-9a-fA-F]{8}$/.test(hex)){ return hex.charAt(0)==="#"?hex:("#"+hex); }
  return "#888888";
}
function designSummary(p){
  if(!p.design) return "";
  var d=p.design, out="DESIGN SPEC (implement this exactly):\n";
  var dt=d.design_tokens||d.design_system;
  if(dt){
    if(dt.colors){ var cols=[]; for(var i=0;i<dt.colors.length;i++){ var c=dt.colors[i];
        cols.push(typeof c==="string"?c:((c.name||"")+" "+(c.hex||"")+(c.role?(" ("+c.role+")"):""))); }
      out+="Colors: "+cols.join(", ")+"\n"; }
    if(dt.typography){ out+="Typography: "+(typeof dt.typography==="string"?dt.typography:JSON.stringify(dt.typography))+"\n"; }
    if(dt.spacing){ out+="Spacing: "+(Array.isArray(dt.spacing)?dt.spacing.join(", "):dt.spacing)+"\n"; }
    if(dt.radius){ out+="Radius: "+dt.radius+"\n"; }
  }
  if(d.components&&d.components.length){ var cn=[]; for(var k=0;k<d.components.length;k++){ var cc=d.components[k];
      cn.push(typeof cc==="string"?cc:((cc.name||"")+(cc.spec?(": "+cc.spec):""))); } out+="Components: "+cn.join("; ")+"\n"; }
  if(d.responsive_notes) out+="Responsive: "+d.responsive_notes+"\n";
  return out;
}
function logActivity(p, agent, msg){
  if(!p.activity) p.activity=[];
  p.activity.unshift({ t:nowStr(), agent:agent, msg:msg });
  if(p.activity.length>60) p.activity.length=60;
}
function extractJson(text){
  if(!text) return null;
  var t = String(text).trim();
  var fence = String.fromCharCode(96,96,96);
  t = t.replace(new RegExp("^"+fence+"(?:json)?","i"),"").replace(new RegExp(fence+"$"),"").trim();
  var a = t.indexOf("{"); var b = t.lastIndexOf("}");
  var a2 = t.indexOf("["); var b2 = t.lastIndexOf("]");
  var cand = null;
  if(a!==-1 && b!==-1){ cand = t.substring(a,b+1); }
  if(a2!==-1 && b2!==-1 && (a===-1 || a2<a)){ cand = t.substring(a2,b2+1); }
  if(!cand) cand = t;
  try{ return JSON.parse(cand); }catch(e){ return null; }
}

/* ---------- model layer ---------- */
function modelFor(agentKey){
  var s = getSettings();
  var m = s.agentModels && s.agentModels[agentKey];
  return (m && m.length) ? m : s.defaultModel;
}
function addTokens(n){
  var s = getSettings(); s.totalTokens = (s.totalTokens||0) + (n||0); saveSettings(s);
}
function isTransient(status){
  return status===429 || status===500 || status===502 || status===503 || status===408 || status===0;
}
function withRetry(makeCall, tries){
  tries = tries || 3;
  function attempt(n){
    return makeCall().catch(function(err){
      var st = err && err.status;
      var netErr = err && err.message && /load failed|failed to fetch|network|timeout/i.test(err.message);
      if((isTransient(st) || netErr) && n < tries){
        var wait = 900 * Math.pow(2, n-1);
        return new Promise(function(r){ setTimeout(r, wait); }).then(function(){ return attempt(n+1); });
      }
      throw err;
    });
  }
  return attempt(1);
}
function callModel(agentKey, system, user){
  var s = getSettings();
  var model = modelFor(agentKey);
  if(!s.apiKey || !model){
    return Promise.reject(new Error("No model configured. Open Settings and add an API key + model name."));
  }
  var makeCall;
  if(s.provider==="anthropic"){
    var abase = s.baseUrl && s.baseUrl.length ? s.baseUrl : "https://api.anthropic.com";
    makeCall = function(){ return fetch(abase + "/v1/messages", {
      method:"POST",
      headers:{ "Content-Type":"application/json", "x-api-key":s.apiKey,
                "anthropic-version":"2023-06-01",
                "anthropic-dangerous-direct-browser-access":"true" },
      body: JSON.stringify({ model:model, max_tokens:4000, system:system,
                             messages:[{ role:"user", content:user }] })
    }).then(handleAnthropic); };
  } else {
    var b = s.baseUrl && s.baseUrl.length ? s.baseUrl : "https://api.openai.com/v1";
    makeCall = function(){ return fetch(b + "/chat/completions", {
      method:"POST",
      headers:{ "Content-Type":"application/json", "Authorization":"Bearer "+s.apiKey },
      body: JSON.stringify({ model:model,
        messages:[{ role:"system", content:system },{ role:"user", content:user }],
        temperature:0.4 })
    }).then(handleOpenAI); };
  }
  return withRetry(makeCall, 3);
}
function handleOpenAI(res){
  return res.text().then(function(raw){
    if(!res.ok){ var e=new Error(shortErr(res.status, raw)); e.status=res.status; throw e; }
    var d; try{ d=JSON.parse(raw); }catch(e){ throw new Error("Bad response from provider."); }
    var txt = d && d.choices && d.choices[0] && d.choices[0].message ? d.choices[0].message.content : "";
    var tok = d && d.usage ? (d.usage.total_tokens||0) : 0;
    addTokens(tok);
    return { text:txt||"", tokens:tok };
  });
}
function handleAnthropic(res){
  return res.text().then(function(raw){
    if(!res.ok){ var e=new Error(shortErr(res.status, raw)); e.status=res.status; throw e; }
    var d; try{ d=JSON.parse(raw); }catch(e){ throw new Error("Bad response from provider."); }
    var txt="";
    if(d && d.content){ for(var i=0;i<d.content.length;i++){ if(d.content[i].type==="text") txt+=d.content[i].text; } }
    var tok = d && d.usage ? ((d.usage.input_tokens||0)+(d.usage.output_tokens||0)) : 0;
    addTokens(tok);
    return { text:txt, tokens:tok };
  });
}
function shortErr(status, raw){
  var m = raw;
  try{ var d=JSON.parse(raw); if(d.error && d.error.message) m=d.error.message; }catch(e){}
  if(m && m.length>200) m = m.substring(0,200)+"...";
  return "Provider error ("+status+"): "+m;
}

/* ---------- agents ---------- */
function runPM(p){
  var sys = "You are the PROJECT MANAGER agent in a software factory. "
    + "Turn the user's app idea into a concrete, structured development plan. "
    + "Be realistic and do not claim work is done. "
    + "Return ONLY valid JSON, no markdown, with this exact shape: "
    + "{\"overview\":string,\"recommended_stack\":[string],"
    + "\"tasks\":[{\"id\":string,\"title\":string,\"agent\":\"Design|Builder\",\"description\":string,\"depends_on\":[string]}],"
    + "\"risks\":[string],\"clarifications\":[string]}";
  var usr = "APP NAME: "+p.name+"\nAPP IDEA / REQUIREMENTS:\n"+p.description;
  return callModel("pm", sys, usr).then(function(r){
    var j = extractJson(r.text);
    if(!j) throw new Error("Project Manager returned unparseable output. Try again or use a stronger model.");
    return j;
  });
}
function runDesign(p){
  var planCtx = p.plan ? ("PLAN OVERVIEW: "+(p.plan.overview||"")) : "";
  var sys = "You are the DESIGN agent. Produce an implementation-ready design system the Builder can code directly. "
    + "Use a clean, professional palette. Return ONLY valid JSON, no markdown, with this shape: "
    + "{\"design_tokens\":{\"colors\":[{\"name\":string,\"hex\":string,\"role\":string}],"
    + "\"typography\":{\"font_family\":string,\"scale\":[{\"name\":string,\"size\":string,\"weight\":string}]},"
    + "\"spacing\":[string],\"radius\":string},"
    + "\"components\":[{\"name\":string,\"spec\":string}],"
    + "\"screens\":[{\"name\":string,\"desktop\":string,\"tablet\":string,\"mobile\":string,\"components\":[string]}],"
    + "\"user_flows\":[string],\"responsive_notes\":string}. "
    + "hex must be real hex codes like #1f4f85. size like 14px/24px. spacing like [\"4px\",\"8px\",\"16px\"].";
  var usr = "APP: "+p.name+"\nIDEA:\n"+p.description+"\n"+planCtx;
  return callModel("design", sys, usr).then(function(r){
    var j = extractJson(r.text);
    if(!j) throw new Error("Design agent returned unparseable output.");
    return j;
  });
}
function runBuilder(p){
  var ctx = "";
  if(p.plan && p.plan.overview) ctx += "PLAN: "+p.plan.overview+"\n";
  ctx += designSummary(p);
  var sys = "You are the BUILDER agent. Generate the actual, complete source code for the requested "
    + "application as real files. Write working code, not placeholders or TODOs for core features. "
    + "Prefer a simple, runnable implementation. "
    + "Return ONLY valid JSON, no markdown, shape: "
    + "{\"summary\":string,\"files\":[{\"path\":string,\"language\":string,\"content\":string}],"
    + "\"run_commands\":[string],\"how_to_run\":string,\"not_implemented\":[string]}. "
    + "run_commands are the shell commands to install/build/test this project in a Linux sandbox "
    + "(e.g. [\"npm install\",\"npm test\"]); use an empty array for a purely static site.";
  var usr = "APP: "+p.name+"\nREQUIREMENTS:\n"+p.description+"\n"+ctx;
  return callModel("builder", sys, usr).then(function(r){
    var j = extractJson(r.text);
    if(!j || !j.files) throw new Error("Builder returned unparseable output. A stronger model helps here.");
    return j;
  });
}

/* ---------- Phase 2: QA, execution, fix-loop, checkpoints ---------- */
function snapshotBuild(p, note){
  if(!p.build) return;
  if(!p.buildHistory) p.buildHistory=[];
  p.buildHistory.unshift({ v:(p.buildHistory.length+1), ts:nowStr(), note:note,
                           summary:(p.build.summary||""), files:JSON.parse(JSON.stringify(p.build.files||[])) });
  if(p.buildHistory.length>10) p.buildHistory.length=10;
}
function defaultCommands(files){
  var hasPkg=false;
  for(var i=0;i<files.length;i++){ if(/package\.json$/i.test(files[i].path)) hasPkg=true; }
  if(hasPkg) return ["npm install","npm test --if-present","npm run build --if-present"];
  return ["echo static project - nothing to build or test"];
}
function runExecution(p){
  var s=getSettings();
  if(!s.sandboxUrl){ return Promise.resolve({ configured:false }); }
  var files=(p.build&&p.build.files)||[];
  var cmds=(p.build&&p.build.run_commands&&p.build.run_commands.length)?p.build.run_commands:defaultCommands(files);
  var body={ secret:s.sandboxSecret||"", commands:cmds,
             files:files.map(function(f){ return { path:f.path, content:f.content }; }) };
  return fetch(s.sandboxUrl, { method:"POST", headers:{"Content-Type":"application/json"}, body:JSON.stringify(body) })
    .then(function(res){ return res.text().then(function(raw){
      if(!res.ok) throw new Error("Sandbox error ("+res.status+"): "+String(raw).slice(0,200));
      var d; try{ d=JSON.parse(raw); }catch(e){ throw new Error("Bad sandbox response."); }
      d.configured=true; return d;
    }); });
}
function runQA(p){
  var execCtx;
  if(p.exec && p.exec.configured){
    execCtx="EXECUTION RESULTS (real, from sandbox):\n";
    var rs=p.exec.results||[];
    for(var i=0;i<rs.length;i++){ execCtx+="$ "+rs[i].cmd+" (exit "+rs[i].exitCode+")\n"+(rs[i].stdout||"")+"\n"+(rs[i].stderr||"")+"\n"; }
  } else {
    execCtx="NO EXECUTION was performed (no sandbox configured). You cannot verify runtime behaviour. "
      +"Mark anything that needs running the code as UNTESTED, never verified.";
  }
  var files=(p.build&&p.build.files)||[]; var filesCtx="";
  for(var k=0;k<files.length;k++){ filesCtx+="=== "+files[k].path+" ===\n"+files[k].content+"\n"; }
  var sys="You are the SUPERVISOR / QA agent. Independently review the Builder's code against the requirements. "
    +"Do not blindly approve. Only mark a feature 'verified' if execution results prove it works; otherwise 'untested'. "
    +"Return ONLY valid JSON, no markdown: {\"summary\":string,\"verified\":[string],\"failed\":[string],"
    +"\"untested\":[string],\"bugs\":[{\"severity\":\"high|medium|low\",\"title\":string,\"detail\":string,\"fix\":string}],"
    +"\"verdict\":\"pass|changes_requested|blocked\"}";
  var usr="REQUIREMENTS:\n"+p.description+"\n\n"+execCtx+"\n\nCODE:\n"+filesCtx;
  return callModel("qa", sys, usr).then(function(r){
    var j=extractJson(r.text); if(!j) throw new Error("QA agent returned unparseable output."); return j;
  });
}
function runBuilderFix(p){
  var bugs=(p.qa&&p.qa.bugs)||[]; var bugText="";
  for(var i=0;i<bugs.length;i++){ bugText+="- ["+bugs[i].severity+"] "+bugs[i].title+": "+bugs[i].detail+" (suggested fix: "+bugs[i].fix+")\n"; }
  var files=(p.build&&p.build.files)||[]; var filesCtx="";
  for(var k=0;k<files.length;k++){ filesCtx+="=== "+files[k].path+" ===\n"+files[k].content+"\n"; }
  var sys="You are the BUILDER agent applying QA fixes. Return the FULL updated file set (not a diff). "
    +"Preserve working functionality; change only what the bugs require. "
    +"Return ONLY valid JSON, no markdown: {\"summary\":string,\"files\":[{\"path\":string,\"language\":string,\"content\":string}],"
    +"\"run_commands\":[string],\"how_to_run\":string,\"not_implemented\":[string]}";
  var usr="REQUIREMENTS:\n"+p.description+"\n\n"+designSummary(p)+"\nQA BUGS TO FIX:\n"+bugText+"\nCURRENT CODE:\n"+filesCtx;
  return callModel("builder", sys, usr).then(function(r){
    var j=extractJson(r.text); if(!j||!j.files) throw new Error("Builder fix returned unparseable output."); return j;
  });
}
function stepExec(id){
  var p=getProject(id); if(!p) return;
  setBusy("exec",true); render();
  runExecution(p).then(function(d){
    if(!d.configured){ setBusy("exec",false); alert("No sandbox configured. Add the runner URL in Settings."); render(); return; }
    p.exec=d; logActivity(p,"Runner", d.success?"Executed in sandbox — success.":"Executed in sandbox — failures (see logs).");
    upsertProject(p); setBusy("exec",false); render();
  }).catch(function(e){ setBusy("exec",false); alert(e.message); render(); });
}
function stepQA(id){
  var p=getProject(id); if(!p) return;
  setBusy("qa",true); render();
  runQA(p).then(function(j){
    p.qa=j;
    if(j.verdict==="pass"){ p.phase="QA passed"; }
    else if(j.verdict==="blocked"){ p.status="blocked"; p.phase="QA blocked"; }
    else { p.phase="QA: changes requested"; }
    logActivity(p,"Supervisor/QA","Review verdict: "+(j.verdict||"?")+" ("+((j.bugs||[]).length)+" bugs).");
    upsertProject(p); setBusy("qa",false); render();
  }).catch(function(e){ setBusy("qa",false); alert(e.message); render(); });
}
function stepBuilderFix(id){
  var p=getProject(id); if(!p||!p.qa) return;
  p.iteration=(p.iteration||0)+1;
  if(p.iteration>MAX_ITER){
    p.status="blocked"; p.phase="Blocked — iteration limit";
    logActivity(p,"Orchestrator","Hit iteration limit ("+MAX_ITER+"). Stopping to avoid a loop — review manually.");
    upsertProject(p); render();
    alert("Reached the iteration limit ("+MAX_ITER+"). The system stopped instead of looping. Please review the QA findings manually.");
    return;
  }
  setBusy("builder",true); render();
  runBuilderFix(p).then(function(j){
    replaceBuild(p, j, "Builder fix (iteration "+p.iteration+")");
    p.qa=null; p.phase="Fix applied — re-run QA";
    logActivity(p,"Builder","Applied fixes (iteration "+p.iteration+"). Re-run QA to verify.");
    upsertProject(p); setBusy("builder",false); state.projectTab="qa"; render();
  }).catch(function(e){ setBusy("builder",false); alert(e.message); render(); });
}
function markComplete(id){ var p=getProject(id); if(!p) return; p.status="completed"; p.phase="Completed"; logActivity(p,"You","Marked project complete."); upsertProject(p); render(); }
function rollbackBuild(id, ix){
  var p=getProject(id); if(!p||!p.buildHistory||!p.buildHistory[ix]) return;
  var snap=p.buildHistory[ix];
  /* restore the checkpoint's files AND summary as the current build */
  p.build = { files: JSON.parse(JSON.stringify(snap.files||[])), summary: (snap.summary||"") };
  /* the restored build is a different build — clear results tied to the newer one */
  invalidateBuildArtifacts(p);   /* execution results + dependency audit */
  p.qa=null; p.security=null;     /* QA + Security were about a different build */
  p.phase="Restored v"+snap.v;
  logActivity(p,"You","Restored checkpoint v"+snap.v+" (files + summary). Cleared stale exec/audit/QA/Security.");
  upsertProject(p); state.projectTab="build"; render();   /* checkpoint history is preserved */
}

/* ---------- Phase 4: Cybersecurity agent ---------- */
function callSandbox(p, commands){
  var s=getSettings();
  if(!s.sandboxUrl) return Promise.resolve({ configured:false });
  var files=(p.build&&p.build.files)||[];
  var body={ secret:s.sandboxSecret||"", commands:commands,
             files:files.map(function(f){ return { path:f.path, content:f.content }; }) };
  return fetch(s.sandboxUrl, { method:"POST", headers:{"Content-Type":"application/json"}, body:JSON.stringify(body) })
    .then(function(res){ return res.text().then(function(raw){
      if(!res.ok) throw new Error("Sandbox error ("+res.status+"): "+String(raw).slice(0,200));
      var d; try{ d=JSON.parse(raw); }catch(e){ throw new Error("Bad sandbox response."); }
      d.configured=true; return d;
    }); });
}
function hasPackageJson(p){
  var files=(p.build&&p.build.files)||[];
  for(var i=0;i<files.length;i++){ if(/package\.json$/i.test(files[i].path)) return true; }
  return false;
}
function runSecurity(p){
  var files=(p.build&&p.build.files)||[]; var filesCtx="";
  for(var k=0;k<files.length;k++){ filesCtx+="=== "+files[k].path+" ===\n"+files[k].content+"\n"; }
  var depCtx;
  if(p.depAudit&&p.depAudit.configured){
    depCtx="DEPENDENCY AUDIT OUTPUT (npm audit):\n";
    var rs=p.depAudit.results||[];
    for(var i=0;i<rs.length;i++){ depCtx+=(rs[i].stdout||"")+"\n"+(rs[i].stderr||"")+"\n"; }
    if(depCtx.length>6000) depCtx=depCtx.slice(0,6000)+"...(truncated)";
  } else {
    depCtx="No dependency audit was run (needs a configured sandbox). Do not invent CVEs; mark dependency risk as unverified.";
  }
  var sys="You are the CYBERSECURITY agent. Audit the code for real security issues only. "
    +"Do NOT fabricate findings or invent CVEs. Do NOT output any secret values you find — reference them by file and line only. "
    +"Cover: authentication/authorization, exposed secrets/credentials, input validation & injection, "
    +"access-control & tenant isolation, insecure API usage, dangerous code execution, and dependency risk. "
    +"Return ONLY valid JSON, no markdown: {\"summary\":string,\"risk_rating\":\"critical|high|medium|low|none\","
    +"\"findings\":[{\"severity\":\"critical|high|medium|low\",\"category\":string,\"location\":string,\"detail\":string,\"recommendation\":string}],"
    +"\"secrets_found\":[string],\"dependency_notes\":string}";
  var usr="APP: "+p.name+"\nREQUIREMENTS:\n"+p.description+"\n\n"+depCtx+"\n\nCODE:\n"+filesCtx;
  return callModel("sec", sys, usr).then(function(r){
    var j=extractJson(r.text); if(!j) throw new Error("Security agent returned unparseable output."); return j;
  });
}
function runSecurityFix(p){
  var f=(p.security&&p.security.findings)||[]; var fx="";
  for(var i=0;i<f.length;i++){ fx+="- ["+f[i].severity+"/"+f[i].category+"] "+f[i].location+": "+f[i].detail+" => "+f[i].recommendation+"\n"; }
  var files=(p.build&&p.build.files)||[]; var filesCtx="";
  for(var k=0;k<files.length;k++){ filesCtx+="=== "+files[k].path+" ===\n"+files[k].content+"\n"; }
  var sys="You are the BUILDER applying AUTHORIZED security fixes. Return the FULL updated file set (not a diff). "
    +"Fix only the listed security issues; preserve features and never hardcode credentials or new secrets. "
    +"Return ONLY valid JSON, no markdown: {\"summary\":string,\"files\":[{\"path\":string,\"language\":string,\"content\":string}],"
    +"\"run_commands\":[string],\"how_to_run\":string,\"not_implemented\":[string]}";
  var usr="REQUIREMENTS:\n"+p.description+"\n\nSECURITY FINDINGS TO FIX:\n"+fx+"\nCURRENT CODE:\n"+filesCtx;
  return callModel("builder", sys, usr).then(function(r){
    var j=extractJson(r.text); if(!j||!j.files) throw new Error("Security fix returned unparseable output."); return j;
  });
}
function stepDepAudit(id){
  var p=getProject(id); if(!p) return;
  setBusy("dep",true); render();
  callSandbox(p, ["npm install --package-lock-only --no-audit || true","npm audit --json || true"]).then(function(d){
    if(!d.configured){ setBusy("dep",false); alert("No sandbox configured — dependency audit needs the runner."); render(); return; }
    p.depAudit=d; logActivity(p,"Cybersecurity","Ran dependency audit (npm audit).");
    upsertProject(p); setBusy("dep",false); render();
  }).catch(function(e){ setBusy("dep",false); alert(e.message); render(); });
}
function stepSecScan(id){
  var p=getProject(id); if(!p) return;
  setBusy("sec",true); render();
  runSecurity(p).then(function(j){
    p.security=j; p.phase="Security audited";
    if(j.risk_rating==="critical"||j.risk_rating==="high"){ if(p.status!=="completed") p.status="blocked"; }
    logActivity(p,"Cybersecurity","Audit complete — risk: "+(j.risk_rating||"?")+" ("+((j.findings||[]).length)+" findings).");
    upsertProject(p); setBusy("sec",false); render();
  }).catch(function(e){ setBusy("sec",false); alert(e.message); render(); });
}
function stepSecurityFix(id){
  var p=getProject(id); if(!p||!p.security) return;
  if(!confirm("Authorize the Cybersecurity agent to modify the code to fix these findings? A checkpoint is saved first.")) return;
  p.secIteration=(p.secIteration||0)+1;
  if(p.secIteration>MAX_ITER){
    logActivity(p,"Orchestrator","Security-fix iteration limit ("+MAX_ITER+") reached — review manually.");
    upsertProject(p); render();
    alert("Reached the security-fix iteration limit ("+MAX_ITER+"). Please review manually.");
    return;
  }
  setBusy("secfix",true); render();
  runSecurityFix(p).then(function(j){
    replaceBuild(p, j, "Security fix (iteration "+p.secIteration+")");
    p.security=null; p.phase="Security fix applied — re-scan";
    logActivity(p,"Builder","Applied authorized security fixes (iteration "+p.secIteration+"). Re-scan to verify.");
    upsertProject(p); setBusy("secfix",false); render();
  }).catch(function(e){ setBusy("secfix",false); alert(e.message); render(); });
}

/* ---------- Phase 2: lightweight orchestrator ---------- */
var WF_STEPS = [ {key:"design",label:"Design"}, {key:"builder",label:"Builder"},
                 {key:"qa",label:"QA"}, {key:"security",label:"Security"} ];
function initWorkflow(p){
  p.workflow = { running:false, awaitingApproval:false, failedStep:null, error:null, errorHint:null,
                 steps: WF_STEPS.map(function(s){ return { key:s.key, label:s.label, status:"pending" }; }) };
}
function wfStepObj(p,key){ for(var i=0;i<p.workflow.steps.length;i++){ if(p.workflow.steps[i].key===key) return p.workflow.steps[i]; } return null; }
function wfLabel(w,key){ for(var i=0;i<w.steps.length;i++){ if(w.steps[i].key===key) return w.steps[i].label; } return key; }
function classifyError(err){
  var st = err && err.status; var msg = (err && err.message) || "";
  if(st===401 || /unauthorized|api key|user not found|invalid.*argument/i.test(msg)) return "Check your API key in Settings (401 / invalid key).";
  if(st===404 || /not found|no longer available/i.test(msg)) return "Check the model name / Base URL in Settings (404).";
  if(st===429) return "Rate limited (429) — it was retried; wait a moment, then Resume.";
  if(st===503 || st===500 || st===502 || /high demand|unavailable|overloaded|temporarily/i.test(msg)) return "Provider busy (5xx) — it was retried; wait and Resume, or switch model in Settings.";
  if(/load failed|failed to fetch|network|timeout/i.test(msg)) return "Network issue — check connection, then Resume.";
  return "Open the failed step's tab to inspect or re-run manually.";
}
/* Any new build makes prior runtime results obsolete — clear them so
   QA/approval never treat an older build's execution as current proof. */
function invalidateBuildArtifacts(p){ p.exec=null; p.depAudit=null; }
/* Replace the build, but first checkpoint the PREVIOUS build so it can be
   restored. Never snapshots the new build as if it were the old one. */
function replaceBuild(p, newBuild, note){
  if(p.build){ snapshotBuild(p, "Previous build (before "+(note||"replacement")+")"); }
  p.build = newBuild;
  invalidateBuildArtifacts(p);
}
/* Classify outstanding QA/Security issues for the approval gate. */
function workflowIssues(p){
  var hard=[], soft=[];
  var qv = p.qa && p.qa.verdict;
  var rr = p.security && p.security.risk_rating;
  var qOk = (qv==="pass" || qv==="changes_requested" || qv==="blocked");
  var rOk = (rr==="critical" || rr==="high" || rr==="medium" || rr==="low" || rr==="none");
  if(!qOk) hard.push("QA result missing or unrecognized");
  else if(qv==="blocked") hard.push("QA verdict is BLOCKED");
  if(!rOk) hard.push("Security result missing or unrecognized");
  else if(rr==="critical" || rr==="high") hard.push("Security risk is "+String(rr).toUpperCase());
  if(qv==="changes_requested") soft.push("QA requested changes");
  if(p.qa && p.qa.bugs && p.qa.bugs.length && qv!=="blocked") soft.push(p.qa.bugs.length+" QA bug(s) reported");
  if(rr==="medium") soft.push("Security risk is MEDIUM");
  return { hard:hard, soft:soft };
}
function runtimeLabel(p){
  return (p.exec && p.exec.configured && p.exec.success) ? "executed & passed (current build)" : "UNTESTED — static review only";
}
function wfRun(p, key){
  if(key==="design") return runDesign(p).then(function(j){ p.design=j; logActivity(p,"Design","Produced design specification (workflow)."); });
  if(key==="builder") return runBuilder(p).then(function(j){
      replaceBuild(p, j, "workflow Builder");   /* checkpoints previous build, invalidates stale exec/audit */
      logActivity(p,"Builder","Generated code (workflow). Runtime UNTESTED (no execution run)."); });
  if(key==="qa") return runQA(p).then(function(j){ p.qa=j; logActivity(p,"Supervisor/QA","Review verdict: "+(j.verdict||"?")+" (workflow)."); });
  if(key==="security") return runSecurity(p).then(function(j){ p.security=j; logActivity(p,"Cybersecurity","Audit risk: "+(j.risk_rating||"?")+" (workflow)."); });
  return Promise.reject(new Error("Unknown workflow step: "+key));
}
function startWorkflow(id){
  var p=getProject(id); if(!p) return;
  if(!p.plan){ alert("Run the Project Manager first (tab 1 · Plan)."); return; }
  if(!(p.approvals && p.approvals.plan)){ alert("Approve the plan first (tab 1 · Plan)."); return; }
  initWorkflow(p); logActivity(p,"Orchestrator","Started workflow: Design → Builder → QA → Security.");
  upsertProject(p);
  runWorkflowFrom(id, "design", false);
}
function runWorkflowFrom(id, startKey, singleStep){
  var p=getProject(id); if(!p||!p.workflow) return;
  p.workflow.running=true; p.workflow.failedStep=null; p.workflow.error=null; p.workflow.errorHint=null; p.workflow.awaitingApproval=false;
  setBusy("workflow",true);
  var order = p.workflow.steps.map(function(s){ return s.key; });
  var startIdx = order.indexOf(startKey); if(startIdx<0) startIdx=0;
  function runIdx(i){
    if(i>=order.length){
      p.workflow.running=false; p.workflow.awaitingApproval=true; setBusy("workflow",false);
      p.phase="Awaiting approval"; logActivity(p,"Orchestrator","All steps complete — awaiting your approval.");
      upsertProject(p); render(); return;
    }
    var key=order[i]; var st=wfStepObj(p,key);
    st.status="running"; p.phase="Workflow: "+st.label; upsertProject(p); render();
    wfRun(p,key).then(function(){
      st.status="done"; upsertProject(p); render();
      if(singleStep){ p.workflow.running=false; setBusy("workflow",false); upsertProject(p); render(); return; }
      runIdx(i+1);
    }).catch(function(err){
      st.status="failed"; p.workflow.running=false; p.workflow.failedStep=key;
      p.workflow.error=err.message; p.workflow.errorHint=classifyError(err);
      setBusy("workflow",false); p.phase="Workflow failed at "+st.label;
      logActivity(p,"Orchestrator","Failed at "+st.label+": "+err.message);
      upsertProject(p); render();
    });
  }
  runIdx(startIdx);
}
function retryStep(id){ var p=getProject(id); if(!p||!p.workflow||!p.workflow.failedStep) return; runWorkflowFrom(id, p.workflow.failedStep, true); }
function resumeWorkflow(id){ var p=getProject(id); if(!p||!p.workflow||!p.workflow.failedStep) return; runWorkflowFrom(id, p.workflow.failedStep, false); }
function approveWorkflow(id){
  var p=getProject(id); if(!p||!p.workflow) return;
  var w=p.workflow;
  /* fail-closed state guards — approval only at a valid gate */
  if(!w.awaitingApproval){ alert("Approval is only available at the approval gate (after all steps complete)."); return; }
  if(w.running){ alert("The workflow is still running — wait for it to finish."); return; }
  if(w.failedStep){ alert("A step failed. Resolve it with Retry or Resume before approving."); return; }
  var iss = workflowIssues(p);
  if(iss.hard.length){
    var msg = "OVERRIDE WARNING — serious issues remain:\n\n- " + iss.hard.join("\n- ")
      + (iss.soft.length ? ("\n- " + iss.soft.join("\n- ")) : "")
      + "\n\nRuntime: " + runtimeLabel(p)
      + "\n\nApproving is an explicit override and will mark the project complete anyway. Continue?";
    if(!confirm(msg)){ logActivity(p,"You","Declined override; approval cancelled (issues: "+iss.hard.join("; ")+")."); upsertProject(p); render(); return; }
    p.workflow.awaitingApproval=false; p.status="completed"; p.phase="Completed (approved with override)";
    logActivity(p,"You","APPROVED WITH OVERRIDE despite: "+iss.hard.concat(iss.soft).join("; ")+". Runtime: "+runtimeLabel(p)+".");
    upsertProject(p); render(); return;
  }
  if(iss.soft.length){
    if(!confirm("Note before completing:\n\n- "+iss.soft.join("\n- ")+"\n\nRuntime: "+runtimeLabel(p)+"\n\nApprove and mark complete anyway?")){ logActivity(p,"You","Approval cancelled."); upsertProject(p); render(); return; }
    p.workflow.awaitingApproval=false; p.status="completed"; p.phase="Completed (with noted issues)";
    logActivity(p,"You","Approved with noted issues: "+iss.soft.join("; ")+". Runtime: "+runtimeLabel(p)+".");
    upsertProject(p); render(); return;
  }
  p.workflow.awaitingApproval=false; p.status="completed"; p.phase="Workflow approved — complete";
  logActivity(p,"You","Approved clean workflow results. Runtime: "+runtimeLabel(p)+". Project complete.");
  upsertProject(p); render();
}
function rejectWorkflow(id){
  var p=getProject(id); if(!p||!p.workflow) return;
  p.workflow.awaitingApproval=false; p.phase="Workflow rejected — review & re-run";
  logActivity(p,"You","Rejected workflow results."); upsertProject(p); render();
}
function wfChip(s){
  var cls = s.status==="done"?"b-active":(s.status==="failed"?"b-blocked":(s.status==="running"?"b-phase":"b-idle"));
  var icon = s.status==="done"?"\u2713 ":(s.status==="failed"?"\u2715 ":(s.status==="running"?"\u2026 ":""));
  return '<span class="badge '+cls+'">'+icon+esc(s.label)+'</span>';
}
function workflowPanel(p){
  var w=p.workflow; var approved = p.approvals && p.approvals.plan;
  var h='<div class="card p" style="margin-bottom:14px"><div class="flex-between"><b>Workflow orchestrator</b>';
  if(!w || (!w.running && !w.awaitingApproval)){
    h+= runBtn(w?"Re-run Workflow":"Run Workflow","startWorkflow('"+p.id+"')","workflow", !approved, "red");
  }
  h+='</div>';
  if(!approved){ h+='<p class="help" style="margin-top:8px">Approve the plan (tab 1) to enable the workflow: Design &rarr; Builder &rarr; QA &rarr; Security &rarr; Approval.</p></div>'; return h; }
  if(!w){ h+='<p class="help" style="margin-top:8px">Runs Design &rarr; Builder &rarr; QA &rarr; Security in sequence (reusing the existing agents), then asks for your approval. A checkpoint is saved before any code is replaced.</p></div>'; return h; }
  h+='<div style="margin-top:12px;display:flex;flex-wrap:wrap;gap:8px">';
  for(var i=0;i<w.steps.length;i++){ h+= wfChip(w.steps[i]); }
  h+='</div>';
  if(w.running){ h+='<p class="help" style="margin-top:10px"><span class="spin" style="border-color:rgba(102,112,133,.3);border-top-color:var(--muted)"></span>Running &mdash; watch each tab update. Transient provider errors are retried automatically.</p>'; }
  if(w.failedStep){
    h+='<div class="callout warn" style="margin-top:12px"><b>Failed at '+esc(wfLabel(w,w.failedStep))+'.</b><br><span class="small">'+esc(w.error||"")+'</span>'
      +(w.errorHint?('<br><i class="small">'+esc(w.errorHint)+'</i>'):'')+'</div>';
    h+= runBtn("Retry step","retryStep('"+p.id+"')","workflow",false,"")+' '+runBtn("Resume workflow","resumeWorkflow('"+p.id+"')","workflow",false,"red");
  }
  if(w.awaitingApproval){
    var iss = workflowIssues(p);
    var qv = p.qa ? (p.qa.verdict||"?") : "?";
    var rr = p.security ? (p.security.risk_rating||"?") : "?";
    var callCls = iss.hard.length ? "warn" : (iss.soft.length ? "info" : "ok");
    h+='<div class="callout '+callCls+'" style="margin-top:12px"><b>Approval gate.</b> QA verdict: <b>'+esc(qv)+'</b> &middot; Security risk: <b>'+esc(rr)+'</b> &middot; Runtime: <b>'+esc(runtimeLabel(p))+'</b>.';
    if(iss.hard.length){ h+='<br><b>Serious issues (override required):</b> '+esc(iss.hard.join("; "))+'.'; }
    if(iss.soft.length){ h+='<br><span class="small">Noted: '+esc(iss.soft.join("; "))+'.</span>'; }
    h+=' Review the QA &amp; Security tabs before deciding.</div>';
    var approveLabel = iss.hard.length ? "Override &amp; approve" : "Approve &amp; complete";
    var approveCls = iss.hard.length ? "ghost" : "red";
    h+='<button class="btn '+approveCls+'" onclick="approveWorkflow(\''+p.id+'\')">'+approveLabel+'</button> <button class="btn ghost" onclick="rejectWorkflow(\''+p.id+'\')">Reject</button>';
  }
  h+='</div>';
  return h;
}

function stepBuilder(id){
  var p = getProject(id); if(!p) return;
  setBusy("builder",true); render();
  runBuilder(p).then(function(j){
    replaceBuild(p, j, "Builder generation"); p.phase="Code generated";
    logActivity(p,"Builder","Generated "+(j.files?j.files.length:0)+" file(s). Runtime UNTESTED (no execution run).");
    upsertProject(p); setBusy("builder",false); state.projectTab="build"; render();
  }).catch(function(e){ setBusy("builder",false); alert(e.message); render(); });

/* ---------- project CRUD ---------- */
function createProject(){
  var nm = document.getElementById("np_name").value.trim();
  var ds = document.getElementById("np_desc").value.trim();
  if(!nm || !ds){ alert("Please enter a project name and an app idea."); return; }
  var p = { id:uid(), name:nm, description:ds, status:"active", phase:"New",
            createdAt:new Date().toISOString(), plan:null, design:null, build:null,
            approvals:{}, activity:[] };
  logActivity(p,"You","Submitted app idea.");
  upsertProject(p);
  state.view="project"; state.projectId=p.id; state.projectTab="plan"; render();
}
function deleteProject(id){
  if(!confirm("Delete this project? This cannot be undone.")) return;
  var list = loadProjects().filter(function(x){ return x.id!==id; });
  saveProjects(list); state.view="projects"; state.projectId=null; render();
}
function openProject(id){ state.view="project"; state.projectId=id; state.projectTab="plan"; render(); }
function exportProjects(){
  var data = { type:"aiaf-projects", version:1, exportedAt:new Date().toISOString(), projects:loadProjects() };
  var blob = new Blob([JSON.stringify(data,null,2)], { type:"application/json" });
  var url = URL.createObjectURL(blob); var a = document.createElement("a");
  a.href=url; a.download="ai-app-factory-backup.json"; document.body.appendChild(a); a.click(); document.body.removeChild(a);
  setTimeout(function(){ URL.revokeObjectURL(url); },1500);
}
function importProjectsClick(){ var el=document.getElementById("importFile"); if(el) el.click(); }
function importProjects(ev){
  var f = ev.target.files && ev.target.files[0]; if(!f) return;
  var r = new FileReader();
  r.onload = function(){
    try{
      var d = JSON.parse(r.result);
      var incoming = Array.isArray(d) ? d : (d.projects || []);
      if(!incoming.length){ alert("This file has no projects."); return; }
      var cur = loadProjects(); var seen = {};
      for(var i=0;i<cur.length;i++){ seen[cur[i].id]=true; }
      var added = 0;
      for(var j=0;j<incoming.length;j++){
        var pj = incoming[j];
        if(pj && pj.id && !seen[pj.id]){ cur.unshift(pj); seen[pj.id]=true; added++; }
      }
      saveProjects(cur);
      alert(added+" project(s) imported. (Existing projects were kept, not overwritten.)");
      render();
    }catch(e){ alert("Invalid backup file: "+e.message); }
  };
  r.readAsText(f);
  ev.target.value="";
}

/* ---------- file helpers ---------- */
function copyFile(id, idx){
  var p = getProject(id); if(!p||!p.build) return;
  var f = p.build.files[idx]; if(!f) return;
  if(navigator.clipboard){ navigator.clipboard.writeText(f.content); }
  var btn = document.getElementById("cp_"+idx);
  if(btn){ var o=btn.innerHTML; btn.innerHTML="Copied"; setTimeout(function(){ btn.innerHTML=o; },1200); }
}
function downloadFile(id, idx){
  var p = getProject(id); if(!p||!p.build) return;
  var f = p.build.files[idx]; if(!f) return;
  var blob = new Blob([f.content], { type:"text/plain" });
  var url = URL.createObjectURL(blob);
  var a = document.createElement("a");
  a.href=url; a.download = f.path.split("/").pop() || "file.txt";
  document.body.appendChild(a); a.click(); document.body.removeChild(a);
  setTimeout(function(){ URL.revokeObjectURL(url); },1500);
}
function previewFile(id, idx){
  var p = getProject(id); if(!p||!p.build) return;
  var f = p.build.files[idx]; if(!f) return;
  var blob = new Blob([f.content], { type:"text/html" });
  var url = URL.createObjectURL(blob);
  window.open(url, "_blank");
}

  if(d.responsive_notes) h+='<p class="small"><b>Responsive notes:</b> '+esc(d.responsive_notes)+'</p>';
  h+='<div style="margin-top:12px"><button class="btn ghost sm" onclick="setTab(\'build\')">Go to Build &rarr;</button></div>';
  h+='</div>';
  return h;
}
function tabBuild(p, approved){
  var h='<div class="card p">';
  if(!approved){ h+='<div class="callout warn">Approve the plan first (tab 1).</div></div>'; return h; }
  h+='<div class="callout warn"><b>Honesty notice.</b> The Builder <b>generates code</b>. It does <b>not</b> execute, build, or test it — real execution in an isolated sandbox arrives in Phase 2. Review all code before using it.</div>';
  h+='<div class="flex-between"><b>Builder agent</b>'+runBtn(p.build?"Re-generate code":"Run Builder", "stepBuilder('"+p.id+"')","builder",false,"")+'</div>';
  if(!p.build){ h+='<p class="help" style="margin-top:8px">Generates the actual source files for your app.</p></div>'; return h; }
  var b=p.build;
  h+='<div class="divider"></div>';
  if(b.summary) h+='<p class="small"><b>Summary.</b> '+esc(b.summary)+'</p>';
  if(b.how_to_run) h+='<p class="small"><b>How to run.</b> '+esc(b.how_to_run)+'</p>';
  if(b.not_implemented && b.not_implemented.length){
    h+='<div class="callout info"><b>Not yet implemented:</b> '+esc(b.not_implemented.join("; "))+'</div>';
  }
  var htmlIdx=-1;
  for(var hi=0; hi<((b.files||[]).length); hi++){ if(/\.html?$/i.test(b.files[hi].path)){ htmlIdx=hi; break; } }
  if(htmlIdx>=0){
    var dev=state.previewDevice||"mobile";
    var w=dev==="mobile"?"375px":(dev==="tablet"?"768px":"100%");
    h+='<div class="divider"></div><div class="flex-between"><b>Responsive preview</b><span>'
      + devBtn("mobile","Mobile")+' '+devBtn("tablet","Tablet")+' '+devBtn("desktop","Desktop")+'</span></div>';
    h+='<div style="margin-top:10px;background:#eef1f6;border:1px solid var(--line);border-radius:10px;padding:12px;overflow:auto">'
      + '<iframe id="rpreview" data-idx="'+htmlIdx+'" sandbox="allow-scripts allow-forms allow-modals" style="width:'+w+';max-width:100%;height:560px;border:1px solid var(--line);border-radius:8px;background:#fff;display:block;margin:0 auto"></iframe>'
      + '</div><p class="help">Static preview of the generated HTML ('+esc(b.files[htmlIdx].path)+') at the chosen width. This renders the page; it is not a build or test.</p>';
  }
  if(b.files && b.files.length){
    for(var i=0;i<b.files.length;i++){
      var f=b.files[i];
      var isHtml = /\.html?$/i.test(f.path||"");
      h+='<div class="file"><div class="fh"><span class="fn">'+esc(f.path)+'</span><span>';
      if(isHtml){ h+='<button class="btn ghost sm" onclick="previewFile(\''+p.id+'\','+i+')">Preview</button> '; }
      h+='<button class="btn ghost sm" id="cp_'+i+'" onclick="copyFile(\''+p.id+'\','+i+')">Copy</button> ';
      h+='<button class="btn ghost sm" onclick="downloadFile(\''+p.id+'\','+i+')">Download</button></span></div>';
      h+='<pre><code>'+esc(f.content)+'</code></pre></div>';
    }
  }
  h+='</div>';
  return h;
}
function tabQA(p, approved){
  var h='<div class="card p">';
  if(!approved){ h+='<div class="callout warn">Approve the plan first (tab 1).</div></div>'; return h; }
  if(!p.build){ h+='<div class="callout warn">Generate code first (tab 3 · Build).</div></div>'; return h; }
  var s=getSettings();
  /* execution */
  h+='<b>Real execution</b>';
  if(!s.sandboxUrl){
    h+='<div class="callout info" style="margin-top:8px">Execution is <b>not configured</b>. QA can only do <b>static review</b> — it cannot verify runtime behaviour. '
     + 'To enable real build &amp; test, deploy the sandbox runner (see the runner file) and set its URL in <a href="#" onclick="go(\'settings\');return false">Settings</a>.</div>';
  } else {
    h+='<div style="margin-top:8px">'+runBtn(p.exec&&p.exec.configured?"Re-run in sandbox":"Run in sandbox","stepExec('"+p.id+"')","exec",false,"")+'</div>';
    if(p.exec&&p.exec.configured){
      var okb=p.exec.success?'<span class="badge b-active">success</span>':'<span class="badge b-blocked">failed</span>';
      h+='<div style="margin-top:10px">Result: '+okb;
      if(p.exec.previewUrl) h+=' · <a href="'+esc(p.exec.previewUrl)+'" target="_blank">Open live preview</a>';
      h+='</div>';
      var rs=p.exec.results||[];
      for(var i=0;i<rs.length;i++){
        h+='<div class="file"><div class="fh"><span class="fn">$ '+esc(rs[i].cmd)+' (exit '+esc(rs[i].exitCode)+')</span></div><pre><code>'+esc((rs[i].stdout||"")+(rs[i].stderr?("\n"+rs[i].stderr):""))+'</code></pre></div>';
      }
    }
  }
  h+='<div class="divider"></div>';
  /* QA review */
  h+='<div class="flex-between"><b>Supervisor / QA agent</b>'+runBtn(p.qa?"Re-run QA":"Run QA review","stepQA('"+p.id+"')","qa",false,"")+'</div>';
  if(p.qa){
    var v=p.qa.verdict;
    var vb=v==="pass"?'<span class="badge b-active">PASS</span>':(v==="blocked"?'<span class="badge b-blocked">BLOCKED</span>':'<span class="badge b-phase">CHANGES REQUESTED</span>');
    h+='<div style="margin-top:10px">Verdict: '+vb+' · iterations used: '+(p.iteration||0)+'/'+MAX_ITER+'</div>';
    if(p.qa.summary) h+='<p class="small"><b>Summary.</b> '+esc(p.qa.summary)+'</p>';
    if(p.qa.verified&&p.qa.verified.length) h+='<p class="small"><b>Verified:</b> '+esc(p.qa.verified.join("; "))+'</p>';
    if(p.qa.untested&&p.qa.untested.length) h+='<p class="small"><b>Untested (needs execution):</b> '+esc(p.qa.untested.join("; "))+'</p>';
    if(p.qa.failed&&p.qa.failed.length) h+='<p class="small"><b>Failed:</b> '+esc(p.qa.failed.join("; "))+'</p>';
    if(p.qa.bugs&&p.qa.bugs.length){
      h+='<p class="small" style="margin:10px 0 6px"><b>Bugs</b></p>';
      for(var b=0;b<p.qa.bugs.length;b++){
        var bg=p.qa.bugs[b];
        h+='<div class="callout warn" style="margin-bottom:8px"><b>['+esc(bg.severity)+'] '+esc(bg.title)+'</b><br><span class="small">'+esc(bg.detail)+'<br><i>Fix: '+esc(bg.fix)+'</i></span></div>';
      }
      h+=runBtn("Send bugs to Builder & retest","stepBuilderFix('"+p.id+"')","builder",false,"red");
    } else if(v==="pass"){
      h+='<div class="callout ok">QA passed with no bugs. You can mark this project complete.</div><button class="btn" onclick="markComplete(\''+p.id+'\')">Mark complete</button>';
    }
  } else {
    h+='<p class="help" style="margin-top:8px">Independently reviews the code against requirements and files actionable bug reports for the Builder.</p>';
  }
  /* checkpoints */
  if(p.buildHistory&&p.buildHistory.length>1){
    h+='<div class="divider"></div><b>Version checkpoints</b> <span class="help">(snapshots of generated code — restore any version)</span>';
    for(var c=0;c<p.buildHistory.length;c++){
      var sn=p.buildHistory[c];
      h+='<div class="flex-between" style="padding:7px 0;border-bottom:1px solid var(--line)"><span class="small">v'+esc(sn.v)+' · '+esc(sn.ts)+' · '+esc(sn.note)+'</span><button class="btn ghost sm" onclick="rollbackBuild(\''+p.id+'\','+c+')">Restore</button></div>';
    }
  }
  h+='</div>';
  return h;
}
function tabSecurity(p, approved){
  var h='<div class="card p">';
  if(!approved){ h+='<div class="callout warn">Approve the plan first (tab 1).</div></div>'; return h; }
  if(!p.build){ h+='<div class="callout warn">Generate code first (tab 3 · Build).</div></div>'; return h; }
  var s=getSettings();
  h+='<div class="callout info">Static security review. Dependency scanning (npm audit) needs a configured sandbox. The agent never changes code without your authorization.</div>';
  /* dependency audit */
  if(hasPackageJson(p)){
    h+='<div class="flex-between"><b>Dependency audit</b>';
    if(s.sandboxUrl){ h+=runBtn(p.depAudit?"Re-run npm audit":"Run npm audit","stepDepAudit('"+p.id+"')","dep",false,""); }
    else { h+='<span class="badge b-idle">sandbox required</span>'; }
    h+='</div>';
    if(p.depAudit&&p.depAudit.results){
      var rs=p.depAudit.results;
      for(var i=0;i<rs.length;i++){ h+='<div class="file"><div class="fh"><span class="fn">$ '+esc(rs[i].cmd)+'</span></div><pre><code>'+esc(((rs[i].stdout||"")+(rs[i].stderr||"")).slice(0,4000))+'</code></pre></div>'; }
    }
    h+='<div class="divider"></div>';
  }
  /* audit */
  h+='<div class="flex-between"><b>Security audit</b>'+runBtn(p.security?"Re-run scan":"Run security scan","stepSecScan('"+p.id+"')","sec",false,"")+'</div>';
  if(p.security){
    var sec=p.security; var rr=sec.risk_rating||"none";
    var rb=(rr==="critical"||rr==="high")?'<span class="badge b-blocked">'+esc(rr.toUpperCase())+'</span>':(rr==="medium"?'<span class="badge b-phase">MEDIUM</span>':'<span class="badge b-active">'+esc(rr.toUpperCase())+'</span>');
    h+='<div style="margin-top:10px">Risk: '+rb+' · findings: '+((sec.findings||[]).length)+'</div>';
    if(sec.summary) h+='<p class="small"><b>Summary.</b> '+esc(sec.summary)+'</p>';
    if(sec.secrets_found&&sec.secrets_found.length){ h+='<div class="callout warn"><b>Possible exposed secrets:</b> '+esc(sec.secrets_found.join("; "))+'</div>'; }
    if(sec.findings&&sec.findings.length){
      h+='<p class="small" style="margin:10px 0 6px"><b>Findings</b></p>';
      for(var f=0;f<sec.findings.length;f++){
        var fd=sec.findings[f]; var sv=fd.severity||"low";
        var sb=(sv==="critical"||sv==="high")?"b-blocked":(sv==="medium"?"b-phase":"b-idle");
        h+='<div class="callout warn" style="margin-bottom:8px"><span class="badge '+sb+'">'+esc(sv)+'</span> <b>'+esc(fd.category||"")+'</b> <span class="help">'+esc(fd.location||"")+'</span><br><span class="small">'+esc(fd.detail||"")+'<br><i>Fix: '+esc(fd.recommendation||"")+'</i></span></div>';
      }
      h+=runBtn("Authorize & send fixes to Builder","stepSecurityFix('"+p.id+"')","secfix",false,"red");
      h+=' <span class="help">iterations: '+((p.secIteration||0))+'/'+MAX_ITER+'</span>';
    } else {
      h+='<div class="callout ok">No security findings reported. (Static review — verify critical apps independently.)</div>';
    }
    if(sec.dependency_notes) h+='<p class="small"><b>Dependency notes:</b> '+esc(sec.dependency_notes)+'</p>';
  } else {
    h+='<p class="help" style="margin-top:8px">Audits auth, secrets, injection, access control, dangerous execution and dependency risk; proposes fixes you can authorize.</p>';
  }
  h+='</div>';
  return h;
}
function tabPhase(title, body){
  return '<div class="card p"><div class="flex-between"><b>'+esc(title)+'</b><span class="badge b-phase">Not yet active</span></div>'
       + '<p class="small" style="margin-top:10px">'+body+'</p></div>';
}

    { ic:"🗂️", nm:"Project Manager", rl:"Turns ideas into structured plans, tasks & dependencies.", key:"pm", active:true },

function devBtn(dev,label){
  var a=(state.previewDevice||"mobile")===dev?"red":"ghost";

}
function setDevice(d){ state.previewDevice=d; render(); }
function afterRender(){
  var ifr=document.getElementById("rpreview");
  if(ifr){
    var p=getProject(state.projectId);
    var idx=parseInt(ifr.getAttribute("data-idx"),10);
    if(p&&p.build&&p.build.files&&p.build.files[idx]){ try{ ifr.srcdoc=p.build.files[idx].content; }catch(e){} }
  }
}

/* ---------- router ---------- */
function render(){
  var body="";
  if(state.view==="dashboard") body=renderDashboard();
  else if(state.view==="projects") body=renderProjects();
  else if(state.view==="project") body=renderProject();
  else if(state.view==="agents") body=renderAgents();
  else if(state.view==="settings") body=renderSettings();
  else body=renderDashboard();

  afterRender();
}
