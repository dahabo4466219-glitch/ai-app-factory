<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<meta name="theme-color" content="#0f2a4a">
<title>AI App Factory</title>
<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
<style>
:root{
  --navy:#0f2a4a; --navy-2:#16406e; --navy-3:#1f4f85;
  --red:#d92d20; --red-dark:#b42318;
  --bg:#f4f6fa; --card:#ffffff; --line:#e2e8f0;
  --ink:#101828; --muted:#667085; --ok:#12805c; --warn:#b54708; --blocked:#b42318;
  --shadow:0 1px 2px rgba(16,24,40,.06),0 1px 3px rgba(16,24,40,.10);
}
*{box-sizing:border-box}
html,body{margin:0;padding:0;max-width:100%;overflow-x:hidden}
@supports (overflow:clip){html,body{overflow-x:clip}}
body{font-family:-apple-system,BlinkMacSystemFont,"Segoe UI",Roboto,Helvetica,Arial,sans-serif;background:var(--bg);color:var(--ink);line-height:1.5;-webkit-font-smoothing:antialiased}
a{color:var(--navy-3);text-decoration:none}
button{font-family:inherit;cursor:pointer}
input,textarea,select{font-family:inherit;font-size:15px}
.wrap{max-width:1080px;margin:0 auto;padding:0 16px}

/* Top bar */
.topbar{background:var(--navy);color:#fff}
.topbar .wrap{display:flex;align-items:center;justify-content:space-between;height:56px}
.brand{display:flex;align-items:center;gap:10px;font-weight:700;font-size:17px;color:#fff}
.brand .dot{width:10px;height:10px;border-radius:50%;background:var(--red)}
.brand small{font-weight:500;opacity:.7;font-size:12px}
.navbtn{background:transparent;border:0;color:#cdd7e6;padding:8px 12px;border-radius:8px;font-size:14px}
.navbtn:hover{background:rgba(255,255,255,.08);color:#fff}
.navbtn.active{background:var(--navy-2);color:#fff}
.nav-desktop{display:flex;gap:4px}
.menu-toggle{display:none;background:transparent;border:0;color:#fff;font-size:22px;padding:4px 8px}
.nav-mobile{display:none;flex-direction:column;background:var(--navy-2);padding:6px 0}
.nav-mobile .navbtn{border-radius:0;text-align:left;padding:12px 20px}

/* Layout */
.page{padding:22px 0 60px}
.h1{font-size:22px;font-weight:700;margin:0 0 2px}
.sub{color:var(--muted);font-size:14px;margin:0 0 18px}
.row{display:flex;gap:14px;flex-wrap:wrap}
.grid{display:grid;gap:14px}
.grid-4{grid-template-columns:repeat(4,1fr)}
.grid-2{grid-template-columns:repeat(2,1fr)}
.card{background:var(--card);border:1px solid var(--line);border-radius:12px;box-shadow:var(--shadow)}
.card.p{padding:16px}
.stat{padding:16px}
.stat .k{font-size:12px;color:var(--muted);text-transform:uppercase;letter-spacing:.4px}
.stat .v{font-size:28px;font-weight:700;margin-top:6px}
.stat .v.red{color:var(--red)}
.stat .v.navy{color:var(--navy)}

/* Buttons */
.btn{background:var(--navy);color:#fff;border:0;padding:10px 16px;border-radius:9px;font-size:14px;font-weight:600}
.btn:hover{background:var(--navy-2)}
.btn.red{background:var(--red)} .btn.red:hover{background:var(--red-dark)}
.btn.ghost{background:#fff;color:var(--navy);border:1px solid var(--line)}
.btn.ghost:hover{background:#f2f5fa}
.btn.sm{padding:6px 11px;font-size:13px}
.btn:disabled{opacity:.5;cursor:not-allowed}

/* Forms */
label{display:block;font-size:13px;font-weight:600;margin:0 0 5px;color:#344054}
.field{margin-bottom:14px}
input[type=text],input[type=password],textarea,select{width:100%;padding:10px 12px;border:1px solid var(--line);border-radius:9px;background:#fff;color:var(--ink)}
input:focus,textarea:focus,select:focus{outline:2px solid rgba(31,79,133,.25);border-color:var(--navy-3)}
textarea{min-height:110px;resize:vertical}
.help{font-size:12px;color:var(--muted);margin-top:5px}

/* Badges */
.badge{display:inline-block;font-size:12px;font-weight:600;padding:3px 9px;border-radius:20px;border:1px solid transparent}
.b-active{background:#e7f4ee;color:var(--ok);border-color:#bfe3d2}
.b-idle{background:#eef1f6;color:var(--muted);border-color:var(--line)}
.b-done{background:#e8effb;color:var(--navy-2);border-color:#c7d9f4}
.b-blocked{background:#fdeceb;color:var(--blocked);border-color:#f6c9c6}
.b-phase{background:#fff4e8;color:var(--warn);border-color:#fbdcb8}

/* Lists */
.plist .item{display:flex;justify-content:space-between;align-items:center;padding:14px 16px;border-bottom:1px solid var(--line)}
.plist .item:last-child{border-bottom:0}
.plist .item:hover{background:#fafbfe}
.plist .nm{font-weight:600}
.plist .ds{color:var(--muted);font-size:13px;margin-top:2px;max-width:640px;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.muted{color:var(--muted)}
.small{font-size:13px}

/* Tabs */
.tabs{display:flex;gap:4px;border-bottom:1px solid var(--line);margin:6px 0 16px;flex-wrap:wrap}
.tab{background:transparent;border:0;padding:10px 14px;font-size:14px;font-weight:600;color:var(--muted);border-bottom:2px solid transparent}
.tab.active{color:var(--navy);border-bottom-color:var(--red)}

/* Agent cards */
.agent{padding:16px;display:flex;gap:14px;align-items:flex-start}
.agent .ic{font-size:26px;width:44px;height:44px;display:flex;align-items:center;justify-content:center;background:#eef2f8;border-radius:10px;flex-shrink:0}
.agent .nm{font-weight:700}
.agent .rl{font-size:13px;color:var(--muted);margin-top:3px}

/* Callouts */
.callout{border-radius:10px;padding:12px 14px;font-size:13.5px;margin:0 0 14px;border:1px solid}
.callout.warn{background:#fff8ef;border-color:#fbdcb8;color:#7a4a12}
.callout.info{background:#eef4fd;border-color:#c7d9f4;color:#1c3d63}
.callout.ok{background:#eefaf4;border-color:#bfe3d2;color:#0d5f45}

/* Code */
.file{border:1px solid var(--line);border-radius:10px;margin-bottom:12px;overflow:hidden}
.file .fh{display:flex;justify-content:space-between;align-items:center;background:#f7f9fc;padding:9px 12px;border-bottom:1px solid var(--line)}
.file .fh .fn{font-family:ui-monospace,Menlo,Consolas,monospace;font-size:13px;font-weight:600}
.file pre{margin:0;padding:12px;overflow:auto;max-height:340px;background:#0f2a4a;color:#e6edf6}
.file pre code{font-family:ui-monospace,Menlo,Consolas,monospace;font-size:12.5px;white-space:pre}

.activity{max-height:280px;overflow:auto}
.activity .a{display:flex;gap:10px;padding:8px 0;border-bottom:1px solid var(--line);font-size:13px}
.activity .a:last-child{border-bottom:0}
.activity .at{color:var(--muted);white-space:nowrap;font-variant-numeric:tabular-nums}
.spin{display:inline-block;width:14px;height:14px;border:2px solid rgba(255,255,255,.4);border-top-color:#fff;border-radius:50%;animation:sp .7s linear infinite;vertical-align:-2px;margin-right:6px}
.btn.ghost .spin{border:2px solid rgba(15,42,74,.3);border-top-color:var(--navy)}
@keyframes sp{to{transform:rotate(360deg)}}
.divider{height:1px;background:var(--line);margin:18px 0}
.kv{display:grid;grid-template-columns:150px 1fr;gap:6px 12px;font-size:14px}
.kv .kk{color:var(--muted)}
.right{text-align:right}
.flex-between{display:flex;justify-content:space-between;align-items:center;gap:12px;flex-wrap:wrap}

@media(max-width:820px){
  .grid-4{grid-template-columns:repeat(2,1fr)}
  .grid-2{grid-template-columns:1fr}
  .nav-desktop{display:none}
  .menu-toggle{display:block}
  .kv{grid-template-columns:1fr}
}
</style>
</head>
<body>
<div id="app"></div>
<script>
"use strict";

/* ============================================================
   AI App Factory — Beta (agents, auto-fix loop, cloud sync)
   Active agents: Project Manager, Design, Builder, Supervisor/QA, Cybersecurity.
   Real execution: via an external sandbox runner (E2B) the user deploys;
   until its URL is set, QA/Security do static review only (never fake results).
   Persistence: localStorage (swap to Supabase for production).
   Architecture: single-file HTML PWA. Persistence: localStorage
   (swap to Supabase for production). API calls go direct from the
   browser — for a multi-user product put a Cloudflare Worker /
   Supabase Edge Function proxy in front and point Base URL at it.
   ============================================================ */

var LS_PROJECTS = "aiaf_projects_v1";
var LS_SETTINGS = "aiaf_settings_v1";

var state = { view: "dashboard", projectId: null, projectTab: "plan", menu: false, busy: {}, previewDevice: "mobile" };
var MAX_ITER = 3;

/* ---------- storage ---------- */
function loadProjects(){
  try{ var r = localStorage.getItem(LS_PROJECTS); return r ? JSON.parse(r) : []; }
  catch(e){ return []; }
}
var _saveWarnAt=0;
function saveProjects(list){
  try{ localStorage.setItem(LS_PROJECTS, JSON.stringify(list)); return true; }
  catch(e){
    /* Storage full: keep only the 3 newest checkpoints per project, retry once. */
    var trimmed=false;
    for(var i=0;i<list.length;i++){
      var hist=list[i] && list[i].buildHistory;
      if(hist && hist.length>3){ hist.length=3; trimmed=true; }
    }
    if(trimmed){
      try{
        localStorage.setItem(LS_PROJECTS, JSON.stringify(list));
        alert("Storage was full, so older code checkpoints were trimmed (3 newest kept per project). Your change was saved.");
        return true;
      }catch(e2){}
    }
    var now=Date.now();
    if(now-_saveWarnAt>10000){
      _saveWarnAt=now;
      alert("Storage is full — your last change was NOT saved. Export a backup (Projects > Export projects), then delete old projects.");
    }
    return false;
  }
}
function getSettings(){
  var def = { provider:"openai_compatible", baseUrl:"", apiKey:"", defaultModel:"",
              agentModels:{ pm:"", design:"", builder:"", qa:"", sec:"" }, pricePerMillion:0, totalTokens:0,
              sandboxUrl:"", sandboxSecret:"", stackMode:"single" };
  try{
    var r = localStorage.getItem(LS_SETTINGS);
    if(!r) return def;
    var s = JSON.parse(r);
    if(!s.agentModels) s.agentModels = { pm:"", design:"", builder:"", qa:"", sec:"" };
    if(s.agentModels.qa===undefined) s.agentModels.qa="";
    if(s.agentModels.sec===undefined) s.agentModels.sec="";
    if(s.sandboxUrl===undefined) s.sandboxUrl="";
    if(s.sandboxSecret===undefined) s.sandboxSecret="";
    if(s.stackMode===undefined) s.stackMode="single";
    return s;
  }catch(e){ return def; }
}
function saveSettings(s){
  try{ localStorage.setItem(LS_SETTINGS, JSON.stringify(s)); }catch(e){}
}
function getProject(id){
  var list = loadProjects();
  for(var i=0;i<list.length;i++){ if(list[i].id===id) return list[i]; }
  return null;
}
function upsertProject(p){
  p.updatedAt = new Date().toISOString();
  cloudMarkDirty(p.id, p);
  var list = loadProjects(); var found=false;
  for(var i=0;i<list.length;i++){ if(list[i].id===p.id){ list[i]=p; found=true; break; } }
  if(!found) list.unshift(p);
  saveProjects(list);
}

/* ---------- utils ---------- */
function uid(){ return "p"+Date.now().toString(36)+Math.floor(Math.random()*1000).toString(36); }
function nowStr(){
  var d=new Date();
  function z(n){ return (n<10?"0":"")+n; }
  return z(d.getHours())+":"+z(d.getMinutes());
}
function esc(s){
  s = (s===undefined||s===null) ? "" : String(s);
  return s.replace(/&/g,"&amp;").replace(/</g,"&lt;").replace(/>/g,"&gt;")
          .replace(/"/g,"&quot;").replace(/'/g,"&#39;");
}
function safeColor(hex){
  hex = (hex===undefined||hex===null) ? "" : String(hex).trim();
  if(/^#?[0-9a-fA-F]{3}$|^#?[0-9a-fA-F]{6}$|^#?[0-9a-fA-F]{8}$/.test(hex)){ return hex.charAt(0)==="#"?hex:("#"+hex); }
  return "#888888";
}
function designSummary(p){
  if(!p.design) return "";
  var d=p.design, out="DESIGN SPEC (implement this exactly):\n";
  var dt=d.design_tokens||d.design_system;
  if(dt){
    if(dt.colors){ var cols=[]; for(var i=0;i<dt.colors.length;i++){ var c=dt.colors[i];
        cols.push(typeof c==="string"?c:((c.name||"")+" "+(c.hex||"")+(c.role?(" ("+c.role+")"):""))); }
      out+="Colors: "+cols.join(", ")+"\n"; }
    if(dt.typography){ out+="Typography: "+(typeof dt.typography==="string"?dt.typography:JSON.stringify(dt.typography))+"\n"; }
    if(dt.spacing){ out+="Spacing: "+(Array.isArray(dt.spacing)?dt.spacing.join(", "):dt.spacing)+"\n"; }
    if(dt.radius){ out+="Radius: "+dt.radius+"\n"; }
  }
  if(d.components&&d.components.length){ var cn=[]; for(var k=0;k<d.components.length;k++){ var cc=d.components[k];
      cn.push(typeof cc==="string"?cc:((cc.name||"")+(cc.spec?(": "+cc.spec):""))); } out+="Components: "+cn.join("; ")+"\n"; }
  if(d.responsive_notes) out+="Responsive: "+d.responsive_notes+"\n";
  return out;
}
function logActivity(p, agent, msg){
  if(!p.activity) p.activity=[];
  p.activity.unshift({ t:nowStr(), agent:agent, msg:msg });
  if(p.activity.length>60) p.activity.length=60;
}
function extractJson(text){
  if(!text) return null;
  var t = String(text).trim();
  var fence = String.fromCharCode(96,96,96);
  t = t.replace(new RegExp("^"+fence+"(?:json)?","i"),"").replace(new RegExp(fence+"$"),"").trim();
  var a = t.indexOf("{"); var b = t.lastIndexOf("}");
  var a2 = t.indexOf("["); var b2 = t.lastIndexOf("]");
  var cand = null;
  if(a!==-1 && b!==-1){ cand = t.substring(a,b+1); }
  if(a2!==-1 && b2!==-1 && (a===-1 || a2<a)){ cand = t.substring(a2,b2+1); }
  if(!cand) cand = t;
  try{ return JSON.parse(cand); }catch(e){ return null; }
}

/* ---------- model layer ---------- */
function modelFor(agentKey){
  var s = getSettings();
  var m = s.agentModels && s.agentModels[agentKey];
  return (m && m.length) ? m : s.defaultModel;
}
function addTokens(n){
  var s = getSettings(); s.totalTokens = (s.totalTokens||0) + (n||0); saveSettings(s);
}
function isTransient(status){
  return status===429 || status===500 || status===502 || status===503 || status===408 || status===0;
}
/* ---------- Patch 4: single-file default + 429 auto-wait ---------- */
var HTML_CHECK_PREFIX = "node -e \"const fs=require('fs'),vm=require('vm');const list=process.argv.slice(1);let n=0;for(const f of list){const h=fs.readFileSync(f,'utf8');const re=/<script([^>]*)>([\\s\\S]*?)<\\/script>/gi;let m;while((m=re.exec(h))){const a=m[1];if(/\\bsrc\\s*=/i.test(a))continue;const t=(a.match(/type\\s*=\\s*['\\x22]?([^'\\x22\\s>]+)/i)||[])[1];if(t&&!/javascript|ecmascript/i.test(t))continue;if(/^\\s*import\\s/m.test(m[2]))continue;new vm.Script(m[2],{filename:f});n++;}}console.log('OK: '+n+' inline script block(s) parsed without syntax errors in '+list.length+' HTML file(s)');\"";
function htmlCheckCommand(files){
  var list=[];
  for(var i=0;i<files.length;i++){
    var pth=String(files[i].path||"");
    if(/\.html?$/i.test(pth) && /^[A-Za-z0-9_.\/-]+$/.test(pth) && pth.indexOf("..")===-1) list.push("'"+pth+"'");
  }
  return list.length ? (HTML_CHECK_PREFIX+" "+list.join(" ")) : "";
}
function stackRule(){
  if(getSettings().stackMode==="auto") return "";
  return " ARCHITECTURE RULE (mandatory unless the requirements explicitly name a different stack or framework): "
    +"deliver ONE self-contained index.html with inline <style> and inline vanilla JavaScript; "
    +"no frameworks, no TypeScript, no build step, no package.json, no npm; avoid external CDNs unless truly essential; "
    +"it must work when the file is opened directly in a mobile browser.";
}
/* Seconds-to-wait hint from a 429 body, e.g. "try again in 7.6s" / "1m2.5s" / "450ms". */
function parseRetryMs(res, raw){
  var ms=0;
  try{ var ra=res && res.headers ? res.headers.get("retry-after") : null; if(ra && !isNaN(parseFloat(ra))) ms=parseFloat(ra)*1000; }catch(e){}
  var t=String(raw||"").match(/try again in ([0-9hms.]+)/i);
  if(t){
    var total=0, mm, re=/([0-9.]+)(ms|h|m|s)/g;
    while((mm=re.exec(t[1]))){
      var v=parseFloat(mm[1]);
      total += mm[2]==="ms" ? v : (mm[2]==="s" ? v*1000 : (mm[2]==="m" ? v*60000 : v*3600000));
    }
    if(total>ms) ms=total;
  }
  return Math.ceil(ms);
}
/* A single request bigger than the per-minute limit can never succeed by waiting. */
function isTooLarge(status, raw){
  if(status===413) return true;
  var m=String(raw||"").match(/Limit\s+(\d+)[^0-9]+Used\s+(\d+)[^0-9]+Requested\s+(\d+)/i);
  return !!(m && parseInt(m[3],10) > parseInt(m[1],10));
}
var RL_MAX_WAIT_MS = 120000, RL_MAX_WAITS = 6;
function rlBanner(msg){
  try{
    var el=document.getElementById("rl_banner");
    if(!msg){ if(el && el.parentNode) el.parentNode.removeChild(el); return; }
    if(!el){
      el=document.createElement("div"); el.id="rl_banner";
      el.setAttribute("style","position:fixed;left:12px;right:12px;bottom:calc(12px + env(safe-area-inset-bottom, 0px));z-index:9999;"
        +"background:#0f2a4a;color:#fff;padding:12px 14px;border-radius:10px;font-size:14px;line-height:1.4;box-shadow:0 6px 20px rgba(0,0,0,.25)");
      document.body.appendChild(el);
    }
    el.textContent=msg;
  }catch(e){}
}
function rlCountdown(ms, label){
  return new Promise(function(resolve){
    var end=Date.now()+ms;
    function tick(){
      var left=Math.max(0, Math.ceil((end-Date.now())/1000));
      if(left<=0){ rlBanner(""); resolve(); return; }
      rlBanner("Rate limit"+(label?(" ("+label+")"):"")+" \u2014 waiting "+left+"s, then continuing automatically\u2026");
      setTimeout(tick, 1000);
    }
    tick();
  });
}
function withRetry(makeCall, tries, label){
  tries = tries || 3;
  var rlWaits = 0;
  function attempt(n){
    return makeCall().catch(function(err){
      var st = err && err.status;
      if(st===429 && !err.tooLarge){
        var w = err.retryAfterMs || Math.min(60000, 5000*Math.pow(2, rlWaits));
        if(w <= RL_MAX_WAIT_MS && rlWaits < RL_MAX_WAITS){
          rlWaits++;
          return rlCountdown(w + 1000, label).then(function(){ return attempt(n); });
        }
        throw err;
      }
      if(err && err.tooLarge) throw err;
      var netErr = err && err.message && /load failed|failed to fetch|network|timeout/i.test(err.message);
      if((isTransient(st) || netErr) && n < tries){
        var wait = 900 * Math.pow(2, n-1);
        return new Promise(function(r){ setTimeout(r, wait); }).then(function(){ return attempt(n+1); });
      }
      throw err;
    });
  }
  return attempt(1);
}
function callModel(agentKey, system, user){
  var s = getSettings();
  var model = modelFor(agentKey);
  if(!s.apiKey || !model){
    return Promise.reject(new Error("No model configured. Open Settings and add an API key + model name."));
  }
  var makeCall;
  if(s.provider==="anthropic"){
    var abase = s.baseUrl && s.baseUrl.length ? s.baseUrl : "https://api.anthropic.com";
    makeCall = function(){ return fetch(abase + "/v1/messages", {
      method:"POST",
      headers:{ "Content-Type":"application/json", "x-api-key":s.apiKey,
                "anthropic-version":"2023-06-01",
                "anthropic-dangerous-direct-browser-access":"true" },
      body: JSON.stringify({ model:model, max_tokens:(agentKey==="builder"?16000:4000), system:system,
                             messages:[{ role:"user", content:user }] })
    }).then(handleAnthropic); };
  } else {
    var b = s.baseUrl && s.baseUrl.length ? s.baseUrl : "https://api.openai.com/v1";
    var oaBody = { model:model,
        messages:[{ role:"system", content:system },{ role:"user", content:user }],
        temperature:0.4 };
    /* Reasoning models (gpt-oss) spend output tokens on hidden reasoning first.
       The Builder writes whole files, so keep its reasoning short to leave room for code. */
    if(/gpt-oss/i.test(model)) oaBody.reasoning_effort = (agentKey==="builder") ? "low" : "medium";
    makeCall = function(){ return fetch(b + "/chat/completions", {
      method:"POST",
      headers:{ "Content-Type":"application/json", "Authorization":"Bearer "+s.apiKey },
      body: JSON.stringify(oaBody)
    }).then(handleOpenAI); };
  }
  return withRetry(makeCall, 3, agentKey).catch(function(err){
    if(agentKey==="builder" && err && err.message===TRUNC_MSG){
      rlBanner("Builder output was cut off \u2014 retrying once\u2026");
      return withRetry(makeCall, 2, agentKey).then(function(r){ rlBanner(""); return r; },
                                                   function(e2){ rlBanner(""); throw e2; });
    }
    throw err;
  });
}
var TRUNC_MSG = "Output truncated — the model ran out of output room (max_tokens). Use a model with larger output for the Builder, or ask for fewer/smaller files.";
function handleOpenAI(res){
  return res.text().then(function(raw){
    if(!res.ok){ var e=new Error(shortErr(res.status, raw)); e.status=res.status; e.retryAfterMs=parseRetryMs(res, raw); e.tooLarge=isTooLarge(res.status, raw); throw e; }
    var d; try{ d=JSON.parse(raw); }catch(e){ throw new Error("Bad response from provider."); }
    var ch = d && d.choices && d.choices[0];
    var txt = ch && ch.message ? ch.message.content : "";
    var tok = d && d.usage ? (d.usage.total_tokens||0) : 0;
    addTokens(tok);
    if(ch && ch.finish_reason==="length") throw new Error(TRUNC_MSG);
    return { text:txt||"", tokens:tok };
  });
}
function handleAnthropic(res){
  return res.text().then(function(raw){
    if(!res.ok){ var e=new Error(shortErr(res.status, raw)); e.status=res.status; e.retryAfterMs=parseRetryMs(res, raw); e.tooLarge=isTooLarge(res.status, raw); throw e; }

/* ---------- Phase 2: QA, execution, fix-loop, checkpoints ---------- */
function snapshotBuild(p, note){
  if(!p.build) return;
  if(!p.buildHistory) p.buildHistory=[];
  var maxV=0;
  for(var i=0;i<p.buildHistory.length;i++){ var hv=Number(p.buildHistory[i].v)||0; if(hv>maxV) maxV=hv; }
  p.buildSeq=Math.max(Number(p.buildSeq)||0, maxV)+1;
  p.buildHistory.unshift({ v:p.buildSeq, ts:nowStr(), note:note,
    summary:(p.build.summary||""),
    files:JSON.parse(JSON.stringify(p.build.files||[])),
    run_commands:(p.build.run_commands||[]).slice(),
    how_to_run:(p.build.how_to_run||""),
    not_implemented:(p.build.not_implemented||[]).slice() });
  if(p.buildHistory.length>10) p.buildHistory.length=10;
}
function defaultCommands(files){
  var hasPkg=false;
  for(var i=0;i<files.length;i++){ if(/package\.json$/i.test(files[i].path)) hasPkg=true; }
  if(hasPkg) return ["npm install","npm test --if-present","npm run build --if-present"];
  var chk = htmlCheckCommand(files);
  return chk ? [chk] : ["echo static project - nothing to build or test"];
}
/* Normalise the configured runner URL: must be absolute http(s); a bare
   host (no path) gets the runner's "/run" endpoint appended. Returns
   { url } or { error }. */
function runnerUrl(raw){
  var u=String(raw||"").trim();
  if(!/^https?:\/\//i.test(u)) return { error:"Sandbox runner URL must start with https:// (current value is not an absolute URL)." };
  var m=u.match(/^(https?:\/\/[^\/?#]+)(\/[^?#]*)?(.*)$/i);
  if(!m) return { error:"Sandbox runner URL is not valid." };
  var path=(m[2]||"").replace(/\/+$/,"");
  if(path==="") path="/run";
  return { url: m[1]+path+m[3] };
}
/* POST to the runner. A fetch rejection means the browser got no readable
   response (CORS block, unreachable host, or a platform error without CORS
   headers); replace the browser's opaque "Load failed" with what to check. */
function runnerFetch(rawUrl, body){
  var r=runnerUrl(rawUrl);
  if(r.error) return Promise.reject(new Error(r.error));
  var origin=""; try{ origin=window.location.origin||""; }catch(e){}
  return fetch(r.url, { method:"POST", headers:{"Content-Type":"application/json"}, body:JSON.stringify(body) })
    .catch(function(err){
      throw new Error("Sandbox runner unreachable from the browser (no readable response from "+r.url+"). "
        +"Most likely CORS: on Render set ALLOWED_ORIGIN to exactly "+(origin||"this app's origin")
        +" (no trailing slash), then redeploy. Also confirm the Render service is Live. "
        +"[browser error: "+((err&&err.message)||"network error")+"]");
    });
}
function runExecution(p){
  var s=getSettings();
  if(!s.sandboxUrl){ return Promise.resolve({ configured:false }); }
  var files=(p.build&&p.build.files)||[];
  var cmds=(p.build&&p.build.run_commands&&p.build.run_commands.length)?p.build.run_commands:defaultCommands(files);
  var body={ secret:s.sandboxSecret||"", commands:cmds,
             files:files.map(function(f){ return { path:f.path, content:f.content }; }) };
  return runnerFetch(s.sandboxUrl, body)
    .then(function(res){ return res.text().then(function(raw){
      if(!res.ok) throw new Error("Sandbox error ("+res.status+"): "+String(raw).slice(0,200));
      var d; try{ d=JSON.parse(raw); }catch(e){ throw new Error("Bad sandbox response."); }
      d.configured=true; return d;
    }); });
}
/* ---------- Patch 7: honest QA ----------
   What the sandbox really proved: "tests" (real commands ran & passed),
   "syntax" (only the inline-JS syntax check ran), "failed", or "none". */
function execEvidence(p){
  if(!p.exec || !p.exec.configured) return "none";
  if(p.exec.success===false) return "failed";
  var rs=p.exec.results||[], real=false;
  for(var i=0;i<rs.length;i++){
    var c=String(rs[i].cmd||"");
    if(c.indexOf(HTML_CHECK_PREFIX)===0 || /^echo\s/.test(c)) continue;
    real=true;
  }
  if(real) return "tests";
  for(var k=0;k<rs.length;k++){ if(String(rs[k].cmd||"").indexOf(HTML_CHECK_PREFIX)===0) return "syntax"; }
  return "none";
}
/* The model may still write "verified" for things nothing actually ran.
   Unless real tests ran, move those claims to "untested" (code, not prompt, decides). */
function enforceHonestQA(p, q){
  var ev=execEvidence(p);
  q.evidence=ev;
  if(ev==="tests") return q;
  var claimed=(q.verified||[]).slice();
  var untested=(q.untested||[]).slice();
  for(var i=0;i<claimed.length;i++){ if(untested.indexOf(claimed[i])===-1) untested.push(claimed[i]); }
  q.untested=untested;
  q.verified = (ev==="syntax") ? ["JavaScript has no syntax errors (sandbox syntax check)"] : [];
  if(claimed.length){
    q.summary=String(q.summary||"")+" [Honesty check: "+claimed.length+" 'verified' claim(s) moved to Untested \u2014 "
      +(ev==="syntax" ? "the sandbox only checked syntax, it did not click or run the UI" : "nothing was executed")
      +". Confirm them in Preview.]";
  }
  return q;
}

/* ---------- Patch 7b: browser UI tests ----------

var UI_MAX_TESTS=8, UI_TEST_TIMEOUT=8000;
var UI_RUNNER = "(function(){var errs=[];"
 + "window.addEventListener('error',function(e){errs.push(String(e&&e.message||'error'));});"

 + "function fire(el,t){el.dispatchEvent(new Event(t,{bubbles:true}));}"
 + "function run(t){var steps=t.steps||[],exp=t.expect||[],i=0;"
 + " function step(){if(i>=steps.length)return Promise.resolve();var s=steps[i++]||{};var el=s.sel?Q(s.sel):null;"
 + "  if(s['do']!=='wait'&&!el)return Promise.reject({kind:'error',msg:'element not found: '+s.sel});"
 + "  if(s['do']==='fill'){try{el.focus();}catch(_){}el.value=String(s.value==null?'':s.value);fire(el,'input');fire(el,'change');fire(el,'keyup');}"
 + "  else if(s['do']==='click'){el.click();}"
 + "  else if(s['do']==='select'){el.value=String(s.value);fire(el,'change');}"
 + "  else if(s['do']==='key'){el.dispatchEvent(new KeyboardEvent('keydown',{key:s.value||'Enter',bubbles:true}));el.dispatchEvent(new KeyboardEvent('keyup',{key:s.value||'Enter',bubbles:true}));}"
 + "  return sleep(s['do']==='wait'?Math.min(+s.ms||300,2000):80).then(step);}"
 + " return sleep(150).then(step).then(function(){var fails=[];for(var k=0;k<exp.length;k++){var e=exp[k]||{},el=Q(e.sel);"
 + "  if(!el){if(e.visible===false)continue;return Promise.reject({kind:'error',msg:'element not found: '+e.sel});}"
 + "  var got=txt(el);"
 + "  if(e.visible===true&&!vis(el))fails.push(e.sel+' should be visible');"
 + "  if(e.visible===false&&vis(el))fails.push(e.sel+' should be hidden');"
 + "  if(e.text_contains!=null&&got.indexOf(String(e.text_contains))<0)fails.push(e.sel+' expected to contain \"'+e.text_contains+'\" but shows \"'+got.slice(0,80)+'\"');"
 + "  if(e.text_not_contains!=null&&got.indexOf(String(e.text_not_contains))>=0)fails.push(e.sel+' should not contain \"'+e.text_not_contains+'\"');"
 + "  if(e.count!=null){var n=0;try{n=document.querySelectorAll(e.sel).length;}catch(_){}if(n!==+e.count)fails.push(e.sel+' count '+n+', expected '+e.count);}}"
 + " if(errs.length)fails.push('JavaScript error: '+errs[0]);return fails;});}"
 + "window.addEventListener('message',function(ev){var d=ev.data;if(!d||d.type!=='aiaf-ui-run')return;"
 + " run(d.test||{}).then(function(f){parent.postMessage({type:'aiaf-ui-result',id:d.id,status:f.length?'fail':'pass',detail:f.join('; ')},'*');},"
 + " function(e){parent.postMessage({type:'aiaf-ui-result',id:d.id,status:(e&&e.kind)||'error',detail:String((e&&e.msg)||e)},'*');});});"
 + "})();";
function runOneUiTest(html, test){
  return new Promise(function(resolve){
    var id="t"+Date.now().toString(36)+Math.random().toString(36).slice(2,6), done=false;
    var fr=document.createElement("iframe");
    fr.setAttribute("sandbox","allow-scripts allow-forms");
    fr.setAttribute("aria-hidden","true");
    fr.style.cssText="position:fixed;left:-10000px;top:0;width:375px;height:720px;border:0;opacity:0;pointer-events:none";
    function finish(r){ if(done) return; done=true; window.removeEventListener("message",onMsg); clearTimeout(tm); try{ fr.parentNode.removeChild(fr); }catch(_){} resolve(r); }
    function onMsg(ev){ var d=ev.data; if(ev.source!==fr.contentWindow || !d || d.type!=="aiaf-ui-result" || d.id!==id) return; finish({ status:d.status, detail:String(d.detail||"") }); }
    var tm=setTimeout(function(){ finish({ status:"error", detail:"timed out" }); }, UI_TEST_TIMEOUT);
    window.addEventListener("message", onMsg);
    fr.onload=function(){ try{ fr.contentWindow.postMessage({ type:"aiaf-ui-run", id:id, test:test }, "*"); }catch(e){ finish({ status:"error", detail:e.message }); } };
    var runner="<script>"+UI_RUNNER+"<"+"/script>";
    fr.srcdoc = /<head[^>]*>/i.test(html) ? html.replace(/<head[^>]*>/i, function(m){ return m+runner; }) : (runner+html);
    document.body.appendChild(fr);
  });
}
function cleanUiTests(list){
  var out=[]; if(!Array.isArray(list)) return out;
  for(var i=0;i<list.length && out.length<UI_MAX_TESTS;i++){
    var t=list[i]; if(!t || typeof t!=="object") continue;
    var steps=Array.isArray(t.steps)?t.steps.slice(0,15):[], exp=Array.isArray(t.expect)?t.expect.slice(0,8):[];
    if(!exp.length) continue;
    out.push({ name:String(t.name||("Test "+(out.length+1))).slice(0,120), steps:steps, expect:exp });
  }
  return out;
}
function runUiTests(p, tests){
  var html=buildPreviewHtml(p); tests=cleanUiTests(tests);
  if(!html || !tests.length || typeof document==="undefined") return Promise.resolve(null);
  var results=[], i=0;
  function next(){
    if(i>=tests.length) return Promise.resolve(results);
    var t=tests[i++];
    return runOneUiTest(html, t).then(function(r){ results.push({ name:t.name, status:r.status, detail:r.detail, test:t }); return next(); });
  }
  return next();
}
function applyUiResults(p, q, results){
  if(!results || !results.length) return q;
  var pass=0, fail=0, err=0;
  q.verified=(q.verified||[]).slice(); q.failed=(q.failed||[]).slice(); q.untested=(q.untested||[]).slice(); q.bugs=(q.bugs||[]).slice();
  for(var i=0;i<results.length;i++){
    var r=results[i];
    if(r.status==="pass"){ pass++; q.verified.push("UI test passed: "+r.name); }
    else if(r.status==="fail"){ fail++; q.failed.push("UI test failed: "+r.name);
      q.bugs.push({ severity:"high", title:"UI test failed: "+r.name, detail:r.detail+" | steps: "+JSON.stringify(r.test.steps).slice(0,400),
                    fix:"Make the app pass this interaction: after these steps the page must show what the test expects.", fromUiTest:true }); }
    else { err++; q.untested.push("UI test could not run: "+r.name+" ("+r.detail+")"); }
  }
  q.ui={ ran:results.length, passed:pass, failed:fail, errors:err, results:results.map(function(r){ return { name:r.name, status:r.status, detail:r.detail }; }) };
  if(pass+fail>0) q.evidence="ui";
  if(fail>0 && q.verdict==="pass") q.verdict="changes_requested";
  if(fail>0) q.summary=String(q.summary||"")+" [Browser UI tests: "+fail+" of "+(pass+fail)+" failed.]";
  else if(pass>0) q.summary=String(q.summary||"")+" [Browser UI tests: all "+pass+" passed.]";

}

  runBuilderFix(p).then(function(j){
    replaceBuild(p, j, "Builder fix (iteration "+p.iteration+")");
    p.qa=null; p.phase="Fix applied — re-run QA";
    logActivity(p,"Builder","Applied fixes (iteration "+p.iteration+"). Re-run QA to verify.");
    upsertProject(p); setBusy("builder",false); state.projectTab="qa"; render();
  }).catch(function(e){ setBusy("builder",false); alert(e.message); render(); });
}
function markComplete(id){
  var p=getProject(id); if(!p) return;
  if(p.status==="completed"){ render(); return; }
  var ob=openUserBugs(p);
  if(ob.length){ alert(ob.length+" bug(s) you reported are still OPEN.\n\nTest each one in Preview and tap \"I tested it \u2014 it's fixed\" before completing."); return; }
  p.status="completed"; p.phase="Completed"; logActivity(p,"You","Marked project complete."); upsertProject(p); render();
}
function rollbackBuild(id, ix){
  var p=getProject(id); if(!p||!p.buildHistory||!p.buildHistory[ix]) return;
  var snap=p.buildHistory[ix];
  var restored={ files:JSON.parse(JSON.stringify(snap.files||[])), summary:(snap.summary||""),
    run_commands:(snap.run_commands||[]).slice(), how_to_run:(snap.how_to_run||""),
    not_implemented:(snap.not_implemented||[]).slice() };
  /* replaceBuild checkpoints the CURRENT build first, so restoring never loses it,
     and clears execution + dependency-audit results tied to the old build. */
  replaceBuild(p, restored, "restore of v"+snap.v);
  p.qa=null; p.security=null; p.autofix=null; p.iteration=0; p.secIteration=0;
  p.phase="Restored v"+snap.v;
  refreshStatus(p);
  logActivity(p,"You","Restored checkpoint v"+snap.v+" (files, commands, notes). Current build was checkpointed first. Re-run QA & Security.");
  upsertProject(p); state.projectTab="build"; render();
}

/* ---------- Auto-fix loop: QA -> Builder -> Execute -> QA ---------- */
var AUTOFIX = { cancel:false };
var AUTOFIX_LABEL = { pass:"QA passed", not_needed:"Not needed", blocked:"Blocked by QA", stopped:"Stopped",
  cancelled:"Cancelled", limit:"Iteration limit", no_progress:"No progress", regressed:"Regressed", error:"Error" };
function bugSig(qa){
  return ((qa&&qa.bugs)||[]).map(function(b){ return String((b&&b.title)||"").toLowerCase().replace(/\s+/g," ").trim(); }).sort().join("|");
}
function autofixStatus(p){
  var o=p.autofix&&p.autofix.outcome;
  if(o==="pass") return "done";
  if(o==="not_needed") return "skipped";
  return "stopped";
}
/* Runs fix rounds until QA passes or a stop condition hits. Never loops past
   MAX_ITER, stops on repeated or growing bug lists, and checkpoints every
   build it replaces (via replaceBuild). Resolves with the outcome key. */
function runAutoFixLoop(p, onProgress){
  onProgress = onProgress || function(){};
  AUTOFIX.cancel=false;
  p.autofix={ rounds:[], outcome:null, startedAt:nowStr() };
  var lastSig=bugSig(p.qa);
  function finish(outcome, msg){
    p.autofix.outcome=outcome; logActivity(p,"Auto-fix",msg); upsertProject(p); return outcome;
  }
  function round(){
    if(!p.qa){
      onProgress("QA review");
      return runQA(p).then(function(q){ p.qa=q; upsertProject(p); lastSig=bugSig(q); return round(); });
    }
    var n=p.autofix.rounds.length;
    var v=p.qa.verdict;
    var bugs=p.qa.bugs||[];
    if(v==="pass") return Promise.resolve(finish(n?"pass":"not_needed", n?("QA passed after "+n+" round(s)."):"QA already passed — nothing to fix."));
    if(v==="blocked") return Promise.resolve(finish("blocked","Stopped: QA verdict BLOCKED — needs your review."));
    if(!bugs.length) return Promise.resolve(finish(n?"stopped":"not_needed","Stopped: QA requested changes but listed no bugs."));
    if(AUTOFIX.cancel) return Promise.resolve(finish("cancelled","Cancelled by you after "+n+" round(s)."));
    if((p.iteration||0)>=MAX_ITER) return Promise.resolve(finish("limit","Stopped at iteration limit ("+MAX_ITER+") with "+bugs.length+" bug(s) left."));
    p.iteration=(p.iteration||0)+1;
    var it=p.iteration, before=bugs.length;
    onProgress("round "+it+"/"+MAX_ITER+" — Builder fixing "+before+" bug(s)");
    return runBuilderFix(p).then(function(j){
      replaceBuild(p, j, "Auto-fix round "+it);   /* checkpoints the previous build */
      p.qa=null; p.security=null;                  /* both were about the old build */
      logActivity(p,"Builder","Auto-fix round "+it+": applied fixes for "+before+" bug(s).");
      upsertProject(p);
      onProgress("round "+it+"/"+MAX_ITER+" — executing");
      return wfExecute(p);
    }).then(function(){
      onProgress("round "+it+"/"+MAX_ITER+" — QA re-review");
      return runQA(p);
    }).then(function(q){
      p.qa=q;
      var after=(q.bugs||[]).length, sig=bugSig(q);
      p.autofix.rounds.push({ n:it, before:before, after:after, verdict:q.verdict||"?", runtime:runtimeLabel(p) });
      logActivity(p,"Supervisor/QA","Auto-fix round "+it+": "+before+" → "+after+" bug(s), verdict "+(q.verdict||"?")+".");
      upsertProject(p);
      if(q.verdict==="changes_requested" && after>0){
        if(sig===lastSig) return finish("no_progress","Stopped: the same bugs came back — no progress. Review manually or restore a checkpoint.");
        if(after>before) return finish("regressed","Stopped: bug count went up ("+before+" → "+after+"). The previous build is saved as a checkpoint.");
      }
      lastSig=sig;
      return round();
    });
  }
  return round();
}
function stepAutoFix(id){
  var p=getProject(id); if(!p||!p.build) return;
  if(!p.qa){ alert("Run QA first."); return; }
  if((p.iteration||0)>=MAX_ITER){
    if(!confirm("Iteration limit reached ("+MAX_ITER+"). Reset the counter and allow "+MAX_ITER+" more rounds?")) return;
    p.iteration=0; logActivity(p,"You","Reset the fix-iteration counter.");
  }
  setBusy("autofix",true); state.projectTab="qa"; render();
  runAutoFixLoop(p, function(msg){ p.phase="Auto-fix: "+msg; upsertProject(p); render(); })
    .then(function(o){ p.phase="Auto-fix: "+(AUTOFIX_LABEL[o]||o); upsertProject(p); setBusy("autofix",false); render(); })
    .catch(function(e){
      if(!p.autofix) p.autofix={ rounds:[] };
      p.autofix.outcome="error"; p.phase="Auto-fix error";
      logActivity(p,"Auto-fix","Error: "+e.message);
      upsertProject(p); setBusy("autofix",false); render();
      alert(e.message+"\n\n"+classifyError(e));
    });
}
function cancelAutoFix(){ AUTOFIX.cancel=true; render(); }
function autofixPanel(p){
  var h="";
  var afStep = p.workflow && p.workflow.steps ? wfStepObj(p,"autofix") : null;
  var running = isBusy("autofix") || !!(afStep && afStep.status==="running" && isBusy("workflow"));
  var canFix = p.qa && p.qa.verdict==="changes_requested" && p.qa.bugs && p.qa.bugs.length;
  if(canFix || running){
    h+='<div class="flex-between" style="margin-top:10px"><span>';
    if(running){
      h+='<button class="btn ghost sm"'+(AUTOFIX.cancel?' disabled':'')+' onclick="cancelAutoFix()">'
        +(AUTOFIX.cancel?'Stopping after this round…':'Stop auto-fix')+'</button>';
    } else {
      h+=runBtn("Auto-fix until pass (max "+MAX_ITER+")","stepAutoFix('"+p.id+"')","autofix",isBusy("workflow"),"red")+' ';
      h+=runBtn("One fix round","stepBuilderFix('"+p.id+"')","builder",isBusy("workflow"),"ghost");
    }
    h+='</span><span class="help">iterations: '+(p.iteration||0)+'/'+MAX_ITER+'</span></div>';

    if(af.outcome) h+=' <span class="badge '+(af.outcome==="pass"?"b-active":"b-phase")+'">'+esc(AUTOFIX_LABEL[af.outcome]||af.outcome)+'</span>';
    for(var i=0;i<af.rounds.length;i++){

  }
  return h;

/* Status follows the latest QA + Security results (never un-completes a project). */
function refreshStatus(p){
  if(p.status==="completed") return;
  var qaBlocked = !!(p.qa && p.qa.verdict==="blocked");
  var rr = p.security && p.security.risk_rating;
  var secBlocked = (rr==="critical" || rr==="high");
  p.status = (qaBlocked || secBlocked) ? "blocked" : "active";
}

/* ---------- Patch 5: user bug reports ----------
   Bugs the owner finds while testing the preview. They stay OPEN until the
   owner marks them resolved, and are fed to QA and the Builder every round. */
function openUserBugs(p){
  var out=[], l=p.userBugs||[];
  for(var i=0;i<l.length;i++){ if(l[i] && l[i].status!=="resolved") out.push(l[i]); }
  return out;
}
function openUserBugsText(p){

  var t="\nUSER-REPORTED ISSUES (the owner tested the running app; treat these as real):\n";
  for(var i=0;i<l.length;i++){ t+="- ["+l[i].severity+"] "+l[i].title+": "+l[i].detail+"\n"; }

}
function reportBug(id){
  var p=getProject(id); if(!p||!p.build) return;
  var ta=document.getElementById("ub_text"), sv=document.getElementById("ub_sev"), af=document.getElementById("ub_autofix");
  var text=ta ? String(ta.value||"").trim() : "";
  if(text.length<5){ alert("Describe what is wrong (at least a few words)."); return; }
  var sev=(sv && /^(high|medium|low)$/.test(sv.value)) ? sv.value : "medium";
  var title="[You] "+(text.length>80 ? (text.substring(0,77)+"...") : text).replace(/\s+/g," ");
  var bug={ id:"ub"+Date.now().toString(36), severity:sev, title:title, detail:text, status:"open", ts:nowStr() };
  if(!p.userBugs) p.userBugs=[];
  p.userBugs.push(bug);
  if(!p.qa) p.qa={ summary:"Issue reported by you after testing.", verified:[], failed:[], untested:[], bugs:[], verdict:"changes_requested" };
  if(!p.qa.bugs) p.qa.bugs=[];
  p.qa.bugs.push({ severity:sev, title:title, detail:text, fix:"Make the app behave as the owner describes.", fromUser:true });
  if(p.qa.verdict!=="blocked") p.qa.verdict="changes_requested";
  if(p.status==="completed"){ p.status="active"; logActivity(p,"You","Re-opened the project with a bug report."); }
  logActivity(p,"You","Reported bug ["+sev+"]: "+title);
  p.phase="Bug reported";
  upsertProject(p);
  if(af && af.checked){ stepAutoFix(id); } else { render(); }
}
function resolveUserBug(id, bid){
  var p=getProject(id); if(!p||!p.userBugs) return;
  for(var i=0;i<p.userBugs.length;i++){
    if(p.userBugs[i].id===bid){ p.userBugs[i].status="resolved"; p.userBugs[i].resolvedAt=nowStr(); logActivity(p,"You","Confirmed fixed: "+p.userBugs[i].title); }
  }
  upsertProject(p); render();
}
function reopenUserBug(id, bid){
  var p=getProject(id); if(!p||!p.userBugs) return;
  for(var i=0;i<p.userBugs.length;i++){
    if(p.userBugs[i].id===bid){ p.userBugs[i].status="open"; delete p.userBugs[i].resolvedAt; logActivity(p,"You","Still broken: "+p.userBugs[i].title); }
  }
  if(p.status==="completed"){ p.status="active"; p.phase="Bug re-opened"; logActivity(p,"You","Re-opened the project (bug still broken)."); }
  upsertProject(p); render();
}
function userBugPanel(p){
  var h='<div class="divider"></div><b>Report a bug you found</b>';

/* ---------- Phase 4: Cybersecurity agent ---------- */
function callSandbox(p, commands){
  var s=getSettings();
  if(!s.sandboxUrl) return Promise.resolve({ configured:false });
  var files=(p.build&&p.build.files)||[];
  var body={ secret:s.sandboxSecret||"", commands:commands,
             files:files.map(function(f){ return { path:f.path, content:f.content }; }) };
  return runnerFetch(s.sandboxUrl, body)
    .then(function(res){ return res.text().then(function(raw){
      if(!res.ok) throw new Error("Sandbox error ("+res.status+"): "+String(raw).slice(0,200));
      var d; try{ d=JSON.parse(raw); }catch(e){ throw new Error("Bad sandbox response."); }
      d.configured=true; return d;
    }); });
}
function hasPackageJson(p){
  var files=(p.build&&p.build.files)||[];
  for(var i=0;i<files.length;i++){ if(/package\.json$/i.test(files[i].path)) return true; }
  return false;
}
function runSecurity(p){
  var files=(p.build&&p.build.files)||[]; var filesCtx="";
  for(var k=0;k<files.length;k++){ filesCtx+="=== "+files[k].path+" ===\n"+files[k].content+"\n"; }
  var depCtx;
  if(p.depAudit&&p.depAudit.configured){
    depCtx="DEPENDENCY AUDIT OUTPUT (npm audit):\n";
    var rs=p.depAudit.results||[];
    for(var i=0;i<rs.length;i++){ depCtx+=(rs[i].stdout||"")+"\n"+(rs[i].stderr||"")+"\n"; }
    if(depCtx.length>6000) depCtx=depCtx.slice(0,6000)+"...(truncated)";
  } else {
    depCtx="No dependency audit was run (needs a configured sandbox). Do not invent CVEs; mark dependency risk as unverified.";
  }
  var sys="You are the CYBERSECURITY agent. Audit the code for real security issues only. "
    +"Do NOT fabricate findings or invent CVEs. Do NOT output any secret values you find — reference them by file and line only. "
    +"Cover: authentication/authorization, exposed secrets/credentials, input validation & injection, "
    +"access-control & tenant isolation, insecure API usage, dangerous code execution, and dependency risk. "
    +"Return ONLY valid JSON, no markdown: {\"summary\":string,\"risk_rating\":\"critical|high|medium|low|none\","
    +"\"findings\":[{\"severity\":\"critical|high|medium|low\",\"category\":string,\"location\":string,\"detail\":string,\"recommendation\":string}],"
    +"\"secrets_found\":[string],\"dependency_notes\":string}";
  var execNote = (p.exec && p.exec.configured) ? ("EXECUTION: build "+(p.exec.success?"passed tests":"FAILED tests")+" in the sandbox (current build).\n") : "";
  var usr="APP: "+p.name+"\nREQUIREMENTS:\n"+p.description+"\n\n"+execNote+depCtx+"\n\nCODE:\n"+filesCtx;
  return callModel("sec", sys, usr).then(function(r){
    var j=extractJson(r.text); if(!j) throw new Error("Security agent returned unparseable output."); return j;
  });
}
function runSecurityFix(p){
  var f=(p.security&&p.security.findings)||[]; var fx="";
  for(var i=0;i<f.length;i++){ fx+="- ["+f[i].severity+"/"+f[i].category+"] "+f[i].location+": "+f[i].detail+" => "+f[i].recommendation+"\n"; }
  var files=(p.build&&p.build.files)||[]; var filesCtx="";
  for(var k=0;k<files.length;k++){ filesCtx+="=== "+files[k].path+" ===\n"+files[k].content+"\n"; }
  var sys="You are the BUILDER applying AUTHORIZED security fixes. Return the FULL updated file set (not a diff). "
    +"Fix only the listed security issues; preserve features and never hardcode credentials or new secrets. "
    +"Return ONLY valid JSON, no markdown: {\"summary\":string,\"files\":[{\"path\":string,\"language\":string,\"content\":string}],"
    +"\"run_commands\":[string],\"how_to_run\":string,\"not_implemented\":[string]}";
  var usr="REQUIREMENTS:\n"+p.description+"\n\nSECURITY FINDINGS TO FIX:\n"+fx+"\nCURRENT CODE:\n"+filesCtx;
  return callModel("builder", sys, usr).then(function(r){
    var j=extractJson(r.text); if(!j||!j.files) throw new Error("Security fix returned unparseable output."); return j;
  });
}
function stepDepAudit(id){
  var p=getProject(id); if(!p) return;
  setBusy("dep",true); render();
  callSandbox(p, ["npm install --package-lock-only --no-audit || true","npm audit --json || true"]).then(function(d){
    if(!d.configured){ setBusy("dep",false); alert("No sandbox configured — dependency audit needs the runner."); render(); return; }
    capExecLogs(d); p.depAudit=d; logActivity(p,"Cybersecurity","Ran dependency audit (npm audit).");
    upsertProject(p); setBusy("dep",false); render();

}
function stepSecScan(id){

    p.security=j; p.phase="Security audited";

    upsertProject(p); setBusy("sec",false); render();

function stepSecurityFix(id){
  var p=getProject(id); if(!p||!p.security) return;

  p.secIteration=(p.secIteration||0)+1;

  }
  setBusy("secfix",true); render();

/* ---------- Phase 2: lightweight orchestrator ---------- */
var WF_STEPS = [ {key:"design",label:"Design"}, {key:"builder",label:"Builder"},
                 {key:"execute",label:"Execute"}, {key:"qa",label:"QA"},
                 {key:"autofix",label:"Auto-fix"}, {key:"security",label:"Security"} ];
function initWorkflow(p){
  p.workflow = { running:false, awaitingApproval:false, failedStep:null, error:null, errorHint:null,
                 steps: WF_STEPS.map(function(s){ return { key:s.key, label:s.label, status:"pending" }; }) };
}
function wfStepObj(p,key){ for(var i=0;i<p.workflow.steps.length;i++){ if(p.workflow.steps[i].key===key) return p.workflow.steps[i]; } return null; }
function wfLabel(w,key){ for(var i=0;i<w.steps.length;i++){ if(w.steps[i].key===key) return w.steps[i].label; } return key; }
function classifyError(err){
  var st = err && err.status; var msg = (err && err.message) || "";
  if(/output truncated/i.test(msg)) return "Builder output was cut off twice. Tap Resume/Retry once more; if it repeats, set a different Builder model in Settings (e.g. llama-3.3-70b-versatile on Groq) or simplify the request.";
  /* Sandbox runner errors (checked first so they are not mistaken for model errors) */
  if(/sandbox runner unreachable/i.test(msg)) return "Runner unreachable — set ALLOWED_ORIGIN on Render exactly as shown above, confirm the service is Live, then Resume.";
  if(/sandbox runner url/i.test(msg)) return "Fix the Sandbox runner URL in Settings, then Resume.";
  if(/^Sandbox error \(401\)/i.test(msg)) return "Runner secret mismatch — Settings 'Runner shared secret' must equal RUNNER_SECRET on Render.";
  if(/^Sandbox error \(404\)/i.test(msg)) return "Runner endpoint not found — the Sandbox runner URL must end with /run.";
  if(/^Sandbox error \(5\d\d\)/i.test(msg)) return "Runner/E2B failed on the server — check Render logs (is E2B_API_KEY set?), then Resume.";
  if(/bad sandbox response/i.test(msg)) return "Runner returned non-JSON — check the URL points to the runner's /run endpoint.";
  if(st===401 || /unauthorized|api key|user not found|invalid.*argument/i.test(msg)) return "Check your API key in Settings (401 / invalid key).";
  if(st===404 || /not found|no longer available/i.test(msg)) return "Check the model name / Base URL in Settings (404).";
  if(err && err.tooLarge) return "This request is bigger than the model's per-minute token limit, so waiting cannot help. In Settings, give this agent a model with a higher limit (or upgrade the provider tier), then Resume.";
  if(st===429) return "Rate limited (429) \u2014 auto-waited but the limit persists (likely a daily or long cooldown). Wait longer or switch this agent's model in Settings, then Resume.";
  if(st===503 || st===500 || st===502 || /high demand|unavailable|overloaded|temporarily/i.test(msg)) return "Provider busy (5xx) — it was retried; wait and Resume, or switch model in Settings.";
  if(/load failed|failed to fetch|network|timeout/i.test(msg)) return "Network issue — check connection, then Resume.";
  return "Open the failed step's tab to inspect or re-run manually.";
}
/* Any new build makes prior runtime results obsolete — clear them so
   QA/approval never treat an older build's execution as current proof. */
function invalidateBuildArtifacts(p){ p.exec=null; p.depAudit=null; }
/* Replace the build, but first checkpoint the PREVIOUS build so it can be
   restored. Never snapshots the new build as if it were the old one. */
function replaceBuild(p, newBuild, note){
  if(p.build){ snapshotBuild(p, "Previous build (before "+(note||"replacement")+")"); }
  p.build = newBuild;
  invalidateBuildArtifacts(p);
}
/* Classify outstanding QA/Security issues for the approval gate. */
function workflowIssues(p){
  var hard=[], soft=[];
  var qv = p.qa && p.qa.verdict;
  var rr = p.security && p.security.risk_rating;
  var qOk = (qv==="pass" || qv==="changes_requested" || qv==="blocked");
  var rOk = (rr==="critical" || rr==="high" || rr==="medium" || rr==="low" || rr==="none");
  if(!qOk) hard.push("QA result missing or unrecognized");
  else if(qv==="blocked") hard.push("QA verdict is BLOCKED");
  if(!rOk) hard.push("Security result missing or unrecognized");
  else if(rr==="critical" || rr==="high") hard.push("Security risk is "+String(rr).toUpperCase());
  if(p.exec && p.exec.configured && p.exec.success===false) hard.push("Execution failed — tests did not pass");

  if(ubo) hard.push(ubo+" bug(s) you reported are still open (confirm fixed in Preview)");

  if(p.qa && p.qa.bugs && p.qa.bugs.length && qv!=="blocked") soft.push(p.qa.bugs.length+" QA bug(s) reported");

function runtimeLabel(p){

    if(p.exec.success===false) return "executed — tests FAILED (current build)";

/* Stage 1 (real execution): cap logs to protect localStorage, then run the
   existing sandbox adapter. Missing sandbox => skipped + honest UNTESTED. */
function capExecLogs(d){
  var MAX=4000;
  if(d && d.results){
    for(var i=0;i<d.results.length;i++){
      var r=d.results[i];
      if(r.stdout && r.stdout.length>MAX) r.stdout=r.stdout.slice(0,MAX)+"\n...(truncated)";
      if(r.stderr && r.stderr.length>MAX) r.stderr=r.stderr.slice(0,MAX)+"\n...(truncated)";
    }
    if(d.results.length>20) d.results=d.results.slice(0,20);
  }
  return d;
}
function wfExecute(p){
  var s=getSettings();
  if(!s.sandboxUrl){
    logActivity(p,"Runner","No sandbox configured — execution skipped; runtime UNTESTED.");
    return Promise.resolve({ skipped:true });
  }
  return runExecution(p).then(function(d){
    if(!d || !d.configured){
      logActivity(p,"Runner","No sandbox configured — execution skipped; runtime UNTESTED.");
      return { skipped:true };
    }
    capExecLogs(d); p.exec=d;
    logActivity(p,"Runner", d.success ? "Executed in sandbox — success (current build)." : "Executed in sandbox — tests FAILED (current build).");
    upsertProject(p);
    return d;
  });
}
function wfRun(p, key){
  if(key==="design") return runDesign(p).then(function(j){ p.design=j; logActivity(p,"Design","Produced design specification (workflow)."); });
  if(key==="builder") return runBuilder(p).then(function(j){
      replaceBuild(p, j, "workflow Builder");   /* checkpoints previous build, invalidates stale exec/audit */
      logActivity(p,"Builder","Generated code (workflow). Runtime UNTESTED until executed."); });
  if(key==="execute") return wfExecute(p);
  if(key==="qa") return runQA(p).then(function(j){ p.qa=j; logActivity(p,"Supervisor/QA","Review verdict: "+(j.verdict||"?")+" (workflow)."); });
  if(key==="autofix") return runAutoFixLoop(p, function(msg){ p.phase="Workflow: Auto-fix "+msg; upsertProject(p); render(); });
  if(key==="security") return runSecurity(p).then(function(j){ p.security=j; logActivity(p,"Cybersecurity","Audit risk: "+(j.risk_rating||"?")+" (workflow)."); });

function startWorkflow(id){

  if(!(p.approvals && p.approvals.plan)){ alert("Approve the plan first (tab 1 · Plan)."); return; }
  initWorkflow(p); p.iteration=0; p.secIteration=0; p.autofix=null;
  logActivity(p,"Orchestrator","Started workflow: Design → Builder → Execute → QA → Auto-fix → Security.");

function runWorkflowFrom(id, startKey, singleStep){
  var p=getProject(id); if(!p||!p.workflow) return;
  p.workflow.running=true; p.workflow.failedStep=null; p.workflow.error=null; p.workflow.errorHint=null; p.workflow.awaitingApproval=false;
  setBusy("workflow",true);
  var order = p.workflow.steps.map(function(s){ return s.key; });
  var startIdx = order.indexOf(startKey); if(startIdx<0) startIdx=0;
  function runIdx(i){
    if(i>=order.length){
      p.workflow.running=false; p.workflow.awaitingApproval=true; setBusy("workflow",false);
      p.phase="Awaiting approval"; logActivity(p,"Orchestrator","All steps complete — awaiting your approval.");
      upsertProject(p); render(); return;
    }
    var key=order[i]; var st=wfStepObj(p,key);
    st.status="running"; p.phase="Workflow: "+st.label; upsertProject(p); render();
    wfRun(p,key).then(function(){
      if(key==="execute") st.status = (!p.exec || !p.exec.configured) ? "skipped" : (p.exec.success===false ? "failed" : "done");
      else if(key==="autofix") st.status = autofixStatus(p);
      else st.status = "done";
      if(key==="qa" || key==="autofix" || key==="security") refreshStatus(p);
      upsertProject(p); render();
      if(singleStep){ p.workflow.running=false; setBusy("workflow",false); upsertProject(p); render(); return; }
      runIdx(i+1);
    }).catch(function(err){
      st.status="failed"; p.workflow.running=false; p.workflow.failedStep=key;
      p.workflow.error=err.message; p.workflow.errorHint=classifyError(err);

function approveWorkflow(id){
  var p=getProject(id); if(!p||!p.workflow) return;
  var w=p.workflow;
  /* fail-closed state guards — approval only at a valid gate */
  if(!w.awaitingApproval){ alert("Approval is only available at the approval gate (after all steps complete)."); return; }
  if(w.running){ alert("The workflow is still running — wait for it to finish."); return; }
  if(w.failedStep){ alert("A step failed. Resolve it with Retry or Resume before approving."); return; }
  var iss = workflowIssues(p);
  if(iss.hard.length){
    var msg = "OVERRIDE WARNING — serious issues remain:\n\n- " + iss.hard.join("\n- ")
      + (iss.soft.length ? ("\n- " + iss.soft.join("\n- ")) : "")
      + "\n\nRuntime: " + runtimeLabel(p)
      + "\n\nApproving is an explicit override and will mark the project complete anyway. Continue?";
    if(!confirm(msg)){ logActivity(p,"You","Declined override; approval cancelled (issues: "+iss.hard.join("; ")+")."); upsertProject(p); render(); return; }
    p.workflow.awaitingApproval=false; p.status="completed"; p.phase="Completed (approved with override)";
    logActivity(p,"You","APPROVED WITH OVERRIDE despite: "+iss.hard.concat(iss.soft).join("; ")+". Runtime: "+runtimeLabel(p)+".");
    upsertProject(p); render(); return;
  }
  if(iss.soft.length){
    if(!confirm("Note before completing:\n\n- "+iss.soft.join("\n- ")+"\n\nRuntime: "+runtimeLabel(p)+"\n\nApprove and mark complete anyway?")){ logActivity(p,"You","Approval cancelled."); upsertProject(p); render(); return; }
    p.workflow.awaitingApproval=false; p.status="completed"; p.phase="Completed (with noted issues)";
    logActivity(p,"You","Approved with noted issues: "+iss.soft.join("; ")+". Runtime: "+runtimeLabel(p)+".");

    var data=enc.encode(String(files[i].content||""));
    var crc=crc32(data);
    var lh=new Uint8Array([].concat(u32(0x04034b50),u16(20),u16(0x0800),u16(0),u16(0),u16(0),
      u32(crc),u32(data.length),u32(data.length),u16(nameBytes.length),u16(0)));

    u16(files.length),u16(files.length),u32(cdSize),u32(offset),u16(0)));

  for(m=0;m<all.length;m++){ out.set(all[m],pos); pos+=all[m].length; }

    a.href=url; a.download=filename; a.rel="noopener";
    document.body.appendChild(a); a.click(); document.body.removeChild(a);
    setTimeout(function(){ URL.revokeObjectURL(url); }, 2000);
    return true;
  }catch(e){ return false; }
}
function openBlobTab(blob){
  try{ var w=window.open(URL.createObjectURL(blob),"_blank"); return !!w; }catch(e){ return false; }
}
/* iOS Safari ignores <a download>, so prefer the Web Share sheet (Save to
   Files); fall back to an anchor, then to opening the file. Never silent. */
function saveBlob(blob, filename){
  try{
    if(navigator.canShare && typeof File!=="undefined"){
      var file=new File([blob], filename, { type: blob.type || "application/octet-stream" });
      if(navigator.canShare({ files:[file] })){
        navigator.share({ files:[file], title:filename }).catch(function(err){
          if(err && err.name==="AbortError") return;
          if(!anchorSave(blob, filename) && !openBlobTab(blob))
            alert("Couldn't save on this device. Use Copy, or the Export button, to keep the code.");
        });
        return;
      }
    }
  }catch(e){}
  if(isIOS()){
    if(openBlobTab(blob)) alert("Opened the file in a new tab — use Share then Save to Files to keep it.");
    else alert("iOS couldn't download automatically. Use Copy to keep the code.");
    return;
  }
  if(!anchorSave(blob, filename)){
    if(!openBlobTab(blob)) alert("Couldn't download on this browser. Use Copy, or the Export button.");
  }
}
function downloadOne(id, idx){
  var p=getProject(id);
  if(!p||!p.build||!p.build.files||!p.build.files[idx]){ alert("Nothing to download."); return; }
  var f=p.build.files[idx];
  var mime = /\.html?$/i.test(f.path) ? "text/html" : (/\.css$/i.test(f.path)?"text/css":(/\.js$/i.test(f.path)?"text/javascript":"text/plain"));
  saveBlob(new Blob([String(f.content||"")], { type:mime }), baseName(f.path) || "file.txt");
}
function downloadAllZip(id){
  var p=getProject(id);
  if(!p||!p.build||!p.build.files||!p.build.files.length){ alert("Nothing to download."); return; }
  if(p.build.files.length===1){ downloadOne(id,0); return; }
  try{
    var zip=zipFiles(p.build.files);
    var nm=(p.name?p.name.replace(/[^a-z0-9_-]+/gi,"_"):"project")+".zip";
    saveBlob(zip, nm);
  }catch(e){ alert("Couldn't build the ZIP: "+e.message+". Download files one by one, or use Export."); }
}

/* ---------- Cloud sync (Supabase) ----------
   Local-first: localStorage stays the working copy; changed projects are
   pushed (debounced) and pulled on start / sign-in. Newest updatedAt wins.
   Deletes are soft (deleted=true) so they sync across devices.
   API keys / settings are NEVER uploaded. */
var LS_CLOUD = "aiaf_cloud_v1";
var cloud = { client:null, user:null, status:"off", msg:"", dirty:{}, timer:null, flushing:false };
function getCloudCfg(){
  try{ var r=localStorage.getItem(LS_CLOUD); var c=r?JSON.parse(r):{};
    return { url:c.url||"", anon:c.anon||"", lastUid:c.lastUid||"" }; }
  catch(e){ return { url:"", anon:"", lastUid:"" }; }
}
function saveCloudCfg(c){ try{ localStorage.setItem(LS_CLOUD, JSON.stringify(c)); }catch(e){} }
function tsOf(x){ var t=Date.parse(x||""); return isNaN(t)?0:t; }
function cloudBadge(){
  var m={ off:["b-idle","Local only"], signed_out:["b-idle","Signed out"], syncing:["b-phase","Syncing\u2026"],
          ok:["b-active","Synced"], error:["b-blocked","Sync error"] }[cloud.status] || ["b-idle",cloud.status];
  return '<span class="badge '+m[0]+'">'+esc(m[1])+'</span>'+(cloud.msg?(' <span class="help">'+esc(cloud.msg)+'</span>'):'');
}
function cloudSetStatus(st, msg){
  cloud.status=st; cloud.msg=msg||"";
  var el=document.getElementById("cloud_status"); if(el) el.innerHTML=cloudBadge();
}
function cloudInit(){
  var c=getCloudCfg();
  cloud.client=null; cloud.user=null;
  if(!c.url || !c.anon){ cloudSetStatus("off"); return Promise.resolve(); }
  if(!window.supabase || !window.supabase.createClient){ cloudSetStatus("error","Supabase library not loaded (offline?). Working locally."); return Promise.resolve(); }
  try{
    cloud.client=window.supabase.createClient(c.url, c.anon, { auth:{ persistSession:true, autoRefreshToken:true, storageKey:"aiaf_sb_auth" } });
  }catch(e){ cloudSetStatus("error", e.message); return Promise.resolve(); }
  return cloud.client.auth.getSession().then(function(r){
    var sess=r && r.data && r.data.session;
    if(!sess){ cloudSetStatus("signed_out"); return; }
    return cloudAfterSignIn(sess.user);
  }).catch(function(e){ cloudSetStatus("error", e.message); });
}
/* Protect shared devices: projects left by ANOTHER account are not silently uploaded. */
function cloudAfterSignIn(user){
  cloud.user=user;
  var c=getCloudCfg();
  if(c.lastUid && c.lastUid!==user.id && loadProjects().length){
    if(confirm("This device has projects from a different account. Remove them from this device before loading yours?\n\nOK = remove them (recommended)\nCancel = keep them and upload them to THIS account")){
      saveProjects([]);
    }
  }
  c.lastUid=user.id; saveCloudCfg(c);
  return cloudPull();
}
function cloudMarkDirty(id, obj){
  if(!cloud.client || !cloud.user || !id) return;
  cloud.dirty[id]=obj||getProject(id)||null;
  if(cloud.timer) clearTimeout(cloud.timer);
  cloud.timer=setTimeout(cloudFlush, 1500);
}
function cloudFlush(){
  cloud.timer=null;
  if(!cloud.client || !cloud.user) return Promise.resolve();
  if(cloud.flushing){ cloud.timer=setTimeout(cloudFlush, 1500); return Promise.resolve(); }
  var ids=Object.keys(cloud.dirty); if(!ids.length) return Promise.resolve();
  var batch=cloud.dirty; cloud.dirty={};
  var rows=[];
  for(var i=0;i<ids.length;i++){
    var p=batch[ids[i]]; if(!p) continue;
    if(!p.updatedAt) p.updatedAt=new Date().toISOString();
    rows.push({ owner:cloud.user.id, id:p.id, data:p, deleted:false, updated_at:p.updatedAt });
  }
  if(!rows.length) return Promise.resolve();
  cloud.flushing=true; cloudSetStatus("syncing","Uploading "+rows.length+" project(s)");
  function requeue(msg){
    for(var k in batch){ if(!cloud.dirty[k]) cloud.dirty[k]=batch[k]; }
    cloudSetStatus("error", msg+" \u2014 will retry.");
    cloud.timer=setTimeout(cloudFlush, 15000);
  }
  return cloud.client.from("aiaf_projects").upsert(rows, { onConflict:"owner,id" }).then(function(res){
    cloud.flushing=false;
    if(res.error){ requeue(res.error.message); return; }
    cloudSetStatus("ok","Synced "+nowStr());
  }).catch(function(e){ cloud.flushing=false; requeue((e&&e.message)||"network error"); });
}
function cloudDelete(id){
  if(!cloud.client || !cloud.user) return;
  delete cloud.dirty[id];
  cloud.client.from("aiaf_projects").upsert([{ owner:cloud.user.id, id:id, data:{ id:id }, deleted:true, updated_at:new Date().toISOString() }], { onConflict:"owner,id" })
    .then(function(res){ if(res.error) cloudSetStatus("error","Delete not synced: "+res.error.message); })
    .catch(function(e){ cloudSetStatus("error","Delete not synced: "+((e&&e.message)||"network error")); });
}
function cloudPull(){
  if(!cloud.client || !cloud.user) return Promise.resolve();
  cloudSetStatus("syncing","Downloading");
  return cloud.client.from("aiaf_projects").select("id,data,deleted,updated_at").then(function(res){
    if(res.error) throw res.error;
    var merged=mergeCloudRows(loadProjects(), res.data||[]);
    if(merged.changed) saveProjects(merged.list);
    for(var i=0;i<merged.push.length;i++){ cloud.dirty[merged.push[i].id]=merged.push[i]; }
    cloudSetStatus("ok","Synced "+nowStr());
    if(merged.push.length) return cloudFlush();
  }).catch(function(e){ cloudSetStatus("error", (e&&e.message)||"pull failed"); });
}
/* Pure merge (testable): newest wins; remote soft-deletes remove older local copies. */
function mergeCloudRows(local, rows){
  var out=local.slice(), idx={}, i, changed=false, push=[], seenRemote={};
  for(i=0;i<out.length;i++) idx[out[i].id]=i;
  for(i=0;i<rows.length;i++){
    var row=rows[i]; if(!row || !safeImportId(row.id)) continue;
    seenRemote[row.id]=true;
    var li=idx[row.id], lp=(li===undefined)?null:out[li];
    var rTime=Math.max(tsOf(row.updated_at), tsOf(row.data && row.data.updatedAt));
    if(row.deleted){
      if(lp && tsOf(lp.updatedAt)<=rTime){ out[li]=null; changed=true; }
      else if(lp){ push.push(lp); }
      continue;
    }
    var rp=row.data;
    if(!rp || rp.id!==row.id || typeof rp.name!=="string") continue;
    if(!lp){ out.push(rp); changed=true; }
    else if(tsOf(rp.updatedAt)>tsOf(lp.updatedAt)){ out[li]=rp; changed=true; }
    else if(tsOf(lp.updatedAt)>tsOf(rp.updatedAt)){ push.push(lp); }
  }
  out=out.filter(function(x){ return !!x; });
  for(i=0;i<out.length;i++){ if(!seenRemote[out[i].id]) push.push(out[i]); }
  if(changed) out.sort(function(a,b){ return tsOf(b.createdAt)-tsOf(a.createdAt); });
  return { list:out, changed:changed, push:push };
}

function cloudReadForm(){
  var c=getCloudCfg();
  var u=document.getElementById("cl_url"), a=document.getElementById("cl_anon");
  if(u) c.url=u.value.trim().replace(/\/+$/,"");
  if(a) c.anon=a.value.trim();
  saveCloudCfg(c); return c;
}
function cloudCreds(){
  var e=document.getElementById("cl_email"), pw=document.getElementById("cl_pass");
  return { email:e?e.value.trim():"", password:pw?pw.value:"" };
}
function cloudConnectThen(fn){
  cloudReadForm();
  return cloudInit().then(function(){
    if(!cloud.client){ alert("Enter your Supabase URL and anon key first."); render(); return; }
    return fn();
  });
}
function cloudSignIn(){
  var cr=cloudCreds(); if(!cr.email || !cr.password){ alert("Enter email and password."); return; }
  cloudConnectThen(function(){
    cloudSetStatus("syncing","Signing in");
    return cloud.client.auth.signInWithPassword(cr).then(function(res){
      if(res.error){ cloudSetStatus("error", res.error.message); return; }
      return cloudAfterSignIn(res.data.user);
    }).then(function(){ render(); });
  });
}
function cloudSignUp(){
  var cr=cloudCreds(); if(!cr.email || cr.password.length<8){ alert("Enter an email and a password of at least 8 characters."); return; }
  cloudConnectThen(function(){
    return cloud.client.auth.signUp(cr).then(function(res){
      if(res.error){ cloudSetStatus("error", res.error.message); return; }
      if(res.data && res.data.session){ return cloudAfterSignIn(res.data.user).then(function(){ render(); }); }
      cloudSetStatus("signed_out","Check your email to confirm, then Sign in.");
    });
  });
}
function cloudSignOut(clearDevice){
  if(clearDevice && !confirm("Sign out and remove all projects from THIS device? (They stay in the cloud.)")) return;
  var done=function(){
    if(clearDevice) saveProjects([]);
    cloud.user=null; cloudSetStatus("signed_out"); render();
  };
  cloudFlush().then(function(){ return cloud.client ? cloud.client.auth.signOut() : null; }).then(done, done);
}
function cloudSyncNow(){
  if(!cloud.user){ alert("Sign in first."); return; }
  cloudFlush().then(cloudPull).then(function(){ render(); });
}
function cloudCard(){
  var c=getCloudCfg();
  var h='<div class="card p" style="margin-top:14px"><div class="flex-between"><b>Cloud sync (Supabase)</b><span id="cloud_status">'+cloudBadge()+'</span></div>';
  h+='<p class="help" style="margin:6px 0 12px">Sync projects across devices. Your API keys and settings stay on this device only.</p>';
  if(cloud.user){
    h+='<div class="kv"><span class="kk">Signed in as</span><span>'+esc(cloud.user.email||cloud.user.id)+'</span></div>';
    h+='<div style="margin-top:12px"><button class="btn" onclick="cloudSyncNow()">Sync now</button> '
      +'<button class="btn ghost" onclick="cloudSignOut(false)">Sign out</button> '
      +'<button class="btn ghost" onclick="cloudSignOut(true)">Sign out &amp; clear device</button></div>';
  } else {
    h+='<div class="field"><label>Supabase URL</label><input id="cl_url" type="text" value="'+esc(c.url)+'" placeholder="https://xxxx.supabase.co"></div>';
    h+='<div class="field"><label>Anon (public) key</label><input id="cl_anon" type="password" value="'+esc(c.anon)+'" placeholder="eyJ\u2026"></div>';
    h+='<div class="grid grid-2"><div class="field"><label>Email</label><input id="cl_email" type="text" autocomplete="username"></div>'
      +'<div class="field"><label>Password</label><input id="cl_pass" type="password" autocomplete="current-password"></div></div>';
    h+='<button class="btn" onclick="cloudSignIn()">Sign in</button> <button class="btn ghost" onclick="cloudSignUp()">Create account</button>';
  }
  h+='</div>';
  return h;
}

}catch(e){}
